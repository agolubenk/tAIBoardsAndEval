server {
    listen 5173;
    server_name localhost;

    # Allow larger OAuth/Better Auth session cookies in request headers.
    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;

    location = /.well-known/oauth-protected-resource/api/mcp {
        default_type application/json;
        alias /usr/share/nginx/html/mcp-oauth-resource.json;
    }

    location = /.well-known/oauth-authorization-server/api {
        default_type application/json;
        alias /usr/share/nginx/html/mcp-oauth-authorization.json;
    }

    location /.well-known/ {
        return 404;
    }

    # Root location
    # Defense in depth if a build leaves a source map in the static directory.
    location ~* \.map$ {
        return 404;
    }

    # Hashed build assets never change under the same name: a year of cache.
    # `expires` (not add_header) keeps the server-level security headers.
    # env.sh lists the few chunks it rewrites with runtime values in
    # kaneo-env-assets.inc: those revalidate, so a changed env reaches clients.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        include /etc/nginx/conf.d/kaneo-env-assets.inc;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # index.html names the hashed assets: always revalidate it.
        expires epoch;
        try_files $uri $uri/ /index.html;
    }

}
