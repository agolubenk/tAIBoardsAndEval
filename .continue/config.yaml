name: HR Helper — GLM only (Z.AI API)
version: 0.1.0
schema: v1

# ─────────────────────────────────────────────────────────────────────────────
# ОТДЕЛЬНЫЙ ассистент: весь контур работы — только через GLM по API Z.AI.
# Выбирается в пикере ассистентов Continue рядом с основным `hr-helper-v2`.
# Основной конфиг (.continue/config.yaml) этим файлом НЕ заменяется и не меняется.
#
# Зачем он нужен — один конкретный сценарий, а не «облако лучше»:
# локальный контур бывает физически занят. Консилиум (infra/ai-council/) на профилях
# fast/deep/hybrid держит модельный лок и 17–19 ГБ VRAM под L-моделью; пока идёт прогон
# по борду, Ollama отвечает медленно или ждёт освобождения лока. В этот момент основной
# конфиг, где Executor локальный, практически неработоспособен — а работать надо.
#
# ── ЦЕНА. Читать до первого сообщения ────────────────────────────────────────
# Ключ обслуживается подпиской GLM Coding Lite. Тарифицируется ВЫЗОВ за скользящее
# окно, не токены: сообщение на 20k токенов стоит столько же, сколько на 200.
# Здесь КАЖДОЕ сообщение — списанный промпт квоты, включая «ага, понял» и уточнения.
# Отсюда два следствия, которые важнее любых настроек ниже:
#   • собирать контекст и спрашивать ОДИН раз, а не дробить на пять сообщений;
#   • agent mode с инструментами делает несколько вызовов на одну задачу — на этом
#     ассистенте он дороже ровно во столько раз, сколько шагов сделает.
# Текущий расход виден в `npm run ai-council:cloud` (общий журнал на весь проект:
# и консилиум, и этот ассистент бьют в одну квоту одного ключа).
#
# ── Отличие от правил основного конфига ──────────────────────────────────────
# `.continue/rules/03-cloud-budget.md` §Права запрещает облачным моделям `edit`/`apply`
# и оставляет право на патч только локальному Executor. Здесь это ограничение снято
# ОСОЗНАННО и только внутри этого ассистента: локального Executor тут нет вовсе, и без
# edit/apply конфиг не умеет ничего, кроме разговоров. Запрет остаётся в силе для
# основного конфига — там локальный Executor есть, и облаку правки не нужны.
#
# ── Что осталось локальным намеренно ─────────────────────────────────────────
# autocomplete и embed не отданы облаку ни при каких условиях (то же правило 03):
# они срабатывают на нажатие клавиши и на переиндексацию, то есть выжгут окно квоты
# за минуты, ничего не дав взамен. Если Ollama не поднята — индексация кодовой базы
# и автодополнение просто не работают, а чат/правки на GLM работают.
#
# Ключ — только через ${{ secrets.ZAI_API_KEY }} из .continue/.env (gitignored).
# apiBase = Coding Plan. На General API (/api/paas/v4) у ЭТОГО ключа нет баланса: проверено
# живыми запросами 2026-08-13 — 429 «Insufficient balance» на всех моделях. Это разные
# биллинговые контуры одного ключа, смешивать нельзя.
# Второй контур доступен отдельной моделью в конце списка — со своим ключом
# ${{ secrets.ZAI_GENERAL_API_KEY }} и своим кошельком; выбирается руками, когда окно
# подписки кончилось и работа важнее экономии.
# ─────────────────────────────────────────────────────────────────────────────

models:
  # Единственная модель с правом менять файлы — как и в основном конфиге, право
  # на патч принадлежит ровно одной модели. Первая в списке = дефолт в пикере.
  # Взята средняя ступень лестницы, а не старшая: 4.7 справляется с правкой, а
  # 5/5.2 стоят столько же по квоте, но тратятся на рассуждения дольше.
  #
  # Маршрут через Headroom (:8787) — у каждой облачной модели две части:
  #   • apiBase `…/p/<метка>/` — метка аккаунта: дашборд Headroom (`/stats` → savings.per_project)
  #     считает расход и экономию отдельно по каждой метке (continue-zai-coding, continue-zai-general,
  #     ai-council); трафик без метки — Claude Code;
  #   • заголовки x-headroom-* — куда на самом деле идти. Без них Headroom 0.39+ клеит к
  #     OPENAI_TARGET_API_URL свой путь `/v1/chat/completions`, а у Z.AI путь `/v4/chat/completions`
  #     → 404 (тот же приём, что у консилиума, infra/ai-council/cloud.py `_route`).
  - name: GLM-4.7 — Executor (правки)
    provider: openai
    apiBase: http://127.0.0.1:8787/p/continue-zai-coding/
    model: glm-4.7
    apiKey: ${{ secrets.ZAI_API_KEY }}
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - tool_use
    contextLength: 128000
    defaultCompletionOptions:
      temperature: 0.15
      # GLM — reasoning-модели: «мысли» идут в счёт output и съедают лимит ДО ответа.
      # Замер на консилиуме 2026-08-13: при 4000 рецензия возвращала пустой content,
      # а предложение обрывалось на полуслове. На подписке длина ответа не тарифицируется,
      # поэтому потолок щедрый — тесный превращает оплаченный вызов в пустой.
      maxTokens: 16384
    requestOptions:
      timeout: 300000
      headers:
        x-headroom-base-url: https://api.z.ai/api/coding/paas/v4
        x-headroom-original-path: /chat/completions

  # Дешёвая ступень для рутины: пересказать, найти, объяснить, набросать.
  - name: GLM-4.6 — Routine (чтение)
    provider: openai
    apiBase: http://127.0.0.1:8787/p/continue-zai-coding/
    model: glm-4.6
    apiKey: ${{ secrets.ZAI_API_KEY }}
    roles:
      - chat
    contextLength: 128000
    defaultCompletionOptions:
      temperature: 0.15
      maxTokens: 16384
    requestOptions:
      timeout: 240000
      headers:
        x-headroom-base-url: https://api.z.ai/api/coding/paas/v4
        x-headroom-original-path: /chat/completions

  # Проектирование и разбор архитектуры. Выше по лестнице — только с обоснованием
  # (правило `.continue/rules/04-model-rotation.md`).
  - name: GLM-5 — Architect (проектирование)
    provider: openai
    apiBase: http://127.0.0.1:8787/p/continue-zai-coding/
    model: glm-5
    apiKey: ${{ secrets.ZAI_API_KEY }}
    roles:
      - chat
    contextLength: 128000
    defaultCompletionOptions:
      temperature: 0.15
      maxTokens: 16384
    requestOptions:
      timeout: 300000
      headers:
        x-headroom-base-url: https://api.z.ai/api/coding/paas/v4
        x-headroom-original-path: /chat/completions

  # Последняя инстанция: берётся, когда предыдущая ступень отработала и не справилась,
  # а не «сразу самая сильная» — по квоте они стоят одинаково, но дешёвая ступень
  # часто закрывает вопрос за один вызов.
  - name: GLM-5.2 — Judge (последняя инстанция)
    provider: openai
    apiBase: http://127.0.0.1:8787/p/continue-zai-coding/
    model: glm-5.2
    apiKey: ${{ secrets.ZAI_API_KEY }}
    roles:
      - chat
    contextLength: 128000
    defaultCompletionOptions:
      temperature: 0.15
      maxTokens: 16384
    requestOptions:
      timeout: 300000
      headers:
        x-headroom-base-url: https://api.z.ai/api/coding/paas/v4
        x-headroom-original-path: /chat/completions

  # Второй контур биллинга Z.AI: General API (pay-as-you-go), ОТДЕЛЬНЫЙ ключ и
  # отдельный кошелёк. Модель та же — платит другой счёт. Стоит последней в списке и
  # выбирается руками: пока в окне подписки есть вызовы, платить за то же самое незачем.
  # Ключа нет в .continue/.env → модель просто не отвечает, остальные работают.
  # До 2026-10-01 эта модель через прокси уходила на Coding-эндпоинт (OPENAI_TARGET_API_URL),
  # то есть фактически платила подписка; теперь заголовок ведёт её на General API. С ключом
  # подписки здесь — 429 «Insufficient balance», это честный ответ, а не поломка.
  - name: GLM-5.2 — General API (платный, вне подписки)
    provider: openai
    apiBase: http://127.0.0.1:8787/p/continue-zai-general/
    model: glm-5.2
    apiKey: ${{ secrets.ZAI_GENERAL_API_KEY }}
    roles:
      - chat
    contextLength: 128000
    defaultCompletionOptions:
      temperature: 0.15
      maxTokens: 16384
    requestOptions:
      timeout: 300000
      headers:
        x-headroom-base-url: https://api.z.ai/api/paas/v4
        x-headroom-original-path: /chat/completions

  # ── Локальное, не облачное: см. шапку ──────────────────────────────────────
  # Эти две роли облаку не отдаются никогда. Если Ollama не поднята — блоки просто
  # не работают, остальной конфиг работает.
  - name: Nomic Embed Text — Codebase
    provider: ollama
    model: nomic-embed-text:latest
    roles:
      - embed
    embedOptions:
      maxChunkSize: 512
      maxBatchSize: 8

context:
  - provider: code
  - provider: diff
  - provider: currentFile
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: codebase

# MCP — процессы, а не модели: квоту Z.AI они не тратят. Serena здесь особенно уместна:
# навигация по символам заменяет чтение файлов целиком, а значит уменьшает контекст,
# который уезжает в облако одним вызовом.
#
# serena и ai-council — из общего MCP-хаба (infra/mcp-hub/README.md): одна serena/LSP на все
# клиенты вместо своей копии у Continue, тот же фасад консилиума, что у Claude Code. Хаб
# поднимается `npm run mcp-hub:start`; не поднят — эти инструменты недоступны, остальное
# работает. `tags` — срез хаба: схемы инструментов уходят в каждый запрос к GLM, а github (46)
# и docker (19) агенту здесь заменяет терминал. Полный хаб — убрать `?tags=…`.
mcpServers:
  - name: hr-helper-hub
    type: streamable-http
    url: http://127.0.0.1:3050/mcp?app=continue&tags=code,project,context,docs,git,db,boards
    connectionTimeout: 60000

  # Notion снят 2026-10-30 (R-084): канон открытого — t-boards (тег `boards` хаба выше), Notion — архив
  # только для чтения; сервер с ключом на запись и автоправами нарушал заморозку.

# ─────────────────────────────────────────────────────────────────────────────
# ПРАВА НА ИНСТРУМЕНТЫ — всё автоматически, кроме пяти опасных действий.
#
# Решение владельца 2026-10-30 (d-continue-allow-all = exclude-dangerous):
# `allow: "*"` остаётся — агентский прогон, который на каждом шаге ждёт клика,
# не агентский. Запрещены пять действий: git push, gh pr merge, ssh/scp на VPS,
# сетевые запросы наружу, чтение `.env*`.
#
# ВАЖНО: ЭТОТ БЛОК СЕЙЧАС НИКТО НЕ ЧИТАЕТ — он декларация, а не защита.
# Проверено по исходникам 2026-10-30:
#   • расширение VS Code 2.1.0 — в загрузчике конфига поля `permissions` нет;
#     политики инструментов живут в состоянии webview и меняются иконкой
#     инструментов в тулбаре ввода;
#   • CLI `cn` (main) собирает права из флагов `--allow/--ask/--exclude` и
#     `~/.continue/permissions.yaml`; чтение из config.yaml там помечено
#     «when implemented». `cn` на этой машине к тому же не установлен.
# Блок держим, чтобы он заработал без правок, когда клиент начнёт его читать.
#
# ЧТО ЗАЩИЩАЕТ НА САМОМ ДЕЛЕ (IDE 2.1.0, встроенные проверки, не наш конфиг):
#   • терминал — встроенная оценка риска команды: `git push`, `gh`, ssh/scp/rsync,
#     curl/wget/nc и любая незнакомая команда спрашивают подтверждение даже при
#     политике «Automatic»;
#   • файловые инструменты — жёсткий запрет на `.env*` (список security-ignore).
# Две дыры, которые закрываются не отсюда:
#   • `fetch_url_content` (сетевой запрос наружу) считается read-only и идёт без
#     спроса — владелец выключает его руками: иконка инструментов → Excluded;
#   • `cat`/`head`/`grep .env*` в терминале считаются безопасными — держится
#     только на правиле модели (`.continue/rules/00-continue-root.md`).
#
# Следствие авто-режима для квоты: каждый шаг агента = списанный вызов Z.AI
# (тарифицируется вызов, не токены — см. шапку).
# ─────────────────────────────────────────────────────────────────────────────

permissions:
  # Всё разрешено без спроса — эквивалент `cn --allow "*"`.
  allow:
    - "*"
  # Пусто намеренно: любой инструмент здесь вернул бы диалог подтверждения.
  ask: []
  # `cn` проверяет exclude раньше allow, первое совпадение выигрывает.
  # Шаблон сравнивается со всей командой или путём целиком (^…$, `*` = любые
  # символы, включая `/`) — отсюда `*` с обеих сторон: иначе `cd x && git push`
  # прошёл бы мимо. `*.env*` ловит и `grep process.env` — сознательно: лишний
  # отказ дешевле утечки секрета.
  exclude:
    - "Bash(*git push*)"
    - "Bash(*gh pr merge*)"
    - "Bash(*ssh *)"
    - "Bash(*scp *)"
    - "Bash(*curl *)"
    - "Bash(*wget *)"
    - "Fetch"
    - "Read(*.env*)"
    - "Bash(*.env*)"
