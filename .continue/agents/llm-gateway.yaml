# MCP — процессы, а не модели: квоту Z.AI они не тратят. Serena здесь особенно уместна:
# навигация по символам заменяет чтение файлов целиком, а значит уменьшает контекст,
# который уезжает в облако одним вызовом.
#
# serena и ai-council — из общего MCP-хаба (infra/mcp-hub/README.md): одна serena/LSP на все
# клиенты вместо своей копии у Continue, тот же фасад консилиума, что у Claude Code. Хаб
# поднимается `npm run mcp-hub:start`; не поднят — эти инструменты недоступны, остальное
# работает. `tags` — срез хаба: схемы инструментов уходят в каждый запрос к GLM, а github (46)
# и docker (19) агенту здесь заменяет терминал. Полный хаб — убрать `?tags=…`.
mcpServers:
  - name: hr-helper-hub
    type: streamable-http
    url: http://127.0.0.1:3050/mcp?app=continue&tags=code,project,context,docs,git,db
    connectionTimeout: 60000

  - name: notion
    command: /usr/local/bin/npx
    args:
      - "-y"
      - "@notionhq/notion-mcp-server"
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_API_KEY }}
      OPENAPI_MCP_HEADERS: '{"Authorization":"Bearer ${{ secrets.NOTION_API_KEY }}","Notion-Version":"2022-06-28"}'
    connectionTimeout: 60000

# ─────────────────────────────────────────────────────────────────────────────
# ПРАВА НА ИНСТРУМЕНТЫ — всё автоматически, без ручного подтверждения.
#
# По умолчанию Continue пускает без спроса только read-only инструменты, а запись
# и терминал спрашивают каждый раз. Здесь это снято сознательно: агентский прогон,
# который на каждом шаге ждёт клика, не агентский.
#
# ЧТО ЭТО ЗНАЧИТ НА ПРАКТИКЕ — три следствия, о которых стоит знать заранее:
#   • правки файлов и команды терминала выполняются сразу, отменять их придётся
#     через git, а не отказом в диалоге. Работать на грязном дереве — плохая идея;
#   • на этом ассистенте каждый шаг агента = списанный вызов квоты Z.AI (тарифи-
#     цируется вызов, не токены — см. шапку). Авто-режим снимает единственный
#     естественный тормоз, поэтому длинная задача съедает окно быстрее;
#   • `*` покрывает и разрушительное (`rm`, `git push --force`). Ограничение
#     ставится точечно, например: exclude: ["Bash(rm -rf*)", "Bash(git push*)"].
#
# ВАЖНО ПРО ОБЛАСТЬ ДЕЙСТВИЯ. Этот блок читает CLI `cn`. Расширение VS Code 2.0.0
# его НЕ читает — проверено по бандлу: в загрузчике конфига (`nonNullifyConfigYaml`
# / `configYamlToContinueConfig`) поля `permissions` нет вовсе, политики инструментов
# живут в per-user состоянии webview (redux-persist в localStorage) и меняются
# иконкой инструментов в тулбаре ввода: политика «Automatic» на группу или на
# конкретный инструмент. То есть в IDE это по-прежнему один разовый тумблер руками,
# и починить его из YAML нельзя — блок ниже работает для `cn` и станет рабочим в
# IDE, когда расширение начнёт читать конфиг.
# ─────────────────────────────────────────────────────────────────────────────

permissions:
  # Всё разрешено без спроса — эквивалент `cn --allow "*"`.
  allow:
    - "*"
  # Пусто намеренно: любой инструмент здесь вернул бы диалог подтверждения,
  # ради снятия которого блок и написан.
  ask: []
  exclude: []
