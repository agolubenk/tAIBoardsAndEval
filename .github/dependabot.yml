version: 2
updates:
  # The pnpm workspace (and its single shared pnpm-lock.yaml) now lives in
  # boards/, so dependabot must run from there to regenerate the lockfile.
  - package-ecosystem: "npm"
    directory: "/boards"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    groups:
      # Batch all non-major updates into a single PR to minimise lockfile churn.
      # Major bumps still open individually so they keep getting reviewed.
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
