}

/* ── обучение (§9) — данные и хелперы; UI-секция живёт на вкладке «Качество» ──
   Блок отвечает на вопрос, который до него не имел ответа нигде: «мои вердикты
   куда-нибудь деваются?». Поэтому показан весь путь сигнала, а не только его
   итог: сколько прогонов ждут вердикта → сколько вердиктов учтено → во что они
   превратились (α/β) → на что это уже влияет (веса рецензий, подбор ролей).
   Всё, что система ПРЕДЛАГАЕТ (перестановка ролей, дополнение рубрики), помечено
   как предложение: правка промптов — коммит в git, а не побочный эффект сервиса. */
let learnModule = "*";
const BASIS_NOTE = {
  role: "по этой же роли", model: "по репутации модели",
  model_global: "по репутации модели в целом", prior: "данных нет",
};

function reliabilityBar(v) {
  const pct = Math.round((v || 0) * 100);
  const cls = pct >= 66 ? "bar" : pct >= 33 ? "bar warn" : "bar bad";
  return `<div class="${cls}" style="min-width:70px"><span style="width:${pct}%"></span></div>`;
}

/* ── лента: прогоны и события (объединены 2026-08-21) ─────────────────── */
let runFilter = "";
let feedGen = 0; // монотонный счётчик поколений renderFeed()/renderRunsTable() — сравнение по
                 // значению runFilter не различает "A(v)→B(v2)→C(v)" с резолвом не по порядку старта
function feedCountCards(q) {
  const cur = (q.running || 0) + (q.queued || 0);
  const past = (q.done || 0) + (q.abstained || 0) + (q.failed || 0);
  return `
      <div class="card">
        <h3>Текущие прогоны</h3>
        <div class="big ${cur ? "" : "faint"}">${cur}</div>
        <div class="sub">в работе: ${q.running || 0} · в очереди: ${q.queued || 0}</div>
      </div>
      <div class="card">
        <h3>Прошедшие прогоны</h3>
        <div class="big">${past}</div>
        <div class="sub">с результатом: ${q.done || 0} · воздержались: ${q.abstained || 0}
          · с ошибкой: ${q.failed || 0}</div>
      </div>`;
}
function updateFeedCounts(s) {
  const el = $("#feed-counts");
  if (el) el.innerHTML = feedCountCards(s.queue || {});
}
function runsTableHtml(rows) {
  return `<div class="tablewrap"><table>
        <thead><tr><th>Карточка</th><th>Профиль</th><th>Статус</th><th>Готовность</th>
          <th>Уверенность</th><th>Время</th><th>Вердикт</th></tr></thead>
        <tbody>${rows.map(runRow).join("") || emptyRow(7, "прогонов нет")}</tbody>
      </table></div>`;
}
async function renderFeed() {
  const myFilter = runFilter;
  const myGen = ++feedGen;
  const [rows, st] = await Promise.all([
    api("/api/runs?limit=200" + (myFilter ? "&status=" + myFilter : "")),
    api("/api/state"),
  ]);
  if (myGen !== feedGen) return; // более свежий renderFeed()/renderRunsTable() уже победил (счётчик поколений, не сравнение значения — переживает возврат к тому же runFilter)
  const opts = ["", "done", "abstained", "queued", "running", "failed"].map((v) =>
    `<option value="${v}"${v === myFilter ? " selected" : ""}>${v || "все статусы"}</option>`).join("");
  $("#tab-feed").innerHTML = `
    <div class="grid" id="feed-counts">${feedCountCards(st.queue || {})}</div>
    <div class="card" style="margin-top:12px">
      <h3>Живая лента</h3>
      <div class="feed" id="feed"><div class="faint">ждём событий…</div></div>
    </div>
    <div class="card" style="margin-top:12px; padding:0">
      <div class="row" style="padding:14px 14px 10px; justify-content:space-between; flex-wrap:wrap">
        <h3 style="margin:0">Прогоны</h3>
        <div class="row" style="gap:8px">
          <select id="f-status">${opts}</select>
          <span class="sub" id="f-count">${rows.length} прогонов</span>
        </div>
      </div>
      <div id="runs-wrap">${runsTableHtml(rows)}</div>
    </div>`;
  feedEl = $("#feed");
  // Лента заполняется с сервера, а не из памяти вкладки: счётчик на таблетке считает
  // события и до загрузки страницы, и открытая лента должна их показать. Новые с
  // прошлого просмотра подсвечены; после рендера всё считается просмотренным.
  // Первый заход браузера (места ещё нет) — подсвечивать нечего: «новое» начинается сейчас.
  const seenBefore = feedSeen === null ? Infinity : feedSeen;
  try {
    const tail = await api("/api/events?tail=" + FEED_MAX);
    if (myGen !== feedGen) return;
    if (tail.length) {
      feedEl.innerHTML = "";
      // Хвост известен и до ответа /api/events/unread (диплинк #feed при загрузке):
      // иначе markFeedSeen запомнил бы 0, и следующая загрузка показала бы «999+».
      feedLatest = Math.max(feedLatest, Number(tail[tail.length - 1].id) || 0);
    }
    tail.forEach((ev) => appendFeed(ev, true, ev.id > seenBefore));
  } catch (e) { /* лента не критична — прогоны ниже уже отрисованы */ }
  markFeedSeen();
  $("#f-status").onchange = (e) => { runFilter = e.target.value; renderFeed(); };
  bindRunRows("#tab-feed");
}

/* Обновление только таблицы прогонов: SSE-событие (прогон завершён, вердикт, статус)
   прилетает чаще, чем меняется что-то ещё, а полный re-render вкладки дёргал бы
   ленту и селектор фильтра под рукой пользователя. */
async function renderRunsTable() {
  const wrap = $("#runs-wrap");
  if (!wrap) return;
  const myFilter = runFilter;
  const myGen = ++feedGen;
  const rows = await api("/api/runs?limit=200" + (myFilter ? "&status=" + myFilter : ""));
  if (myGen !== feedGen) return; // более свежий renderFeed()/renderRunsTable() уже победил (счётчик поколений, не сравнение значения)
  wrap.innerHTML = runsTableHtml(rows);
  const cnt = $("#f-count");
  if (cnt) cnt.textContent = `${rows.length} прогонов`;
  bindRunRows("#tab-feed");
}

/* Прогон ушёл в облако после долгого ожидания памяти (§17.4) — или ждёт облако. */
function runCloudTag(r) {
  // Режим «всё на GLM 5.x» (§17.6): прогон отмечен им при постановке или прошёл в нём.
  // Отложен режимом до освобождения окна подписки — не воздержание, а ожидание облака.
  if (r.status === "queued" && String(r.error || "").startsWith("GLM 5.x ждёт облако"))
    return ` <span class="tag warn" title="${esc(r.error)}">GLM 5.x ждёт окно</span>`;
  if (r.cloud_mode === "glm5")
    return ` <span class="tag cloud" title="все роли — GLM 5.x (Coding Plan), локально только эмбеддинги">GLM 5.x</span>`;
  let e = null;
  try { e = r.escalation ? JSON.parse(r.escalation) : null; } catch (err) { e = null; }
  if (e && e.state === "done") {
    const models = Object.entries(e.models || {}).map(([k, v]) => `${k}: ${v.from} → ${v.to}`).join("; ");
    return ` <span class="tag cloud" title="${esc(`ждал памяти ${Math.round((e.waited_s || 0) / 60)} мин → ${e.provider}. ${models}`)}">☁ облако</span>`;
  }
  if (e && e.state === "gave_up" && r.status === "queued")
    return ` <span class="tag warn" title="${esc(`облако отложено до ${new Date(e.retry_at * 1000)
      .toLocaleString("ru-RU")}: ${e.deferrals} откладываний, потрачено ${e.calls_spent || 0} вызовов`)}">☁ облако отложено</span>`;
  if (e && e.state === "waiting_cloud" && r.status === "queued")
    return ` <span class="tag warn" title="${esc(e.why || "")}">☁ ждёт облако</span>`;
  if (r.mem_wait_since && r.status === "queued")
    return ` <span class="tag" title="ждёт памяти с ${new Date(r.mem_wait_since * 1000).toLocaleString("ru-RU")}">⏳ ${ago(r.mem_wait_since)}</span>`;
  return "";
}

function runRow(r) {
  const sev = r.severity || r.priority || "";
  return `<tr class="clickable" data-run="${esc(r.id)}">
    <td class="wrap">
      <div>${esc(r.title || r.card_id || "—")}</div>
      <div class="sub">
        ${sev ? `<span class="tag ${esc(sev)}">${esc(sev)}</span> ` : ""}
        <span class="tag">${esc(r.db || "?")}</span>
        ${r.half_baked ? '<span class="tag warn">half-baked</span>' : ""}
        ${r.outcome ? " " + esc(String(r.outcome).slice(0, 90)) : ""}
      </div>
    </td>
    <td><span class="tag ${["hybrid", "cloud"].includes(r.profile) ? "cloud" : ""}">${esc(r.profile)}</span>${runCloudTag(r)}</td>
    <td><span class="tag ${esc(r.status)}">${esc(r.status)}</span></td>
    <td class="mono">${num(r.readiness)}</td>
    <td class="mono">${num(r.confidence)}</td>
    <td class="sub">${dur(r.wall_ms)}<br><span class="faint">${ago(r.finished_at || r.started_at)} назад</span></td>
    <td>${r.verdict ? `<span class="tag ${r.verdict === "accept" ? "done"
      : r.verdict === "reject" ? "failed" : "running"}">${esc(r.verdict)}</span>`
      : '<span class="faint">—</span>'}</td>
  </tr>`;
}

/* ── разбор прогона ───────────────────────────────────────────────────── */
async function openRun(runId) {
  const d = await api("/api/runs/" + encodeURIComponent(runId));
  if (!d.run) return toast("прогон не найден", true);
  const r = d.run, p = r.payload || {};
  $("#m-title").textContent = r.title || r.card_id || runId;
  $("#m-sub").innerHTML =
    `<span class="tag ${esc(r.status)}">${esc(r.status)}</span>
     <span class="tag ${["hybrid", "cloud"].includes(r.profile) ? "cloud" : ""}">${esc(r.profile)}</span>
     <span class="tag">${esc(r.track || "")}</span>
     готовность <span class="mono">${num(r.readiness)}</span> ·
     уверенность <span class="mono">${num(r.confidence)}</span> · ${dur(r.wall_ms)}
     ${r.url ? ` · <a href="${esc(r.url)}" target="_blank">Notion ↗</a>` : ""}`;

  const parts = [];
  if (r.outcome) parts.push(`<div class="card" style="border-color:var(--warn-bd)">
    <h3>Почему консилиум не дал результат</h3>${esc(r.outcome)}</div>`);

  if (p.statement || p.decomposition) {
    parts.push(`<div class="card">
      <h3>Постановка</h3>
      <div><b>${esc(p.statement?.goal || "—")}</b></div>
      ${(p.statement?.non_goals || []).length ? `<div class="sub" style="margin-top:6px">
        не входит: ${esc(p.statement.non_goals.join("; "))}</div>` : ""}
      ${listBlock("Декомпозиция", (p.decomposition || []).map((s) =>
        `${esc(s.what || "")} <span class="faint mono">${esc((s.files || []).join(", "))}</span>`
        + (s.est ? ` <span class="tag">${esc(s.est)}</span>` : "")))}
      ${listBlock("Критерии приёмки", (p.acceptance || []).map(esc))}
      ${listBlock("Риски", (p.risks || []).map((x) => typeof x === "string" ? esc(x)
        : `${esc(x.what || "")} <span class="tag ${esc(x.severity || "")}">${esc(x.severity || "")}</span>
           <span class="faint">${esc(x.mitigation || "")}</span>`))}
      ${listBlock("Открытые вопросы", (p.open_questions || []).map(esc))}
      ${p.verification_cmd ? `<div style="margin-top:10px"><span class="faint">проверка:</span>
        <code>${esc(p.verification_cmd)}</code></div>` : ""}
      ${(p.removed_by_verifier || []).length ? `<div style="margin-top:10px" class="warn-txt">
        вырезано верификатором: ${esc(p.removed_by_verifier.join("; "))}</div>` : ""}
    </div>`);
  }

  const touched = p.touched || {};
  const trows = Object.entries(touched).filter(([, v]) => (v || []).length)
    .map(([k, v]) => `<div><span class="faint">${esc(k)}:</span>
      <span class="mono">${esc((v || []).join(", "))}</span></div>`).join("");
  if (trows) parts.push(`<div class="card"><h3>Затронуто</h3>${trows}</div>`);

  if ((d.proposals || []).length) {
    const byProp = {};
    (d.verifications || []).forEach((v) => { byProp[v.proposal_id] = v; });
    parts.push(`<div class="card"><h3>Предложения участников</h3>` + d.proposals.map((pr) => {
      const v = byProp[pr.id] || {};
      const halls = (v.hallucinations || []).map((h) =>
        `<li class="bad-txt">${esc(h.kind)}: <span class="mono">${esc(h.ref)}</span>
         ${h.hint ? `<span class="faint">— ${esc(h.hint)}</span>` : ""}</li>`).join("");
      const defects = (v.checked || []).filter((c) => !c.ok &&
        !(v.hallucinations || []).some((h) => h.ref === c.ref)).map((c) =>
        `<li class="warn-txt">${esc(c.kind)}: <span class="mono">${esc(c.ref)}</span>
         ${c.hint ? `<span class="faint">— ${esc(c.hint)}</span>` : ""}</li>`).join("");
      const okCount = (v.checked || []).filter((c) => c.ok).length;
      return `<details><summary>
          <b>${esc(pr.role)}</b> · <span class="mono">${esc(pr.model)}</span>
          · оценка <span class="mono">${num(pr.review_score, 1)}/15</span>
          · подтверждено <span class="mono">${okCount}/${(v.checked || []).length}</span>
          ${(v.hallucinations || []).length
            ? `<span class="tag bad">${v.hallucinations.length} выдумок</span>` : ""}
        </summary><div>
          ${halls ? `<div><b class="bad-txt">Не существует (вето):</b><ul class="tight">${halls}</ul></div>` : ""}
          ${defects ? `<div><b class="warn-txt">Дефекты (не вето):</b><ul class="tight">${defects}</ul></div>` : ""}
          <pre class="dump">${esc(JSON.stringify(pr.payload, null, 1))}</pre>
        </div></details>`;
    }).join("") + `</div>`);
  }

  if ((d.reviews || []).length) {
    parts.push(`<div class="card" style="padding:0"><h3 style="padding:14px 14px 0">Рецензии</h3>
      <div class="tablewrap"><table>
      <thead><tr><th>Рецензент</th><th>Кого</th><th>Рубрика</th><th>Возражения</th></tr></thead>
      <tbody>${d.reviews.map((rv) => `<tr>
        <td class="mono">${esc(rv.reviewer_role || "")}<br><span class="faint">${esc(rv.reviewer_model)}</span></td>
        <td class="mono">${esc(rv.target_proposal)}</td>
        <td class="mono">${esc(Object.entries(rv.scores || {}).map(([k, x]) => k + "=" + x).join("  "))}</td>
        <td class="wrap">${(rv.objections || []).map(esc).join("<br>") || '<span class="faint">—</span>'}</td>
      </tr>`).join("")}</tbody></table></div></div>`);
  }

  if ((d.cloud || []).length) {
    parts.push(`<div class="card" style="border-color:var(--cloud-bd); padding:0">
      <h3 style="padding:14px 14px 0">Облачные вызовы</h3><div class="tablewrap"><table>
      <thead><tr><th>Модель</th><th>Роль</th><th>Токены</th><th>Время</th><th></th></tr></thead>
      <tbody>${d.cloud.map((c) => `<tr>
        <td class="mono">${esc(c.model)}</td><td>${esc(c.role)}</td>
        <td class="mono">${c.tokens_in}+${c.tokens_out}</td><td>${dur(c.ms)}</td>
        <td>${c.ok ? '<span class="ok-txt">✓</span>'
          : `<span class="bad-txt">⊘ ${esc(c.refused || c.error || "")}</span>`}</td>
      </tr>`).join("")}</tbody></table></div></div>`);
  }

  parts.push(`<details><summary>Полный транскрипт — ${(d.messages || []).length} вызовов
    (клик по строке раскрывает промпт и ответ)</summary><div><div class="tablewrap"><table>
    <thead><tr><th>Раунд</th><th>Роль</th><th>Модель</th><th>Токены</th><th>Время</th><th></th></tr></thead>
    <tbody>${(d.messages || []).map((m) => `<tr class="clickable" data-msg="${m.id}">
      <td class="mono">R${m.round}</td><td>${esc(m.role)}</td><td class="mono">${esc(m.model)}</td>
      <td class="mono">${m.tokens_in}+${m.tokens_out}</td><td>${dur(m.ms)}</td>
      <td>${m.ok ? '<span class="ok-txt">✓</span>' : '<span class="bad-txt">✗</span>'}</td>
    </tr>`).join("")}</tbody></table></div></div></details>`);

  if ((d.verdicts || []).length) {
    parts.push(`<div class="card"><h3>История вердиктов</h3>` + d.verdicts.map((v) =>
      `<div class="row" style="justify-content:space-between; padding:4px 0">
        <span><span class="tag ${v.decision === "accept" ? "done"
          : v.decision === "reject" ? "failed" : "running"}">${esc(v.decision)}</span>
        ${esc(v.comment || "")}</span>
        <span class="faint">${ago(v.created_at)} назад</span></div>`).join("") + `</div>`);
  }

  $("#m-body").innerHTML = parts.join("");
  document.querySelectorAll("#m-body tr[data-msg]").forEach((tr) => {
    tr.onclick = () => openMessage(tr.dataset.msg);
  });

  $("#m-foot").innerHTML = `
    <input type="text" id="v-comment" placeholder="комментарий к вердикту (необязательно)"
           style="flex:1; min-width:220px">
    <button class="act ok" data-v="accept">Принять</button>
    <button class="act accent" data-v="edit">Принять с правками</button>
    <button class="act bad" data-v="reject">Отклонить</button>`;
  $("#m-foot").querySelectorAll("button[data-v]").forEach((b) => {
    b.onclick = async () => {
      try {
        await post("/api/verdict", { run_id: runId, decision: b.dataset.v,
                                     comment: $("#v-comment").value });
        toast("вердикт «" + b.dataset.v + "» записан");
        $("#modal").close();
        render();
      } catch (e) { toast(e.message, true); }
    };
  });
  $("#modal").showModal();
}

function listBlock(title, items) {
  if (!items || !items.length) return "";
  return `<div style="margin-top:10px"><div class="faint">${esc(title)}</div>
    <ul class="tight">${items.map((i) => "<li>" + i + "</li>").join("")}</ul></div>`;
}

async function openMessage(id) {
  const m = await api("/api/messages/" + id);
  const w = window.open("", "_blank", "width=920,height=820");
  if (!w) return toast("браузер заблокировал окно", true);
  w.document.title = `${m.role} · ${m.model}`;
  const style = w.document.createElement("style");
  style.textContent = `body{background:#0e1116;color:#e6edf3;font:13px/1.55 ui-monospace,Menlo,monospace;padding:18px}
    h2{font-size:12px;color:#9aa7b8;text-transform:uppercase;letter-spacing:.6px;margin:18px 0 6px}
    pre{white-space:pre-wrap;word-break:break-word;background:#161b22;padding:12px;border-radius:8px;margin:0}`;
  w.document.head.appendChild(style);
  const add = (title, text) => {
    const h = w.document.createElement("h2"); h.textContent = title;
    const pre = w.document.createElement("pre"); pre.textContent = text || "—";
    w.document.body.append(h, pre);
  };
  add(`${m.role} · ${m.model} · раунд ${m.round} · ${m.tokens_in}+${m.tokens_out} токенов`, "");
  add("Промпт", m.prompt);
  add("Ответ", m.response);
}

/* ── карточки борда ───────────────────────────────────────────────────── */
let cardQuery = "", cardDb = "", cardProfile = "fast", cardOnlyHalf = false;
let STATUSES = {};
const selected = new Set();      // выбранная серия, переживает перерисовку по фильтру
async function renderCards() {
  const [rows, models] = await Promise.all([
    api(`/api/cards?limit=400&db=${encodeURIComponent(cardDb)}&q=${encodeURIComponent(cardQuery)}`),
    STATUSES.tasks ? Promise.resolve(null) : api("/api/statuses"),
  ]);
  if (models) STATUSES = models;
  const shown = cardOnlyHalf ? rows.filter((c) => c.half_baked) : rows;

  // Выбранное переживает перерисовку по фильтру: собирать серию из 20 карточек,
  // теряя отметки при каждом уточнении поиска, невозможно.
  const visibleIds = new Set(shown.map((c) => c.card_id));
  [...selected].forEach((id) => { if (!visibleIds.has(id)) { /* оставляем */ } });

  $("#tab-cards").innerHTML = `
    <div class="toolbar">
      <input type="text" id="c-q" placeholder="поиск по названию или Backlog ID"
             value="${esc(cardQuery)}" style="min-width:240px">
      <select id="c-db">
        <option value="">обе базы</option>
        <option value="bugs"${cardDb === "bugs" ? " selected" : ""}>Ошибки</option>
        <option value="tasks"${cardDb === "tasks" ? " selected" : ""}>Задачи</option>
      </select>
      <label class="row" style="gap:6px"><input type="checkbox" id="c-half"
        ${cardOnlyHalf ? "checked" : ""}> <span class="sub">только half-baked</span></label>
      <button class="act" id="c-all">Отметить показанные</button>
      <button class="act" id="c-none">Снять отметки</button>
      <span class="spacer"></span>
      <span class="sub">${shown.length} карточек</span>
      <button class="act accent" id="c-series" ${selected.size ? "" : "disabled"}>
        Прогнать серию (${selected.size})</button>
    </div>
    <div class="card" style="padding:0">
      <div class="tablewrap"><table>
        <thead><tr><th style="width:34px"></th><th>Карточка</th><th>Статус</th><th>Важность</th>
          <th>Прогонов</th><th>Готовность</th><th>Указание</th><th></th></tr></thead>
        <tbody>${shown.map(cardRow).join("") || emptyRow(8, "ничего не найдено")}</tbody>
      </table></div>
    </div>`;

  $("#c-q").oninput = debounce((e) => { cardQuery = e.target.value; renderCards(); }, 320);
  $("#c-db").onchange = (e) => { cardDb = e.target.value; renderCards(); };
  $("#c-half").onchange = (e) => { cardOnlyHalf = e.target.checked; renderCards(); };
  $("#c-all").onclick = () => { shown.forEach((c) => selected.add(c.card_id)); renderCards(); };
  $("#c-none").onclick = () => { selected.clear(); renderCards(); };
  $("#c-series").onclick = () => openSeries(rows);
  document.querySelectorAll("#tab-cards [data-open]").forEach((el) => {
    el.onclick = () => openCard(el.dataset.open);
  });
  document.querySelectorAll("#tab-cards [data-pick]").forEach((el) => {
    el.onchange = () => {
      if (el.checked) selected.add(el.dataset.pick); else selected.delete(el.dataset.pick);
      $("#c-series").disabled = selected.size === 0;
      $("#c-series").textContent = `Прогнать серию (${selected.size})`;
    };
  });
}

function cardRow(c) {
  const sev = c.severity || c.priority || "";
  let mods = [];
  try { mods = JSON.parse(c.modules || "[]"); } catch (e) { mods = []; }
  return `<tr>
    <td><input type="checkbox" data-pick="${esc(c.card_id)}"
         ${selected.has(c.card_id) ? "checked" : ""}></td>
    <td class="wrap">
      <div>${esc(c.title)}</div>
      <div class="sub chip-row" style="margin-top:4px">
        <span class="tag${c.db === "draft" ? " warn" : ""}">${c.db === "draft"
          ? "черновик — нет в Notion" : esc(c.db)}</span>
        ${c.backlog_id ? `<span class="tag mono" title="${esc(c.backlog_id)}">${
          esc(c.backlog_id.length > 40 ? c.backlog_id.slice(0, 38) + "…" : c.backlog_id)}</span>` : ""}
        ${c.half_baked ? '<span class="tag warn">HALF-BAKED — не брать в работу</span>' : ""}
        ${mods.slice(0, 3).map((m) => `<span class="tag">${esc(m)}</span>`).join("")}
      </div>
    </td>
    <td><span class="tag">${esc(c.status || "—")}</span></td>
    <td>${sev ? `<span class="tag ${esc(sev)}">${esc(sev)}</span>` : '<span class="faint">—</span>'}</td>
    <td class="mono">${c.runs || 0}</td>
    <td class="mono">${num(c.readiness)}</td>
    <td class="sub wrap">${c.note ? esc(String(c.note).slice(0, 70)) : '<span class="faint">—</span>'}</td>
    <td><button class="act" data-open="${esc(c.card_id)}">Открыть</button></td>
  </tr>`;
}

/* Радио-выбор профиля запуска — общий рендер для openSeries/openCard/renderHome (DRY). */
function renderProfileRadios(models, radioName, selectedName, warnText) {
  const rows = Object.entries(models.profiles || {}).map(([name, p]) => `
    <label class="field"><span><b>${esc(name)}</b>
      <span class="sub">${esc(Object.entries(p.roles)
        .filter(([k]) => k.startsWith("proposer") || k === "arbiter")
        .map(([k, v]) => k.replace("proposer.", "") + ": " + v).join(" · "))}</span></span>
      <input type="radio" name="${radioName}" value="${esc(name)}"
        ${name === selectedName ? "checked" : ""}
        ${p.uses_cloud.length && !models.cloud_enabled ? "disabled" : ""}></label>`).join("");
  const warn = !models.cloud_enabled
    ? `<div class="sub warn-txt" style="margin-top:8px">${esc(warnText)}</div>` : "";
  return rows + warn + glmOption(models, radioName);
}
/* «GLM 5.x» на одну задачу (§17.6): тот же профиль и трек, но все роли — в Coding Plan.
   Режим включён в шапке — галочка уже стоит и заблокирована: он и так действует на всё. */
function glmOption(models, name) {
  const g = models.glm || {};
  const global = !!g.effective;
  const disabled = global || !models.cloud_enabled;
  const why = global ? "режим включён в шапке — действует на все задачи"
    : !models.cloud_enabled ? "нужно включённое облако"
    : `все роли → GLM 5.x (${glmModelsText(g)}), локально только эмбеддинги; до
       ${Number(g.max_calls_per_run) || 0} облачных вызовов на прогон`;
  return `<label class="field" style="margin-top:6px"><span><b>GLM 5.x</b>
      <span class="sub">${esc(why)}</span></span>
    <input type="checkbox" id="${name}-glm" ${global ? "checked" : ""} ${disabled ? "disabled" : ""}></label>`;
}
// Отметка задачи для запроса: только явная галочка (глобальный режим сервер знает сам).
const glmChoice = (name) => {
  const el = document.getElementById(name + "-glm");
  return el && el.checked && !el.disabled ? "glm5" : "";
};

/* Серия карточек: профиль, комментарий к запуску, окно времени, оценка. */
async function openSeries(allCards) {
  const models = await api("/api/models");
  const chosen = allCards.filter((c) => selected.has(c.card_id));
  const half = chosen.filter((c) => c.half_baked).length;

  const fmtLocal = (d) => {
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  const now = new Date();
  const tonight = new Date(now); tonight.setHours(23, 30, 0, 0);
  const morning = new Date(now); morning.setDate(morning.getDate() + 1); morning.setHours(7, 30, 0, 0);

  $("#m-title").textContent = `Серия из ${chosen.length} карточек`;
  $("#m-sub").innerHTML = `<span class="tag">${chosen.filter((c) => c.db === "bugs").length} ошибок</span>
    <span class="tag">${chosen.filter((c) => c.db === "tasks").length} задач</span>
    ${half ? `<span class="tag warn">${half} half-baked — пойдут отдельным треком</span>` : ""}`;

  $("#m-body").innerHTML = `
    <div class="card">
      <h3>Кто будет работать</h3>
      ${renderProfileRadios(models, "sprof", cardProfile,
        "Облачные профили выключены — включить на вкладке «Обзор», карточка «Облако — состояние».")}
    </div>

    <div class="card">
      <h3>Комментарий к запуску</h3>
      <div class="sub" style="margin-bottom:8px">Пойдёт как указание владельца к КАЖДОЙ карточке
        серии: в капсулу, с приоритетом выше выводов из кода. Перезапишет прежние указания
        по этим карточкам.</div>
      <textarea id="s-note" rows="3"
        placeholder="например: смотреть только на бэкенд; не предлагать миграций схемы"></textarea>
    </div>

    <div class="card">
      <h3>Окно запуска</h3>
      <div class="sub" style="margin-bottom:8px">Раньше начала карточки не берутся, после конца —
        снимаются из очереди. Проверяется воркером при захвате, а не только здесь.</div>
      <label class="field"><span>Начать не раньше</span>
        <input type="datetime-local" id="s-start" value="${fmtLocal(tonight)}"></label>
      <label class="field"><span>Не начинать новые после</span>
        <input type="datetime-local" id="s-end" value="${fmtLocal(morning)}"></label>
      <div class="row" style="margin-top:8px">
        <button class="act" id="s-now">Начать сразу</button>
        <button class="act" id="s-noend">Без ограничения по концу</button>
      </div>
    </div>

    <div class="card" id="s-estimate"><h3>Оценка</h3><div class="faint">считаю…</div></div>`;

  $("#m-foot").innerHTML = `<span class="spacer"></span>
    <button class="act accent" id="s-go">Поставить серию в очередь</button>`;

  async function refreshEstimate() {
    const prof = document.querySelector('input[name="sprof"]:checked');
    const profile = prof ? prof.value : cardProfile;
    const e = await api(`/api/estimate?profile=${encodeURIComponent(profile)}&count=${chosen.length}` +
                        `&cloud_mode=${glmChoice("sprof")}`);
    const hours = Math.floor(e.total_seconds / 3600), mins = Math.round((e.total_seconds % 3600) / 60);
    const startEl = $("#s-start").value, endEl = $("#s-end").value;
    let verdict = "";
    if (startEl && endEl) {
      const windowSec = (new Date(endEl) - new Date(startEl)) / 1000;
      verdict = windowSec <= 0 ? '<span class="bad-txt">конец окна раньше начала</span>'
        : e.total_seconds > windowSec
          ? `<span class="warn-txt">в окно (${Math.round(windowSec / 3600)} ч) не помещается —
             успеет примерно ${Math.floor(windowSec / (e.per_card_seconds || 1))} из ${chosen.length},
             остальные снимутся</span>`
          : `<span class="ok-txt">помещается в окно (${Math.round(windowSec / 3600)} ч)</span>`;
    }
    $("#s-estimate").innerHTML = `<h3>Оценка</h3>
      <div class="kv">
        <div>карточек</div><div class="mono">${chosen.length}</div>
        <div>на карточку</div><div class="mono">≈ ${e.per_card_seconds} с
          ${e.measured_on ? `<span class="faint">(по ${e.measured_on} прошлым прогонам)</span>`
            : '<span class="faint">(своих замеров нет, грубый ориентир)</span>'}</div>
        <div>всего</div><div class="mono">≈ ${hours ? hours + " ч " : ""}${mins} мин</div>
        ${e.cloud_calls ? `<div>облачных вызовов</div>
          <div class="mono">до ${e.cloud_calls} <span class="faint">— сверьтесь с окном подписки${
            e.glm ? ` (GLM 5.x: ${Number(e.glm_window?.max) || 0} за ${Number(e.glm_window?.hours) || 0} ч)` : ""}</span></div>` : ""}
      </div>
      <div style="margin-top:10px">${verdict}</div>`;
  }
  document.querySelectorAll('input[name="sprof"]').forEach((r) => { r.onchange = refreshEstimate; });
  const sGlm = $("#sprof-glm");
  if (sGlm) sGlm.onchange = refreshEstimate;
  $("#s-start").onchange = refreshEstimate;
  $("#s-end").onchange = refreshEstimate;
  $("#s-now").onclick = () => { $("#s-start").value = fmtLocal(new Date()); refreshEstimate(); };
  $("#s-noend").onclick = () => { $("#s-end").value = ""; refreshEstimate(); };
  refreshEstimate();

  $("#s-go").onclick = async () => {
    const prof = document.querySelector('input[name="sprof"]:checked');
    const toTs = (v) => v ? Math.floor(new Date(v).getTime() / 1000) : null;
    try {
      const r = await post("/api/enqueue-batch", {
        card_ids: [...selected], profile: prof ? prof.value : cardProfile,
        note: $("#s-note").value, start_at: toTs($("#s-start").value),
        deadline: toTs($("#s-end").value), cloud_mode: glmChoice("sprof"),
      });
      toast(`серия ${r.batch_id}: поставлено ${r.queued}` +
            (r.skipped ? `, пропущено ${r.skipped}` : ""));
      selected.clear();
      $("#modal").close();
      renderCards();
    } catch (e) { toast(e.message, true); }
  };
  $("#modal").showModal();
}

/* Карточка: указания владельца, статус, запуск с выбором профиля и ролей. */
async function openCard(cardId) {
  const [cards, notes, models] = await Promise.all([
    api(`/api/cards?limit=400&q=`), api("/api/notes/" + encodeURIComponent(cardId)),
    api("/api/models"),
  ]);
  const c = cards.find((x) => x.card_id === cardId);
  if (!c) return toast("карточка не найдена", true);

  $("#m-title").textContent = c.title;
  $("#m-sub").innerHTML = `<span class="tag">${esc(c.db)}</span>
    <span class="tag">${esc(c.status || "—")}</span>
    ${c.half_baked ? '<span class="tag warn">HALF-BAKED</span>' : ""}
    ${c.backlog_id ? `<span class="tag mono">${esc(c.backlog_id)}</span>` : ""}
    ${c.url ? ` · <a href="${esc(c.url)}" target="_blank">Notion ↗</a>` : ""}`;

  const allowed = STATUSES[c.db] || [];
  const profileRows = renderProfileRadios(models, "prof", cardProfile,
    "Профили с облачными моделями выключены: облако выключено в настройках.");

  $("#m-body").innerHTML = `
    ${c.half_baked ? `<div class="card" style="border-color:var(--warn-bd)">
      <h3>Half-baked idea</h3>Карточка помечена владельцем как сырая идея. В работу не берётся
      (<span class="mono">.claude/rules/17-notion-board.md §1</span>); консилиум прорабатывает её
      отдельным треком — что нужно решить, чтобы она стала задачей.</div>` : ""}

    <div class="card">
      <h3>Указание консилиуму</h3>
      <div class="sub" style="margin-bottom:8px">Уходит в капсулу с приоритетом выше выводов из кода
        и применяется к каждому следующему прогону этой карточки. Новое гасит предыдущее.</div>
      <textarea id="note-text" rows="3"
        placeholder="например: трогать только backend; прошлый подход через шаблоны не сработал"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="act accent" id="note-save">Сохранить указание</button>
        ${notes.length ? `<span class="sub">${notes.length} в истории</span>` : ""}
      </div>
      ${notes.length ? `<div class="stack" style="margin-top:10px">${notes.map((n) =>
        `<div class="sub" style="border-left:2px solid var(--line); padding-left:8px">
          <span class="tag ${n.active ? "ok" : ""}">${n.active ? "активно" : "заменено"}</span>
          ${esc(n.note)} <span class="faint">· ${ago(n.created_at)} назад</span></div>`).join("")}</div>` : ""}
    </div>

    <div class="card">
      <h3>Статус в Notion</h3>
      <div class="row">
        <select id="st-select">${allowed.map((s) =>
          `<option value="${esc(s)}"${s === c.status ? " selected" : ""}>${esc(s)}</option>`).join("")}</select>
        <button class="act" id="st-save">Перевести</button>
      </div>
      <div class="sub" style="margin-top:8px">Из UI доступны статусы до «на ревью». Финальный
        (<span class="mono">завершённые</span>/<span class="mono">закрыто</span>) ставится вручную

/* ── главная: новая задача с @-упоминаниями (Ф1/P2) ──────────────────────
   Черновик — ЛОКАЛЬНАЯ карточка (db='draft'), в Notion не попадает. Связи — явные
   @[упоминания], резолвит их сервер (POST /api/tasks), а не клиент: чип мог быть
   отредактирован после выбора из дропдауна. */
let homeLinks = [], homeProfile = "fast";
function renderHomeChips() {
  const wrap = $("#h-chips");
  if (!wrap) return;
  wrap.innerHTML = homeLinks.map((title, i) => `<span class="tag">${esc(title)}
    <a href="#" data-i="${i}" style="margin-left:4px; text-decoration:none">×</a></span>`).join("");
  wrap.querySelectorAll("[data-i]").forEach((a) => {
    a.onclick = (e) => {
      e.preventDefault();
      const [title] = homeLinks.splice(Number(a.dataset.i), 1);
      // Снять чип должно снимать и вставленный им токен — иначе текст задачи продолжает
      // утверждать связь, которой больше нет в структурных данных (`links`, отправляемых
      // на сервер). Одна и та же карточка может быть выбрана из дропдауна дважды (два
      // упоминания одного заголовка в разных местах текста) при одном чипе (homeLinks
      // дедуплицирует по title) — удаляем ВСЕ вхождения токена, не только первое
      // (split/join, не regex — title может содержать regex-спецсимволы).
      const body = $("#h-body");
      if (body && title) {
        const token = `@[${title}] `;
        body.value = body.value.split(token).join("");
      }
      renderHomeChips();
    };
  });
  const count = $("#h-chip-count");
  if (count) count.textContent = homeLinks.length ? `связано: ${homeLinks.length}/5` : "";
}
async function renderHome() {
  const models = await api("/api/models");
  $("#tab-home").innerHTML = `
    <div class="home-grid">
    <form id="h-form" class="card" novalidate>
      <h3>Новая задача</h3>
      <label class="sub" for="h-title" style="display:block;margin-bottom:4px">Заголовок</label>
      <input type="text" id="h-title" maxlength="1900" style="width:100%"
        placeholder="о чём задача" autocomplete="off">
      <div class="sub" id="h-title-count" style="margin:2px 0 0;min-height:1em"></div>
      <label class="sub" for="h-body" style="display:block;margin:10px 0 4px">Текст — наберите «@» и ≥2 символа, чтобы связать
        с существующей карточкой (до 5 связей)</label>
      <div style="position:relative">
        <textarea id="h-body" rows="8" maxlength="8000"
          placeholder="постановка задачи; @[Название карточки] — связь с существующей работой"
          aria-autocomplete="list" aria-controls="h-mentions" aria-expanded="false"></textarea>
        <div id="h-mentions" class="mention-drop" role="listbox" aria-label="Подсказки карточек" hidden></div>
      </div>
      <div class="sub" id="h-body-count" style="margin:2px 0 0;min-height:1em"></div>
      <div class="chip-row" id="h-chips" style="margin-top:8px"></div>
      <div class="sub" id="h-chip-count" style="margin-top:4px"></div>
    </form>
    <div class="home-side">
    <div class="card">
      <h3>Кто будет работать</h3>
      ${renderProfileRadios(models, "hprof", homeProfile,
        "Облачные профили выключены — включить на вкладке «Обзор», карточка «Облако — состояние».")}
    </div>
    <div class="card" id="h-estimate">
      <h3>Оценка</h3><div class="faint">считаю…</div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="act accent" id="h-go" type="submit" form="h-form">Создать и поставить в очередь</button>
    </div>
    </div>
    </div>`;
  renderHomeChips();

  async function refreshEstimate() {
    const prof = document.querySelector('input[name="hprof"]:checked');
    const profile = prof ? prof.value : homeProfile;
    const e = await api(`/api/estimate?profile=${encodeURIComponent(profile)}&count=1` +
                        `&cloud_mode=${glmChoice("hprof")}`);
    const mins = Math.round(e.per_card_seconds / 60);
    $("#h-estimate").innerHTML = `<h3>Оценка</h3>
      <div class="kv">
        <div>ориентир</div><div class="mono">≈ ${mins} мин
          ${e.measured_on ? `<span class="faint">(по ${e.measured_on} прошлым прогонам)</span>`
            : '<span class="faint">(своих замеров нет, грубый ориентир)</span>'}</div>
        ${e.cloud_calls ? `<div>облачных вызовов</div><div class="mono">до ${e.cloud_calls}${
          e.glm ? ' <span class="faint">(GLM 5.x)</span>' : ""}</div>` : ""}
      </div>`;
  }
  document.querySelectorAll('input[name="hprof"]').forEach((r) => {
    r.onchange = () => { homeProfile = r.value; refreshEstimate(); };
  });
  const hGlm = $("#hprof-glm");
  if (hGlm) hGlm.onchange = refreshEstimate;
  refreshEstimate();

  const body = $("#h-body"), dropdown = $("#h-mentions");
  let mentionHits = [];
  let mentionSel = -1;
  let mentionAtPos = -1; // atPos, для которого реально шёл поиск (живой @-контекст) — см. Notion R2-1
  const hideMentions = () => {
    dropdown.hidden = true; mentionSel = -1; mentionAtPos = -1;
    body.setAttribute("aria-expanded", "false");
    body.removeAttribute("aria-activedescendant");
  };
  const markMentionSel = () => {
    dropdown.querySelectorAll("[data-i]").forEach((el) => {
      const on = Number(el.dataset.i) === mentionSel;
      el.classList.toggle("sel", on);
      el.setAttribute("aria-selected", on ? "true" : "false");
      if (on) { el.id = "h-mention-opt"; body.setAttribute("aria-activedescendant", "h-mention-opt"); }
      else if (el.id === "h-mention-opt") { el.removeAttribute("id"); }
    });
  };
  const runMentionSearch = debounce(async (term, atPos) => {
    if (term.length < 2) { hideMentions(); return; }
    try {
      mentionHits = await api("/api/cards/autocomplete?q=" + encodeURIComponent(term));
    } catch (e) { hideMentions(); return; }
    if (!mentionHits.length) { hideMentions(); return; }
    mentionSel = 0;
    mentionAtPos = atPos;
    dropdown.innerHTML = mentionHits.map((h, i) => `<div data-i="${i}" role="option">
      <b>${esc(h.title)}</b>
      <span class="sub">${esc(h.db)}${h.backlog_id ? " · " + esc(h.backlog_id) : ""}${h.half_baked ? " · half-baked" : ""}</span>
    </div>`).join("");
    dropdown.hidden = false;
    body.setAttribute("aria-expanded", "true");
    markMentionSel();
    dropdown.querySelectorAll("[data-i]").forEach((el) => {
      el.onclick = () => pickMention(mentionHits[Number(el.dataset.i)], atPos);
    });
  }, 200);

  function pickMention(card, atPos) {
    hideMentions();
    if (homeLinks.length >= 5) { toast("не более 5 связанных карточек", true); return; }
    const cursor = body.selectionStart;
    const before = body.value.slice(0, atPos), after = body.value.slice(cursor);
    const inserted = `@[${card.title}] `;
    body.value = before + inserted + after;
    const at = (before + inserted).length;
    body.setSelectionRange(at, at);
    body.focus();
    if (!homeLinks.includes(card.title)) { homeLinks.push(card.title); renderHomeChips(); }
  }

  const syncCount = (el, max, out) => {
    const n = el.value.length;
    out.textContent = n > max * 0.9 ? `${n}/${max}` : "";
  };
  const titleEl = $("#h-title"), titleCount = $("#h-title-count"), bodyCount = $("#h-body-count");
  titleEl.oninput = () => syncCount(titleEl, 1900, titleCount);
  // Заголовок — однострочный input внутри <form>: обычный Enter триггерит нативный
  // implicit submit (спека HTML), что обходит задуманный Cmd/Ctrl+Enter-only UX и может
  // уйти в очередь с пустым body. Глушим — форма шлётся только через goBtn/Cmd+Enter.
  titleEl.onkeydown = (e) => { if (e.key === "Enter") e.preventDefault(); };
  body.oninput = () => {
    syncCount(body, 8000, bodyCount);
    const cursor = body.selectionStart;
    const before = body.value.slice(0, cursor);
    const at = before.lastIndexOf("@");
    const term = at === -1 ? "" : before.slice(at + 1);
    if (at === -1 || /\s/.test(term)) { hideMentions(); return; }
    runMentionSearch(term, at);
  };
  // Клавиатура дропдауна: ↑/↓ — выбор, Enter/Tab — вставить, Esc — закрыть;
  // без дропдауна Cmd/Ctrl+Enter — отправка (привычка чат-композеров).
  body.onkeydown = (e) => {
    if (dropdown.hidden) {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
        e.preventDefault();
        $("#h-form").requestSubmit();
      }
      return;
    }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!mentionHits.length) return;
      mentionSel = (mentionSel + (e.key === "ArrowDown" ? 1 : -1) + mentionHits.length) % mentionHits.length;
      markMentionSel();
    } else if (e.key === "Enter" || e.key === "Tab") {
      const before = body.value.slice(0, body.selectionStart);
      const at = before.lastIndexOf("@");
      const term = at === -1 ? "" : before.slice(at + 1);
      // Живой @-контекст — это ТОТ ЖЕ @, для которого шёл поиск (mentionAtPos),
      // без пробела между ним и курсором. Курсор мог уйти от него без oninput
      // (мышь/стрелки/программно) и оказаться рядом с более ранним «чужим» @ —
      // тогда at !== mentionAtPos, дропдаун показывает результаты не для этого
      // токена и вставка ушла бы не в тот @ (Notion: «вставка по чужому @»).
      // Как и с полностью потерянным @-контекстом — не глушим Tab, иначе
      // keyboard trap (WCAG 2.1.2), фокус не может уйти с textarea естественно.
      const liveContext = at !== -1 && at === mentionAtPos && !/\s/.test(term);
      if (!liveContext) { hideMentions(); return; }
      e.preventDefault();
      if (mentionSel >= 0) pickMention(mentionHits[mentionSel], at);
    } else if (e.key === "Escape") {
      e.preventDefault();
      hideMentions();
    }
  };

  const form = $("#h-form"), goBtn = $("#h-go");
  let sending = false;
  form.onsubmit = (e) => { e.preventDefault(); submitHome(); };
  async function submitHome() {
    if (sending) return;
    const title = titleEl.value.trim();
    if (!title) {
      titleEl.setAttribute("aria-invalid", "true");
      titleEl.focus();
      toast("заголовок обязателен", true);
      return;
    }
    titleEl.removeAttribute("aria-invalid");
    const prof = document.querySelector('input[name="hprof"]:checked');
    sending = true; goBtn.disabled = true; goBtn.textContent = "Ставлю в очередь…";
    try {
      const r = await post("/api/tasks", {
        title, body: body.value.trim(), links: homeLinks,
        profile: prof ? prof.value : homeProfile, cloud_mode: glmChoice("hprof"),
      });
      toast(`черновик ${r.card_id} создан, поставлен в очередь`);
      titleEl.value = ""; body.value = ""; homeLinks = [];
      syncCount(titleEl, 1900, titleCount);
      syncCount(body, 8000, bodyCount);
      renderHomeChips();
      openRun(r.run_id);
    } catch (e) { toast(e.message, true); }
    finally {
      sending = false; goBtn.disabled = false; goBtn.textContent = "Создать и поставить в очередь";
    }
  }
}

/* ── граф ─────────────────────────────────────────────────────────────── */
/* Раскладка и отрисовка — свои, на canvas 2D: правило «ни сборки, ни CDN» здесь не
   формальность, шлюз отдаёт один файл с диска и должен работать без сети. Готовая
   3D-библиотека (three.js/3d-force-graph) — это мегабайт с внешнего домена ради того,
   что здесь занимает две сотни строк.

   Почему 3D, а не круг по окружности, как было: в круговой раскладке расстояние между
   точками ничего не значит — соседи по кругу не связаны, и «связанным» граф не выглядит
   никогда. В силовой раскладке расстояние = связность, а третья ось снимает главную беду
   плоской: на сотнях узлов рёбра пересекаются так, что структура превращается в шум.

   Симуляция: пружины по рёбрам + отталкивание всех со всеми через пространственный хеш
   (полный перебор — O(n²), на 1000 узлов это миллион пар на кадр) + слабое притяжение к
   центру, чтобы несвязные куски не улетали. Затухание alpha: раскладка «застывает» за
   ~300 шагов, после чего кадр только вращается. */
let graph3d = null;
let graphDrill = null;   // { communityId, label } — открытое сообщество в drill-down, иначе null
let graphToken = 0;      // бампается на каждый leave/новый рендер — гасит устаревший in-flight fetch

function stopGraph3d() {
  graphToken++;
  if (graph3d) { graph3d.stop(); graph3d = null; }
}

const GRAPH_PREFS_KEY = "ai-council-graph-prefs";
const GRAPH_BUDGET_SCALE = [150, 300, 500, 1000, 1500, 2500, 5000, 8000, 10000, 15000, 25000, "all"];
const graphPrefs = Object.assign(
  { limit: 300, level: "files", rel: [], spin: true, labels: true },
  (() => {
    try { return JSON.parse(localStorage.getItem(GRAPH_PREFS_KEY) || "{}"); }
    catch (e) { return {}; }
  })());
function saveGraphPrefs() {
  try { localStorage.setItem(GRAPH_PREFS_KEY, JSON.stringify(graphPrefs)); }
  catch (e) { /* private mode */ }
}

function graphHue(node) {
  const community = parseInt(node.community, 10);
  if (Number.isFinite(community)) return (community * 47) % 360;
  let hash = 0;
  for (const ch of node.id) hash = (hash * 31 + ch.charCodeAt(0)) % 360;
  return hash;
}

function startGraph3d(canvas, data, onSelect) {
  const ctx = canvas.getContext("2d");
  const nodes = data.nodes || [];
  const N = nodes.length;
  const index = new Map(nodes.map((n, i) => [n.id, i]));
  const edges = (data.edges || []).map((e) => ({
    s: index.get(e.source), t: index.get(e.target), w: e.weight || 1,
  })).filter((e) => e.s !== undefined && e.t !== undefined && e.s !== e.t);

  const x = new Float64Array(N), y = new Float64Array(N), z = new Float64Array(N);
  const vx = new Float64Array(N), vy = new Float64Array(N), vz = new Float64Array(N);
  // Старт — точки сферы Фибоначчи: детерминированно (один и тот же граф даёт одну и ту
  // же картинку) и без слипшихся пар, из которых отталкивание выбрасывает узлы рывком.
  const R0 = 240;
  for (let i = 0; i < N; i++) {
    const t = (i + 0.5) / Math.max(N, 1);
    const phi = Math.acos(1 - 2 * t), theta = Math.PI * (1 + Math.sqrt(5)) * i;
    x[i] = R0 * Math.sin(phi) * Math.cos(theta);
    y[i] = R0 * Math.sin(phi) * Math.sin(theta);
    z[i] = R0 * Math.cos(phi);
  }

  const adj = nodes.map(() => []);
  for (const e of edges) { adj[e.s].push(e.t); adj[e.t].push(e.s); }
  const maxDeg = Math.max(1, ...nodes.map((n) => n.degree || 1));
  const top = nodes.map((n, i) => i).sort((a, b) =>
    (nodes[b].degree || 0) - (nodes[a].degree || 0)).slice(0, 20);
  const topSet = new Set(top);

  const CELL = 72, REPULSION = 1400, SPRING_LEN = 58, MAX_STEP = 26;
  let alpha = 1;

  function step() {
    // Отталкивание: только внутри своей ячейки и 26 соседних. Дальние узлы влияют на
    // раскладку пренебрежимо, а полный перебор на 1000 узлов — полмиллиона пар на шаг.
    const grid = new Map();
    for (let i = 0; i < N; i++) {
      const k = Math.round(x[i] / CELL) + "," + Math.round(y[i] / CELL) + ","
              + Math.round(z[i] / CELL);
      const cell = grid.get(k);
      if (cell) cell.push(i); else grid.set(k, [i]);
    }
    for (let i = 0; i < N; i++) {
      const cx = Math.round(x[i] / CELL), cy = Math.round(y[i] / CELL),
            cz = Math.round(z[i] / CELL);
      for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) for (let c = -1; c <= 1; c++) {
        const cell = grid.get((cx + a) + "," + (cy + b) + "," + (cz + c));
        if (!cell) continue;
        for (const j of cell) {
          if (j <= i) continue;                       // пара учитывается один раз
          const dx = x[i] - x[j], dy = y[i] - y[j], dz = z[i] - z[j];
          const d2 = dx * dx + dy * dy + dz * dz + 0.5;
          const d = Math.sqrt(d2);
          const f = Math.min(REPULSION / d2, 6) / d;
          vx[i] += dx * f; vy[i] += dy * f; vz[i] += dz * f;
          vx[j] -= dx * f; vy[j] -= dy * f; vz[j] -= dz * f;
        }
      }
    }
    for (const e of edges) {
      const dx = x[e.t] - x[e.s], dy = y[e.t] - y[e.s], dz = z[e.t] - z[e.s];
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz) + 0.001;
      const f = 0.008 * Math.min(e.w, 4) * (d - SPRING_LEN) / d;
      vx[e.s] += dx * f; vy[e.s] += dy * f; vz[e.s] += dz * f;
      vx[e.t] -= dx * f; vy[e.t] -= dy * f; vz[e.t] -= dz * f;
    }
    const clamp = (v) => (v > MAX_STEP ? MAX_STEP : v < -MAX_STEP ? -MAX_STEP : v);
    for (let i = 0; i < N; i++) {
      vx[i] = (vx[i] - x[i] * 0.0022) * 0.80;         // + слабая гравитация к центру
      vy[i] = (vy[i] - y[i] * 0.0022) * 0.80;
      vz[i] = (vz[i] - z[i] * 0.0022) * 0.80;
      x[i] += clamp(vx[i]) * alpha;
      y[i] += clamp(vy[i]) * alpha;
      z[i] += clamp(vz[i]) * alpha;
    }
    alpha = Math.max(0, alpha - 0.0035);
  }

  // ── камера ────────────────────────────────────────────────────────────
  let yaw = 0.5, pitch = -0.22, dist = 780, dragging = false, dirty = true;
  let hover = -1, pinned = -1, w = 0, h = 0;
  const px = new Float64Array(N), py = new Float64Array(N),
        pk = new Float64Array(N), pz = new Float64Array(N);

  function project() {
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    for (let i = 0; i < N; i++) {
      const X = x[i] * cy + z[i] * sy;
      const Zr = -x[i] * sy + z[i] * cy;
      const Y = y[i] * cp - Zr * sp;
      const Z = y[i] * sp + Zr * cp;
      const depth = dist + Z;
      const k = depth > 40 ? (dist * 0.92) / depth : 0;
      px[i] = w / 2 + X * k; py[i] = h / 2 + Y * k; pk[i] = k; pz[i] = Z;
    }
  }

  function draw() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    if (canvas.width !== Math.round(cw * dpr) || canvas.height !== Math.round(ch * dpr)) {
      canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
      dirty = true;
    }
    w = cw; h = ch;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    project();

    const css = getComputedStyle(document.documentElement);
    const lineColor = css.getPropertyValue("--line").trim() || "#2a3140";
    const accent = css.getPropertyValue("--accent").trim() || "#58a6ff";
    const ink = css.getPropertyValue("--ink").trim() || "#e6edf3";
    const light = document.documentElement.dataset.theme === "light";
    const focus = pinned >= 0 ? pinned : hover;
    const near = focus >= 0 ? new Set(adj[focus]) : null;

    // Обычные рёбра — одним путём в одну обводку: 6000 отдельных stroke() на кадр
    // роняют частоту кадров, а различать их по цвету всё равно незачем.
    ctx.strokeStyle = lineColor;
    ctx.globalAlpha = focus >= 0 ? 0.12 : (light ? 0.5 : 0.35);
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const e of edges) {
      if (focus >= 0 && (e.s === focus || e.t === focus)) continue;
      if (pk[e.s] <= 0 || pk[e.t] <= 0) continue;
      ctx.moveTo(px[e.s], py[e.s]); ctx.lineTo(px[e.t], py[e.t]);
    }
    ctx.stroke();
    if (focus >= 0) {
      ctx.strokeStyle = accent; ctx.globalAlpha = 0.9; ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (const e of edges) {
        if (e.s !== focus && e.t !== focus) continue;
        if (pk[e.s] <= 0 || pk[e.t] <= 0) continue;
        ctx.moveTo(px[e.s], py[e.s]); ctx.lineTo(px[e.t], py[e.t]);
      }
      ctx.stroke();
    }

    // Узлы — дальние раньше ближних (алгоритм художника): иначе передний план
    // затирается тем, что за ним, и глубина читается наоборот.
    const order = Array.from({ length: N }, (_, i) => i).sort((a, b) => pz[b] - pz[a]);
    for (const i of order) {
      if (pk[i] <= 0) continue;
      const node = nodes[i];
      const r = (2.4 + 6 * Math.sqrt((node.degree || 1) / maxDeg)) * pk[i];
      const depth = Math.max(0.25, Math.min(1, pk[i]));
      const dim = focus >= 0 && i !== focus && !near.has(i);
      ctx.globalAlpha = dim ? 0.12 : 0.35 + 0.65 * depth;
      ctx.fillStyle = `hsl(${graphHue(node)} 65% ${light ? 42 : 34 + 26 * depth}%)`;
      ctx.beginPath();
      ctx.arc(px[i], py[i], Math.max(r, 1), 0, 6.283);
      ctx.fill();
      if (i === focus) {
        ctx.globalAlpha = 1; ctx.strokeStyle = accent; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(px[i], py[i], Math.max(r, 1) + 3, 0, 6.283); ctx.stroke();
      }
    }

    if (graphPrefs.labels || focus >= 0) {
      // Подписи рисуются по убыванию важности и только если не налезают на уже
      // поставленные: без этого центр графа превращается в кашу из наложенного текста,
      // где не читается ни одно имя — то есть подписей как бы и нет.
      ctx.font = "11px -apple-system, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      const placed = [];
      const candidates = [];
      for (const i of order) {
        if (pk[i] <= 0) continue;
        if (i === focus || (focus >= 0 && near.has(i)) || (graphPrefs.labels && topSet.has(i)
            && focus < 0)) candidates.push(i);
      }
      candidates.sort((a, b) => (a === focus ? -1 : b === focus ? 1 : 0)
                             || (nodes[b].degree || 0) - (nodes[a].degree || 0));
      for (const i of candidates) {
        const text = nodes[i].label.slice(0, 34);
        const r = (2.4 + 6 * Math.sqrt((nodes[i].degree || 1) / maxDeg)) * pk[i];
        const half = ctx.measureText(text).width / 2 + 2;
        const box = { x1: px[i] - half, x2: px[i] + half,
                      y1: py[i] - r - 16, y2: py[i] - r - 3 };
        if (box.x2 < 0 || box.x1 > w || box.y1 < 0 || box.y2 > h) continue;
        if (i !== focus && placed.some((p) => box.x1 < p.x2 && box.x2 > p.x1
                                           && box.y1 < p.y2 && box.y2 > p.y1)) continue;
        placed.push(box);
        ctx.globalAlpha = 0.85;
        ctx.lineWidth = 3;
        ctx.strokeStyle = light ? "#ffffff" : "#0e1116";   // подложка под текст
        ctx.strokeText(text, px[i], py[i] - r - 5);
        ctx.globalAlpha = i === focus ? 1 : 0.9;
        ctx.fillStyle = ink;
        ctx.fillText(text, px[i], py[i] - r - 5);
      }
    }
    ctx.globalAlpha = 1;
  }

  function pick(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const mx = clientX - rect.left, my = clientY - rect.top;
    let best = -1, bestD = 16 * 16;
    for (let i = 0; i < N; i++) {
      if (pk[i] <= 0) continue;
      const dx = px[i] - mx, dy = py[i] - my, d2 = dx * dx + dy * dy;
      if (d2 < bestD) { bestD = d2; best = i; }
    }
    return best;
  }

  let last = { x: 0, y: 0 };
  const onDown = (e) => {
    dragging = true; last = { x: e.clientX, y: e.clientY };
    canvas.setPointerCapture(e.pointerId); canvas.style.cursor = "grabbing";
  };
  const onMove = (e) => {
    if (dragging) {
      yaw += (e.clientX - last.x) * 0.006;
      pitch = Math.max(-1.5, Math.min(1.5, pitch + (e.clientY - last.y) * 0.006));
      last = { x: e.clientX, y: e.clientY };
      dirty = true;
      return;
    }
    const hit = pick(e.clientX, e.clientY);
    if (hit !== hover) {
      hover = hit; dirty = true;
      canvas.style.cursor = hit >= 0 ? "pointer" : "grab";
      canvas.title = hit >= 0 ? `${nodes[hit].label} — связей: ${nodes[hit].degree}` : "";
    }
  };
  const onUp = (e) => {
    if (dragging && Math.abs(e.clientX - last.x) < 3 && Math.abs(e.clientY - last.y) < 3) {
      const hit = pick(e.clientX, e.clientY);
      pinned = hit === pinned ? -1 : hit;
      onSelect(pinned >= 0 ? nodes[pinned] : null,
               pinned >= 0 ? adj[pinned].map((i) => nodes[i]) : []);
    }
    dragging = false; canvas.style.cursor = "grab"; dirty = true;
  };
  const onWheel = (e) => {
    e.preventDefault();
    dist = Math.max(220, Math.min(2600, dist * (e.deltaY > 0 ? 1.12 : 0.89)));
    dirty = true;
  };
  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("wheel", onWheel, { passive: false });

  let running = true;
  function frame() {
    if (!running) return;
    if (alpha > 0) { step(); step(); dirty = true; }
    if (graphPrefs.spin && !dragging) { yaw += 0.0022; dirty = true; }
    if (dirty) { draw(); dirty = false; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  return {
    stop() {
      running = false;
      canvas.removeEventListener("pointerdown", onDown);
      canvas.removeEventListener("pointermove", onMove);
      canvas.removeEventListener("pointerup", onUp);
      canvas.removeEventListener("wheel", onWheel);
    },
    reheat() { alpha = 1; dirty = true; },
    focusNode(id) {
      const i = index.get(id);
      if (i === undefined) return;
      pinned = i; dirty = true;
      onSelect(nodes[i], adj[i].map((j) => nodes[j]));
    },
    invalidate() { dirty = true; },
  };
}

function graphRelParam() {
  return graphPrefs.rel.length ? `&rel=${graphPrefs.rel.map(encodeURIComponent).join(",")}` : "";
}
function graphEffectiveLevel(limit, level) {
  return (limit === "all" || limit > 2500) ? "communities" : level;
}

async function renderGraph() {
  stopGraph3d();
  graphDrill = null;
  const myToken = graphToken;
  const level = graphEffectiveLevel(graphPrefs.limit, graphPrefs.level);
  const limitParam = graphPrefs.limit === "all" ? "all" : graphPrefs.limit;
  const d = await api(`/api/graph?limit=${limitParam}&level=${level}${graphRelParam()}`);
  if (myToken !== graphToken) return; // вкладку покинули (или запущен новый рендер) пока грузили
  renderGraphPane(d, { level, forcedByBudget: level !== graphPrefs.level });
}

async function renderGraphDrill(communityId, label) {
  const level = graphPrefs.level === "communities" ? "symbols" : graphPrefs.level;
  const limit = graphPrefs.limit === "all" ? 25000 : graphPrefs.limit;
  toast(`загрузка сообщества «${label}»…`);
  const myToken = ++graphToken; // бампаем сами: два перекрывающихся drill-клика должны гасить друг друга по клику, не по резолву
  const d = await api(`/api/graph/community/${encodeURIComponent(communityId)}`
    + `?limit=${limit}&level=${level}${graphRelParam()}`);
  if (myToken !== graphToken) return;
  if (!d.available) { toast(d.hint || "сообщество не найдено", true); return; }
  graphDrill = { communityId, label };
  renderGraphPane(d, { level, drill: true, communityLabel: label });
}

function renderGraphPane(d, opts) {
  const buildBtn = `<button class="act accent" id="g-build">Собрать граф</button>
    <span class="sub">AST-извлечение, без вызовов моделей. На этом репозитории ≈1 мин.</span>`;
  if (!d.available) {
    $("#graph-pane").innerHTML = `<div class="card"><h3>Граф проекта</h3>
      <div class="empty">${esc(d.hint || "граф недоступен")}</div>
      <div class="row" style="margin-top:10px">${buildBtn}</div>
      <div class="sub" style="margin-top:10px">Кнопка собирает структурную часть графа —
        связи из кода по AST. Семантические узлы из документов и человеческие названия
        сообществ даёт только агентный <span class="mono">/graphify</span>; здесь сообщества
        останутся под номерами.</div></div>`;
    bindGraphBuild();
    return;
  }
  const nodes = d.nodes || [], edges = d.edges || [];
  const isCommunities = opts.level === "communities" && !opts.drill;
  const options = GRAPH_BUDGET_SCALE.map((n) =>
    `<option value="${n}"${n === graphPrefs.limit ? " selected" : ""}>${
      n === "all" ? "все" : n + " узлов"}</option>`).join("");
  const levels = [["files", "файлы"], ["symbols", "функции и классы"], ["communities", "сообщества"]]
    .map(([v, t]) => `<option value="${v}"${v === graphPrefs.level ? " selected" : ""}>${t}</option>`)
    .join("");
  const relOptions = (d.available_relations || []).map((r) => `
    <label class="sub" style="white-space:nowrap">
      <input type="checkbox" class="g-rel" value="${esc(r)}"${
        graphPrefs.rel.includes(r) ? " checked" : ""}> ${esc(r)}</label>`).join("");

  const budgetNote = opts.drill
    ? `<div class="sub" style="margin:6px 0 8px">Сообщество «${esc(opts.communityLabel)}» —
        ${d.community_size} узлов, показан связный кусок из ${nodes.length}.
        <a href="#" id="g-back">← ко всем сообществам</a></div>`
    : isCommunities
      ? `<div class="sub" style="margin:6px 0 8px">Режим LOD: ${d.total_nodes} узлов свёрнуто
          в ${nodes.length} сообществ (лимит бюджета игнорируется на этом уровне) — клик по
          сообществу открывает его детальный срез отдельным запросом.</div>`
      : `<div class="sub" style="margin:6px 0 8px">Тянуть мышью — повернуть · колесо — приблизить ·
          клик по точке — выделить узел и его связи (повторный клик снимает). Размер точки —
          число связей, расстояние — связность: близкие точки реально ссылаются друг на друга.
          Срез — не «топ по связям», а связная окрестность самого нагруженного узла.</div>`;

  $("#graph-pane").innerHTML = `
    <div class="grid">
      <div class="card"><h3>${opts.drill ? "Узлов в сообществе"
          : opts.level === "files" ? "Файлов в графе"
          : opts.level === "communities" ? "Сообществ" : "Узлов в графе"}</h3>
        <div class="big">${opts.drill ? d.community_size : d.level_nodes}</div>
        <div class="sub">показан связный кусок из ${nodes.length}${opts.drill ? ""
          : `; всего узлов ${d.total_nodes}`}</div></div>
      <div class="card"><h3>Связей</h3><div class="big">${opts.drill ? "—" : d.total_edges}</div>
        <div class="sub">в срезе ${edges.length} после склейки дублей</div></div>
      <div class="card"><h3>${isCommunities ? "Всего узлов до свёртки" : "Сообществ в срезе"}</h3>
        <div class="big">${isCommunities ? d.total_nodes
          : new Set(nodes.map((n) => n.community).filter(Boolean)).size}</div>
        <div class="sub">${isCommunities ? "«все» = честно все, свёрнутые в супер-узлы"
          : "цвет точки = сообщество"}</div></div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="row" style="justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap">
        <h3 style="margin:0">Карта проекта — 3D</h3>
        <div class="row" style="gap:8px; flex-wrap:wrap">
          <select id="g-level"${opts.drill ? " disabled" : ""}>${levels}</select>
          <select id="g-limit"${opts.drill ? " disabled" : ""}>${options}</select>
          <label class="sub"><input type="checkbox" id="g-spin"${graphPrefs.spin ? " checked" : ""}> вращение</label>
          <label class="sub"><input type="checkbox" id="g-labels"${graphPrefs.labels ? " checked" : ""}> подписи</label>
          <button class="act" id="g-reheat">Переразложить</button>
        </div>
      </div>
      <div class="row" id="g-rel-row" style="gap:10px; flex-wrap:wrap; margin-top:4px">
        <span class="sub">связи:</span>${relOptions || '<span class="sub">—</span>'}
      </div>
      ${budgetNote}
      <canvas id="g-canvas" style="width:100%; height:560px; display:block; cursor:grab;
        border:1px solid var(--line); border-radius:8px; background:var(--panel-2);
        touch-action:none"></canvas>
      <div id="g-selected" class="sub" style="margin-top:10px">Узел не выбран.</div>
      <div class="row" style="margin-top:10px">${buildBtn}</div>
    </div>
    <div class="card" style="margin-top:12px; padding:0">
      <h3 style="padding:14px 14px 0">${isCommunities ? "Крупнейшие сообщества" : "Самые связанные узлы"}</h3>
      <div class="tablewrap"><table>
        <thead><tr><th>Узел</th><th>Файл</th><th>Связей</th><th>Сообщество</th></tr></thead>
        <tbody>${nodes.slice().sort((a, b) => b.degree - a.degree).slice(0, 40)
          .map((n) => `<tr>
          <td class="wrap"><a href="#" class="g-pick" data-id="${esc(n.id)}">${esc(n.label)}</a></td>
          <td class="mono sub wrap">${esc(n.file || "—")}</td>
          <td class="mono">${n.degree}</td>
          <td class="sub">${esc(n.community || "—")}</td></tr>`).join("")}</tbody>
      </table></div>
    </div>`;

  const showSelected = (node, neighbours) => {
    const box = $("#g-selected");
    if (!node) { box.textContent = "Узел не выбран."; return; }
    if (isCommunities) { renderGraphDrill(node.id, node.label); return; }
    const list = neighbours.slice(0, 12).map((n) =>
      `<a href="#" class="g-pick" data-id="${esc(n.id)}">${esc(n.label)}</a>`).join(", ");
    box.innerHTML = `<b>${esc(node.label)}</b>
      <span class="mono sub">${esc(node.file || node.id)}</span> — связей ${node.degree},
      сообщество ${esc(node.community || "—")}${neighbours.length
        ? `<div style="margin-top:4px">Связан с: ${list}${
            neighbours.length > 12 ? ` и ещё ${neighbours.length - 12}` : ""}</div>` : ""}`;
    bindPicks();
  };
  const bindPicks = () => {
    document.querySelectorAll("#graph-pane .g-pick").forEach((a) => {
      a.onclick = (e) => {
        e.preventDefault();
        if (isCommunities) { renderGraphDrill(a.dataset.id, a.textContent); return; }
        if (graph3d) graph3d.focusNode(a.dataset.id);
      };
    });
  };

  if (graph3d) graph3d.stop();
  graph3d = startGraph3d($("#g-canvas"), d, showSelected);
  bindPicks();
  $("#g-spin").onchange = (e) => {
    graphPrefs.spin = e.target.checked; saveGraphPrefs(); graph3d.invalidate();
  };
  $("#g-labels").onchange = (e) => {
    graphPrefs.labels = e.target.checked; saveGraphPrefs(); graph3d.invalidate();
  };
  $("#g-reheat").onclick = () => graph3d.reheat();
  if (!opts.drill) {
    $("#g-limit").onchange = (e) => {
      const raw = e.target.value;
      graphPrefs.limit = raw === "all" ? "all" : (parseInt(raw, 10) || 300);
      saveGraphPrefs(); renderGraph();
    };
    $("#g-level").onchange = (e) => {
      graphPrefs.level = e.target.value; saveGraphPrefs(); renderGraph();
    };
  }
  const backLink = $("#g-back");
  if (backLink) backLink.onclick = (e) => { e.preventDefault(); renderGraph(); };
  document.querySelectorAll("#g-rel-row .g-rel").forEach((cb) => {
    cb.onchange = () => {
      graphPrefs.rel = [...document.querySelectorAll("#g-rel-row .g-rel:checked")]
        .map((el) => el.value);
      saveGraphPrefs();
      opts.drill && graphDrill ? renderGraphDrill(graphDrill.communityId, graphDrill.label) : renderGraph();
    };
  });
  bindGraphBuild();
}

function bindGraphBuild() {
  const btn = $("#g-build");
  if (!btn) return;
  btn.onclick = async () => {
    btn.disabled = true;
    try {
      await post("/api/ops", { name: "graph" });
      toast("сборка графа запущена — ход виден на вкладке «Обзор»");
      // Пересборка занимает около минуты; опрашиваем, пока задача не завершится.
      const poll = setInterval(async () => {
        const ops = await api("/api/ops");
        const job = (ops.jobs || []).find((j) => j.name === "graph");
        if (job && job.status !== "running") {
          clearInterval(poll);
          toast(job.status === "done" ? "граф собран" : "сборка не удалась — см. «Обзор»",
                job.status !== "done");
          renderGraph();
        }
      }, 4000);
    } catch (e) { toast(e.message, true); btn.disabled = false; }
  };
}

/* ── живая лента (SSE) ────────────────────────────────────────────────── */
let feedEl = null;
const FEED_MAX = 80;
// Непросмотренное — по id события, а не по счётчику в памяти: переживает перезагрузку и
// не задваивается. Место хранится в браузере (localStorage), сервер считает до 1000.
const FEED_SEEN_KEY = "ai-council-feed-seen";
let feedSeen = (() => {
  try { const v = localStorage.getItem(FEED_SEEN_KEY); return v === null ? null : Number(v); }
  catch (e) { return null; }
})();
let feedLatest = 0, feedUnread = 0;

function feedLine(ev) {
  const t = new Date((ev.created_at || 0) * 1000).toLocaleTimeString("ru-RU");
  return `${t}  ${ev.kind}  ${ev.ref || ""} ${String(ev.detail || "").slice(0, 110)}`;
}
function renderFeedBadge() {
  const el = $("#hdr-live-n");
  el.hidden = feedUnread <= 0;
  el.textContent = feedUnread >= 1000 ? "999+" : String(feedUnread);
  $("#hdr-live").title = feedUnread > 0
    ? `Лента: ${feedUnread >= 1000 ? "больше 999" : feedUnread} новых событий с прошлого просмотра`
    : "Лента: живые события и прогоны с вердиктами";
  document.title = (feedUnread > 0 ? `(${el.textContent}) ` : "") + "AI Council";
}
function markFeedSeen() {
  if (!feedLatest) return;                     // хвост журнала ещё неизвестен — нечего запоминать
  feedSeen = Math.max(feedSeen || 0, feedLatest);
  try { localStorage.setItem(FEED_SEEN_KEY, String(feedSeen)); } catch (e) { /* private mode */ }
  feedUnread = 0;
  renderFeedBadge();
}

function appendFeed(ev, silent, isNew) {
  if (feedEl) {
    const first = feedEl.firstElementChild;
    if (first && first.classList.contains("faint")) feedEl.innerHTML = "";
    const div = document.createElement("div");
    div.textContent = feedLine(ev);             // событие — данные, не разметка
    if (isNew) div.className = "new";
    feedEl.prepend(div);
    while (feedEl.childElementCount > FEED_MAX) feedEl.lastElementChild.remove();
  }
  if (!silent && /run\.(done|abstained|failed)|verdict|status\./.test(ev.kind || "")) {
    refresh();
    // На «Ленте» завершение прогона меняет и счётчики, и сам список — таблица
    // обновляется точечно, лента и фильтр не перерисовываются.
    if (activeTab === "feed") renderRunsTable();
  }
}

async function connectStream() {
  // Сначала — сколько накопилось с прошлого просмотра и где хвост журнала; поток
  // подключается ровно с этого хвоста: без дыры и без двойного счёта между запросами.
  try {
    const u = await api("/api/events/unread?since=" + (feedSeen === null ? "" : feedSeen));
    feedLatest = u.latest || 0;
    if (feedSeen === null) markFeedSeen();     // первый заход браузера: новое — с этого момента
    else feedUnread = u.count || 0;
  } catch (e) { /* шлюз недоступен — поток ниже скажет «✗» */ }
  if (activeTab === "feed") markFeedSeen();
  renderFeedBadge();
  const src = new EventSource("/api/stream?since=" + feedLatest);
  src.onopen = () => { $("#hdr-live").classList.add("on"); $("#hdr-live").classList.remove("off"); };
  src.onerror = () => { $("#hdr-live").classList.add("off"); $("#hdr-live").classList.remove("on"); };
  src.onmessage = (e) => {
    try {
      const ev = JSON.parse(e.data);
      feedLatest = Math.max(feedLatest, Number(ev.id) || 0);
      if (activeTab === "feed" && !document.hidden) {
        appendFeed(ev, false, false);
        markFeedSeen();
      } else {
        if (activeTab === "feed") appendFeed(ev, false, true);
        else appendFeed(ev, false, false);
        feedUnread += 1;
        renderFeedBadge();
      }
    } catch (err) { /* битое событие — лента не критична */ }
  };
}
// Вкладка браузера в фоне с открытой лентой копит «новое»; вернулись — просмотрено.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && activeTab === "feed") markFeedSeen();
});

/* ── цикл обновления ──────────────────────────────────────────────────── */
async function refresh() {
  try {
    const s = await api("/api/state");
    const q = s.queue || {};
    const qc = s.queue_ctl || {};
    const blockedN = Object.keys(qc.memory_blocked || {}).length;
    const awaiting = (s.verdicts || {}).awaiting_review || 0;
    // Коротко — число в очереди; подробности прячутся по ширине (CSS .q-extra/.q-label),
    // полный текст — в подсказке. Только числа — innerHTML здесь безопасен.
    $("#hdr-queue").innerHTML = (qc.paused ? "⏸ " : "") +
      `<span class="q-label">очередь </span>${Number(q.queued) || 0}<span class="q-extra">` +
      ` · в работе ${Number(q.running) || 0} · без вердикта ${Number(awaiting) || 0}` +
      `${blockedN ? ` · ждут память ${blockedN}` : ""}</span>`;
    $("#hdr-queue").title = (qc.paused ? "Очередь на паузе. " : "") +
      `В очереди ${q.queued || 0}, в работе ${q.running || 0}, результатов без вердикта ${awaiting}` +
      (blockedN ? `, профилей ждут память: ${blockedN}` : "") + " — клик: «Обзор» → «Управление очередью»";
    $("#hdr-queue").className = "pill" + (qc.paused || blockedN ? " warn" : "");
    const c = s.cloud || {}, w = c.window || {};
    glmState = c.glm || glmState;
    renderGlmPill();
    const glmOn = !!(glmState && glmState.effective);
    // Пока действует режим GLM 5.x, окно — окно режима (сервер уже подставил его лимиты).
    // Только числа и статичный текст — innerHTML безопасен; узкий экран прячет .c-extra.
    const calls = Number(w.calls) || 0, max = Number(w.max) || 0, hours = Number(w.hours) || 0;
    const pill = $("#hdr-cloud");
    pill.className = "pill " + (c.enabled ? "cloud" : "off");
    pill.innerHTML = !c.enabled
      ? `<span class="c-mob" aria-hidden="true">☁ </span>облако<span class="c-extra"> выключено</span>`
      : (glmOn ? `GLM<span class="c-extra"> 5.x</span>`
               : `<span class="c-mob" aria-hidden="true">☁</span><span class="c-extra">облако</span>`)
        + ` ${calls}/${max}<span class="c-extra"> за ${hours}ч</span>`;
    const label = !c.enabled ? "Облако выключено"
      : `${glmOn ? "Режим GLM 5.x" : "Облако"}: израсходовано ${calls} из ${max} вызовов за ${hours} ч`;
    pill.setAttribute("aria-label", label + " — открыть страницу «Облако»");
    pill.title = label + " — клик открывает страницу «Облако»";
    markCloudPill();
    // Тик обновляет только счётчики: полный re-render вкладок с формами
    // (план на «Обзоре») и с интерактивом сбрасывал бы ввод пользователя.
    if (activeTab === "overview") updateOverviewStats(s);
    else if (activeTab === "feed") updateFeedCounts(s);
  } catch (e) {
    $("#hdr-queue").textContent = "шлюз недоступен";
  }
}

const RENDERERS = {
  home: renderHome,
  overview: renderOverview, quality: renderQuality, feed: renderFeed,
  cards: renderCards, review: renderReview, knowledge: renderKnowledge, cloud: renderCloud,
  settings: renderSettings,
};
async function render() {
  try { await RENDERERS[activeTab](); }
  catch (e) { toast(e.message, true); }
}

render();
renderTabDoc(activeTab);
connectStream();
// Шапка (облако, очередь) — на любой вкладке и сразу при открытии: раньше она
// обновлялась только на «Обзоре»/«Качестве»/ленте, а на остальных висели «облако…/очередь…».
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

/* ── диплинки #tab ──────────────────────────────────────────────────────
   selectTab пишет hash через replaceState, поэтому hashchange приходит только
   от ручной навигации (ввод #knowledge в адресной строке, ссылка
   <a href="#knowledge">) — зацикливания нет. Прежние имена (#graph, #runs,
   #control, #learning) резолвятся алиасами в TAB_ALIASES. Восстановление —
   после инициализации рендереров. */
function tabFromHash() {
  let name;
  try { name = decodeURIComponent(location.hash.slice(1)); }
  catch (e) { return null; } // мусорный %-escape (#%zz) — не крашить, как любой другой невалидный hash
  return TABS.includes(name) ? name : (TAB_ALIASES[name] || null);
}
window.addEventListener("hashchange", () => {
  const name = tabFromHash();
  if (name && name !== activeTab) selectTab(name, true);
});
const initialTab = tabFromHash();
if (initialTab && initialTab !== activeTab) selectTab(initialTab, true);
else if (!initialTab) history.replaceState(null, "", "#" + activeTab);
</script>
