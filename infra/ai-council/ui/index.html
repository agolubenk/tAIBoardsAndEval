<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Council</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>%E2%9A%96</text></svg>">
<!--
  UI консилиума. Канон: docs/specs/ai-council.md §3, §12.

  Один самодостаточный документ: ни сборки, ни npm, ни CDN — подсистема должна
  подниматься там, где есть только Python. Отдаётся gateway.py с диска на каждый
  запрос, поэтому правка видна по F5.

  Весь текст из БД (заголовки карточек, вывод моделей, содержимое правил) вставляется
  только через textContent либо esc(): это данные и генерация LLM, а не разметка.

  Тема — атрибут data-theme на <html>, все цвета через переменные. Светлая тема не
  «инверсия» тёмной: контраст подобран отдельно, иначе серый текст на светлом фоне
  перестаёт читаться.
-->
<style>
  :root {
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  html[data-theme="dark"] {
    --bg: #0e1116; --panel: #161b22; --panel-2: #1c2230; --line: #2a3140;
    --ink: #e6edf3; --ink-dim: #9aa7b8; --ink-faint: #6b7889;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff; --cloud: #bc8cff;
    --ok-bd: #23502f; --warn-bd: #4a3a11; --bad-bd: #5c2222;
    --accent-bd: #1f3d5c; --cloud-bd: #3f2d5c; --shadow: rgba(0,0,0,.45);
  }
  html[data-theme="light"] {
    --bg: #f6f8fa; --panel: #ffffff; --panel-2: #eef1f5; --line: #d5dbe3;
    --ink: #1c2128; --ink-dim: #4d5866; --ink-faint: #77818f;
    --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; --accent: #0969da; --cloud: #8250df;
    --ok-bd: #aee0bb; --warn-bd: #e8d08a; --bad-bd: #f0b4b8;
    --accent-bd: #a8cbf5; --cloud-bd: #d5c2f0; --shadow: rgba(16,24,40,.10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  code, pre, .mono { font-family: var(--mono); }
  a { color: var(--accent); }

  /* ── шапка ───────────────────────────────────────────────────────────── */
  /* Десктоп — одна строка. Узкий экран — две: бренд + статус + действия, под ними
     разделы одной строкой с горизонтальной прокруткой (раньше шапка переносилась
     в 4 строки и, будучи липкой, занимала четверть экрана телефона). */
  header {
    display: flex; align-items: center; gap: 12px; padding: 8px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
  }
  /* Название — вход на главную: пункта «Главная» в меню нет. */
  .brand {
    display: inline-flex; align-items: center; gap: 7px; flex: none;
    background: none; border: 1px solid transparent; border-radius: 8px;
    padding: 4px 9px; margin-left: -9px; cursor: pointer; color: var(--ink);
    font-family: inherit; font-size: 15px; font-weight: 650; white-space: nowrap;
  }
  .brand:hover { background: var(--panel-2); }
  .brand.on { background: var(--panel-2); border-color: var(--line); }
  .brand-mark { color: var(--accent); line-height: 1; }
  nav { display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    background: none; border: 1px solid transparent; color: var(--ink-dim);
    padding: 5px 11px; border-radius: 7px; cursor: pointer; font-size: 13px;
    font-family: inherit; white-space: nowrap;
  }
  nav button:hover { color: var(--ink); background: var(--panel-2); }
  nav button.on { color: var(--ink); background: var(--panel-2); border-color: var(--line); }
  .hdr-status { display: flex; align-items: center; gap: 8px; margin-left: auto; flex: none; }
  .hdr-actions { display: flex; align-items: center; gap: 6px; flex: none; }
  .hdr-actions button.icon {
    width: 32px; height: 30px; padding: 0; display: inline-grid; place-items: center;
    font-size: 14px; line-height: 1;
  }
  .spacer { flex: 1 1 auto; }
  .pill {
    font-size: 12px; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-dim);
  }
  .pill.on { color: var(--ok); border-color: var(--ok-bd); }
  .pill.off { color: var(--ink-faint); }
  .pill.cloud { color: var(--cloud); border-color: var(--cloud-bd); }
  .pill.warn { color: var(--warn); border-color: var(--warn-bd); }
  /* Таблетки в шапке — кнопки: облако → «Облако», очередь → «Обзор», лента → лента. */
  button.pill { font-family: inherit; cursor: pointer; }
  button.pill:hover { border-color: var(--ink-faint); color: var(--ink); }
  /* Таблетка «лента» — вход в ленту (пункта меню нет): выбранная вкладка подсвечивается
     рамкой, а не цветом — цвет занят состоянием потока (on = подключён). */
  button.pill.sel { border-color: var(--accent); color: var(--ink); }
  .pill .cnt { display: inline-block; min-width: 18px; margin-left: 5px; padding: 0 5px;
               border-radius: 999px; background: var(--accent); color: var(--bg);
               font-size: 11px; font-weight: 650; line-height: 16px; text-align: center; }
  .pill .cnt[hidden] { display: none; }        /* display выше перекрыл бы атрибут hidden */
  .feed div.new { color: var(--ink); border-left: 2px solid var(--accent); padding-left: 6px; }
  /* Тумблер «всё на GLM 5.x» (§17.6) — кнопка-переключатель (role="switch"): состояние
     читается и цветом, и значком ◉/○, и aria-checked. */
  #hdr-glm .sw { margin-right: 4px; }
  #hdr-cloud .c-mob { display: none; }
  @media (max-width: 1240px) { #hdr-queue .q-extra { display: none; } }
  @media (max-width: 760px) {
    header { flex-wrap: wrap; gap: 8px; row-gap: 4px; padding: 6px 12px; }
    nav { order: 10; flex: 1 0 100%; margin: 0 -4px; }
    .hdr-status { gap: 6px; }
    #guide-btn, #hdr-queue .q-label { display: none; }
    /* Пункта «Облако» в меню больше нет — таблетка облака единственный вход на страницу,
       поэтому на телефоне она не прячется, а сжимается до «☁ 12/100» / «GLM 12/500».
       Тумблер GLM прячется: состояние видно по таблетке, переключение — на «Облаке». */
    #hdr-cloud .c-extra, #hdr-glm { display: none; }
    #hdr-cloud .c-mob { display: inline; }
  }

  main { padding: 16px; max-width: 1560px; margin: 0 auto; }

  /* ── карточки и сетки ────────────────────────────────────────────────── */
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .split { display: grid; gap: 12px; grid-template-columns: minmax(260px, 1fr) 2fr; }
  .split.wide-first { grid-template-columns: 2fr minmax(260px, 1fr); }
  @media (max-width: 900px) { .split, .split.wide-first { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px; min-width: 0;
  }
  .card h3 {
    margin: 0 0 10px; font-size: 11px; font-weight: 650; text-transform: uppercase;
    letter-spacing: .7px; color: var(--ink-faint);
  }
  .big { font-size: 26px; font-weight: 650; line-height: 1.2; }
  .sub { color: var(--ink-dim); font-size: 12px; }
  .faint { color: var(--ink-faint); }
  .muted { color: var(--ink-dim); }
  .ok-txt { color: var(--ok); } .bad-txt { color: var(--bad); } .warn-txt { color: var(--warn); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .stack { display: flex; flex-direction: column; gap: 8px; }

  /* ── таблицы: скролл внутри карточки, а не растягивание страницы ─────── */
  .tablewrap { overflow-x: auto; border-radius: var(--radius); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--ink-faint); font-weight: 650; padding: 9px 10px;
    border-bottom: 1px solid var(--line); background: var(--panel); white-space: nowrap;
  }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--panel-2); }
  tr.clickable { cursor: pointer; }
  /* anywhere, а не break-word: только он уменьшает min-content ячейки, и длинный путь или
     URL в названии карточки больше не растягивает таблицу за край экрана. */
  td.wrap { min-width: 240px; overflow-wrap: anywhere; }
  /* Метка в ячейке с переносом тоже переносится: одна длинная метка (модуль, ID) иначе
     держала ширину всей колонки. */
  td.wrap .tag, .tag.long { white-space: normal; overflow-wrap: anywhere; max-width: 100%; }

  .tag {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 5px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-dim);
    white-space: nowrap;
  }
  .tag.done, .tag.ok { color: var(--ok); border-color: var(--ok-bd); }
  .tag.abstained, .tag.warn { color: var(--warn); border-color: var(--warn-bd); }
  .tag.failed, .tag.bad, .tag.critical, .tag.P0 { color: var(--bad); border-color: var(--bad-bd); }
  .tag.running, .tag.queued2 { color: var(--accent); border-color: var(--accent-bd); }
  .tag.queued { color: var(--ink-faint); }
  .tag.cloud { color: var(--cloud); border-color: var(--cloud-bd); }
  .tag.high, .tag.P1 { color: var(--warn); border-color: var(--warn-bd); }

  button.act {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
    padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: 13px;
    font-family: inherit; white-space: nowrap;
  }
  button.act:hover { border-color: var(--ink-faint); }
  button.act.ok { color: var(--ok); } button.act.bad { color: var(--bad); }
  button.act.accent { color: var(--accent); }
  button.act:disabled { opacity: .45; cursor: default; }
  button.icon { padding: 5px 9px; }
  select, input[type=text], input[type=number], textarea {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 7px; padding: 6px 9px; font-size: 13px; font-family: inherit;
    max-width: 100%;
  }
  textarea { width: 100%; resize: vertical; line-height: 1.5; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
  label.field { display: flex; align-items: center; gap: 10px; justify-content: space-between;
                padding: 7px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  label.field:last-child { border-bottom: none; }
  label.field > span { flex: 1 1 200px; }

  .bar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .bar.warn > span { background: var(--warn); }
  .bar.bad > span { background: var(--bad); }

  /* ── модалка ─────────────────────────────────────────────────────────── */
  dialog {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 12px; padding: 0; width: min(1120px, 95vw); max-height: 92vh;
    box-shadow: 0 18px 50px var(--shadow);
  }
  dialog::backdrop { background: rgba(0,0,0,.62); }
  .modal-head {
    display: flex; gap: 12px; align-items: flex-start; padding: 15px 18px;
    border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg);
    z-index: 2; border-radius: 12px 12px 0 0;
  }
  .modal-body { padding: 14px 18px; overflow-y: auto; max-height: calc(92vh - 168px); }
  .modal-foot {
    display: flex; gap: 8px; align-items: center; padding: 11px 18px;
    border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap;
    border-radius: 0 0 12px 12px;
  }
  details { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; }
  details > summary { cursor: pointer; padding: 9px 12px; font-size: 13px;
                      color: var(--ink-dim); user-select: none; }
  details[open] > summary { border-bottom: 1px solid var(--line); color: var(--ink); }
  details > div { padding: 12px; overflow-x: auto; }
  pre.dump {
    background: var(--panel-2); border-radius: 7px; padding: 10px; overflow-x: auto;
    font-size: 12px; margin: 0; white-space: pre-wrap; word-break: break-word;
    max-height: 440px; overflow-y: auto;
  }
  ul.tight { margin: 6px 0; padding-left: 20px; }
  ul.tight li { margin: 3px 0; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  #toast {
    position: fixed; right: 16px; bottom: 16px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px;
    opacity: 0; transition: opacity .18s; pointer-events: none; z-index: 60;
    max-width: min(460px, 90vw); box-shadow: 0 8px 26px var(--shadow);
  }
  #toast.show { opacity: 1; }
  .feed { max-height: 320px; overflow-y: auto; font-size: 12px; font-family: var(--mono); }
  .feed div { padding: 3px 0; border-bottom: 1px solid var(--line); word-break: break-word; }
  .feed div:last-child { border-bottom: none; }
  .empty { padding: 22px; text-align: center; color: var(--ink-faint); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
  .kv > div:nth-child(odd) { color: var(--ink-faint); white-space: nowrap; }
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .mention-drop {
    position: absolute; z-index: 5; left: 0; right: 0; top: 100%;
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
    margin-top: 2px; max-height: 220px; overflow-y: auto; box-shadow: 0 8px 26px var(--shadow);
  }
  .mention-drop > div { padding: 7px 10px; cursor: pointer; }
  .mention-drop > div:hover, .mention-drop > div.sel { background: var(--panel-2); }

  /* ── доступность и мелочи ────────────────────────────────────────────── */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline-offset: 0; }
  .linkish {
    background: none; border: none; padding: 0; margin-left: 4px; cursor: pointer;
    color: var(--accent); font: inherit; text-decoration: underline;
  }
  #q-card { scroll-margin-top: 72px; }
  /* Главная: форма слева, состав и оценка справа — на широком экране правая половина
     раньше пустовала. */
  .home-grid { display: grid; gap: 12px; max-width: 1240px; }
  .home-side > .card + .card { margin-top: 12px; }
  @media (min-width: 1100px) {
    .home-grid { grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr); align-items: start; }
  }
</style>
</head>
<body>

<header>
  <button class="brand on" id="brand" data-tab="home" title="На главную — новая задача"
    aria-label="AI Council — на главную"><span class="brand-mark" aria-hidden="true">⚖</span>AI&nbsp;Council</button>
  <nav aria-label="Разделы">
    <button data-tab="overview">Обзор</button>
    <button data-tab="quality">Качество</button>
    <button data-tab="cards">Карточки</button>
    <button data-tab="review">Ревью</button>
    <button data-tab="knowledge">Знания</button>
  </nav>
  <div class="hdr-status">
    <!-- Пункт «Облако» из меню убран (2026-10-09): он дублировал эту таблетку. Вход на
         страницу «Облако» — только здесь (и диплинк #cloud), поэтому таблетку не прячем
         даже на телефоне. -->
    <button id="hdr-cloud" class="pill off"
      title="Облако: расход окна подписки — клик открывает страницу «Облако»">облако…</button>
    <button id="hdr-glm" class="pill off" role="switch" aria-checked="false"
      title="Режим GLM 5.x: ревью — в подписку Coding Plan; проработки карточек — локально (runs_on_glm в config.toml)"
      ><span class="sw" aria-hidden="true">○</span>GLM 5.x</button>
    <button id="hdr-queue" class="pill"
      title="Очередь консилиума — клик: «Обзор» → «Управление очередью»">очередь…</button>
    <button id="hdr-live" class="pill off" title="Лента: живые события и прогоны с вердиктами"
      >лента<span id="hdr-live-n" class="cnt" hidden></span></button>
  </div>
  <div class="hdr-actions">
    <button class="act icon" id="guide-btn" title="Как это работает: порядок работы и термины"
      aria-label="Как это работает">?</button>
    <button class="act icon" id="theme-btn" title="Сменить тему" aria-label="Сменить тему">◐</button>
    <button class="act icon" data-tab="settings" id="gear-btn" title="Настройки"
      aria-label="Настройки">⚙</button>
  </div>
</header>

<main>
  <!-- Пояснение к текущей вкладке: «что это» и «что здесь делать». Один элемент на все
       вкладки — текст приходит из /api/guide, а не дублируется в рендерерах. -->
  <div id="tab-doc" class="sub" style="margin-bottom:10px"></div>
  <section id="tab-home"></section>
  <section id="tab-overview" hidden></section>
  <section id="tab-quality" hidden></section>
  <section id="tab-feed" hidden></section>
  <section id="tab-cards" hidden></section>
  <section id="tab-review" hidden></section>
  <section id="tab-knowledge" hidden></section>
  <section id="tab-cloud" hidden></section>
  <section id="tab-settings" hidden></section>
</main>

<dialog id="modal">
  <div class="modal-head">
    <div style="flex:1; min-width:0">
      <div id="m-title" style="font-weight:650"></div>
      <div id="m-sub" class="sub" style="margin-top:4px"></div>
    </div>
    <button class="act" onclick="document.getElementById('modal').close()">✕</button>
  </div>
  <div class="modal-body" id="m-body"></div>
  <div class="modal-foot" id="m-foot"></div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<!-- Вкладка «Ревью» — отдельные файлы (index.html и так ~2.8k строк). Грузится ДО основного
     скрипта: объявляет только функции, утилиты ($, esc, api…) берёт отсюда в момент вызова. -->
<script src="/review.js"></script>
<script src="/review-settings.js"></script>
<script src="/bindings.js"></script>
<script>
"use strict";

/* ── утилиты ──────────────────────────────────────────────────────────── */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v, d = 2) => (v === null || v === undefined || v === "") ? "—" : Number(v).toFixed(d);
const pct = (v) => (v === null || v === undefined) ? "—" : Math.round(Number(v) * 100) + "%";
const ago = (ts) => {
  if (!ts) return "—";
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (s < 60) return s + "с";
  if (s < 3600) return Math.floor(s / 60) + "м";
  if (s < 86400) return Math.floor(s / 3600) + "ч";
  return Math.floor(s / 86400) + "д";
};
const dur = (ms) => !ms ? "—" : (ms < 60000 ? Math.round(ms / 1000) + "с"
  : Math.floor(ms / 60000) + "м " + Math.round((ms % 60000) / 1000) + "с");
const debounce = (fn, ms) => { let t = null;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({ error: "ответ не в JSON" }));
  if (data && data.error) throw new Error(data.error);
  return data;
}
const post = (path, body) => api(path, {
  method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body) });

let toastTimer = null;
function toast(msg, bad) {
  const el = $("#toast");
  el.textContent = msg;
  el.style.borderColor = bad ? "var(--bad-bd)" : "var(--line)";
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 4600);
}
function emptyRow(cols, text) {
  return `<tr><td colspan="${cols}"><div class="empty">${esc(text)}</div></td></tr>`;
}

/* ── модалка ──────────────────────────────────────────────────────────────

/* ── тема ─────────────────────────────────────────────────────────────── */
const THEME_KEY = "ai-council-theme";
function applyTheme(name, persist = true) {
  document.documentElement.dataset.theme = name;
  if (persist) {
    try { localStorage.setItem(THEME_KEY, name); } catch (e) { /* private mode */ }
  }
  $("#theme-btn").textContent = name === "dark" ? "☀" : "☾";
  $("#theme-btn").title = name === "dark" ? "Светлая тема" : "Тёмная тема";
}
// Без сохранённого выбора — тема системы, и она не запоминается: сменится тема ОС —
// сменится и здесь. Запоминается только явный выбор кнопкой.
(() => {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) { saved = null; }
  const system = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
    ? "light" : "dark";
  applyTheme(saved || system, false);
})();
$("#theme-btn").onclick = () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
// Пилюля облака — единственный вход на страницу «Облако» (пункт меню убран как дубль):

// Тумблер «всё на GLM 5.x» (§17.6) — переключается без рестарта воркера.
$("#hdr-glm").onclick = () => toggleGlm(!(glmState && glmState.on));

/* ── режим «всё на GLM 5.x» (§17.6) ─────────────────────────────────────────
   Один переключатель в трёх местах (шапка, «Облако», Настройки → «Облако»): состояние
   приходит с сервера (/api/cloud → glm), клиент его не придумывает. Воркер читает флаг на
   каждом захвате — рестарт нужен только после правки лимитов режима в Настройках. */
let glmState = null;
const glmModelsText = (g) => Object.entries((g && g.models) || {})
  .map(([role, model]) => `${role.replace("proposer.", "")}: ${model}`).join(" · ");
async function toggleGlm(on) {
  const g = glmState || {};
  if (on && !confirm("Режим GLM 5.x: все роли новых ревью" + (g.runs_on_glm ? " и проработок" : "") +
      " уходят в подписку Coding Plan (" + glmModelsText(g) + "), локально остаются только эмбеддинги." +
      (g.runs_on_glm ? "" : " Проработки карточек идут локально, по одной.") + "\n" +
      `Лимит облака на время режима — ${g.max_calls_per_window ?? 500} вызовов за ` +
      `${g.window_hours ?? 10} ч, до ${g.max_calls_per_run ?? 40} на прогон.\nВключить?`)) return null;
  try {
    const r = await post("/api/glm", { on });
    glmState = r;
    toast(on ? `GLM 5.x включён: все роли → GLM 5.x, эмбеддинги — локально; лимит ` +
               `${r.max_calls_per_window}/${r.window_hours} ч. Рестарт не нужен — со следующего прогона.`
             : "GLM 5.x выключен — новые прогоны идут по ростеру профиля, лимиты облака обычные");
    renderGlmPill();
    refresh();
    return r;
  } catch (e) { toast(e.message, true); return null; }
}
function renderGlmPill() {
  const g = glmState || {}, b = $("#hdr-glm");
  b.setAttribute("aria-checked", g.on ? "true" : "false");
  b.className = "pill " + (g.on ? (g.effective && !g.waiting ? "cloud" : "warn") : "off");
  b.querySelector(".sw").textContent = g.on ? "◉" : "○";
  b.title = !g.on ? "Режим «всё на GLM 5.x» выключен — клик: все роли новых прогонов в Coding Plan"
    : g.effective && g.waiting ? `GLM 5.x включён: ${g.waiting} — клик выключит`
    : g.effective ? `GLM 5.x включён: ${glmModelsText(g)}; эмбеддинги локально — клик выключит`
    : `GLM 5.x включён, но не действует: ${g.why || "облако выключено"}`;
}
/* Карточка режима — на «Облаке» и в Настройках → «Облако». */
function glmCard(g) {

      «Облако»; их воркер подхватывает после перезапуска консилиума.</div>
  </div>`;
}
function bindGlmToggle(root, rerender) {
  root.querySelectorAll("[data-glm-toggle]").forEach((b) => {
    b.onclick = async () => {

// «Лента» — без пункта меню: вход через таблетку, она же показывает число новых событий.
$("#hdr-live").onclick = () => selectTab("feed");
// Очередь — к «Управлению очередью» на «Обзоре».

/* ── вкладки ──────────────────────────────────────────────────────────── */
const TABS = ["home", "overview", "quality", "feed", "cards", "review",
              "knowledge", "cloud", "settings"];
// Прежние имена вкладок (до объединения 2026-08-21) остаются рабочими диплинками:
// #control → #overview, #learning → #quality, #runs → #feed, #graph → #knowledge.
// Их же шлют кнопки гайда/чек-листа, пока gateway не перезапущен со свежими текстами.
const TAB_ALIASES = { control: "overview", learning: "quality",
                      runs: "feed", graph: "knowledge" };
let activeTab = "home";
function selectTab(name, fromHash = false) {
  if (!TABS.includes(name)) name = TAB_ALIASES[name] || "home";
  // Сцена графа крутится в requestAnimationFrame — уходя с вкладки «Знания», где граф
  // живёт теперь, её надо гасить, иначе она считает кадры в скрытом блоке до F5.
  if (activeTab === "knowledge" && name !== "knowledge") stopGraph3d();
  activeTab = name;
  // Диплинк #tab: URL всегда отражает открытую вкладку — можно скопировать/открыть
  // и попасть сразу на неё. replaceState (не push), чтобы история не разбухала от
  // каждого клика по вкладкам. Перезапись нужна и при fromHash: старая ссылка
  // #control канонизируется в #overview, а не висит битым именем.
  if ("#" + name !== location.hash)
    history.replaceState(null, "", "#" + name);
  // Название (главная) и шестерёнка живут вне <nav> — подсветку получают все кнопки
  // шапки с data-tab; aria-current — для чтения с экрана.
  document.querySelectorAll("header [data-tab]").forEach((b) => {
    b.classList.toggle("on", b.dataset.tab === name);
    if (b.dataset.tab === name) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  // Меню на телефоне прокручивается — выбранный раздел держим в видимой части.
  const curNav = document.querySelector("nav button.on");
  if (curNav) curNav.scrollIntoView({ block: "nearest", inline: "nearest" });
  $("#hdr-live").classList.toggle("sel", name === "feed");
  // Таблетка облака — пункт меню страницы «Облако»: та же подсветка и aria-current.
  markCloudPill(name);
  TABS.forEach((t) => { $("#tab-" + t).hidden = (t !== name); });
  renderTabDoc(name);
  return render();
}
document.querySelectorAll("header [data-tab]").forEach((btn) => {
  btn.onclick = () => selectTab(btn.dataset.tab);
});
function markCloudPill(name = activeTab) {
  const pill = $("#hdr-cloud");
  pill.classList.toggle("sel", name === "cloud");
  if (name === "cloud") pill.setAttribute("aria-current", "page");
  else pill.removeAttribute("aria-current");
}

/* ── «как это работает» ───────────────────────────────────────────────────
   Интерфейс из восьми вкладок, двух биллинговых контуров и пяти демонов сам себя не
   объясняет: вкладки показывают состояние, но не отвечают на «в каком порядке» и «что
   здесь только моё дело». Пояснения приходят с сервера — половина зависит от конфига
   (интервалы, потолки, права записи), и прозаическая копия в разметке разъезжалась бы
   с ним молча. */
let guideCache = null;
async function loadGuide() {
  if (!guideCache) guideCache = await api("/api/guide");
  return guideCache;
}
// Объединённые вкладки наследуют пояснения исходных: пока gateway не перезапущен,
// в /api/guide нет ключей «feed»/обновлённых текстов — склеиваем из прежних.
const DOC_JOIN = {
  overview: ["overview", "control"], quality: ["quality", "learning"],
  feed: ["runs"], knowledge: ["knowledge", "graph"],
};
const TAB_DOC_KEY = "ai-council-tabdoc-open";
function tabDocOpen() {
  try { return localStorage.getItem(TAB_DOC_KEY) === "1"; } catch (e) { return false; }
}
async function renderTabDoc(name) {
  const box = $("#tab-doc");
  if (!box) return;
  try {
    const g = await loadGuide();
    const tabs = g.tabs || {};
    // Приоритет — DOC_JOIN, не tabs[name] напрямую: имя вкладки могло существовать и ДО
    // объединения (overview/quality/knowledge) — на неперезапущенном шлюзе tabs[name] тогда
    // резолвится в старый, ещё не смешанный с парой текст. После перезапуска шлюза старый
    // ключ (control/learning/graph) исчезает из /api/guide, filter(Boolean) отбрасывает его,
    // и остаётся один уже канонический tabs[name] — тот же код работает в обоих состояниях.
    let doc;
    if (DOC_JOIN[name]) {
      const parts = DOC_JOIN[name].map((k) => tabs[k]).filter(Boolean);
      if (parts.length)
        doc = { what: parts.map((p) => p.what).join(" "),
                do: parts.map((p) => p.do).join(" ") };
    }
    if (!doc) doc = tabs[name];
    if (!doc) { box.textContent = ""; return; }
    // Свёрнуто до одной фразы: полный текст нужен в первый раз, а дальше только
    // отодвигает содержимое вкладки вниз. Выбор помнится в браузере.
    const open = tabDocOpen();
    box.innerHTML = `<b>${esc(doc.what)}</b>
      <span id="tab-doc-rest" ${open ? "" : "hidden"}>${esc(doc.do)}
        <a href="#" id="tab-doc-more">как это работает целиком →</a></span>
      <button class="linkish" id="tab-doc-toggle" aria-expanded="${open}">${open ? "свернуть" : "подробнее"}</button>`;
    $("#tab-doc-more").onclick = (e) => { e.preventDefault(); openGuide(); };
    $("#tab-doc-toggle").onclick = () => {
      try { localStorage.setItem(TAB_DOC_KEY, open ? "0" : "1"); } catch (e) { /* private mode */ }
      renderTabDoc(name);
    };
  } catch (err) {
    box.textContent = "";                      // шлюз недоступен — вкладка важнее подсказки
  }
}

/* ── управление очередью (queue_control.py) ─────────────────────────────
   Пауза не трогает очередь: «Продолжить» продолжит ровно с того места. «Снять» —
   отдельная, разрушающая операция; снятое и не начатое можно вернуть на прежние места. */
function queueCtlCard(s, batches) {
  const qc = s.queue_ctl || {}, q = s.queue || {};
  const blocked = Object.entries(qc.memory_blocked || {});
  const resumable = (batches || []).reduce((n, b) => n + (b.resumable || 0), 0);
  const paused = (batches || []).reduce((n, b) => n + (b.paused || 0), 0);
  return `<div class="card" id="q-card" style="margin-top:12px${qc.paused ? ";border-color:var(--warn-bd)" : ""}">
    <h3>Управление очередью</h3>
    <div class="row">
      ${qc.paused
        ? `<span class="tag warn">на паузе с ${new Date(qc.paused.at * 1000).toLocaleString("ru-RU")}${
            qc.paused.reason ? " — " + esc(qc.paused.reason) : ""}</span>
           <button class="act ok" id="q-resume">Продолжить с того же места</button>`
        : `<span class="tag ok">идёт</span>
           <button class="act" id="q-pause" title="Текущий прогон доделается, новые не берутся; порядок не меняется">Пауза</button>`}
      <span class="sub">в очереди ${q.queued || 0} · идёт ${q.running || 0}${paused ? ` · серии на паузе: ${paused}` : ""}</span>
      ${resumable ? `<button class="act" id="q-restore" title="Вернуть снятые владельцем и просроченные, не начатые — на прежние места; дубли по карточке пропускаются">Вернуть снятые (${resumable})</button>` : ""}
    </div>
    ${escalationLine(qc.escalation)}
    ${blocked.length ? `<div class="sub" style="margin-top:8px">Ждут память (их прогоны стоят на своих местах, остальная очередь идёт):
      <ul class="tight">${blocked.map(([k, v]) => `<li><b>${esc(v.label || k.replace("runs:", "профиль ").replace("review:", "ревью-профиль "))}</b> —
        ${esc(v.why)} <span class="faint">с ${ago(v.since)} назад</span></li>`).join("")}</ul></div>` : ""}
  </div>`;
}

/* Облачная эскалация (§17.4): задачи, ждущие памяти дольше порога, уходят в облако
   с теми же условиями; отказ всех провайдеров → пауза облака до времени повтора. */
// Параметр — info, не esc: имя esc перекрыло бы глобальную esc() экранирования
// (так и было — «Обзор» не рисовался, пока облако на паузе).
function escalationLine(info) {
  if (!info) return "";
  if (!info.enabled) return `<div class="sub faint" style="margin-top:8px">Облачная эскалация выключена
    (models.cloud_escalation.enabled или облако выключено).</div>`;
  const hours = Math.round((info.after_seconds || 7200) / 360) / 10;
  const waiting = (info.waiting_runs || 0) + (info.waiting_reviews || 0);
  const due = (info.due_runs || 0) + (info.due_reviews || 0);
  const done = (info.done_runs || 0) + (info.done_reviews || 0);
  const oldest = Math.min(...[info.oldest_runs, info.oldest_reviews].filter(Boolean));
  const cd = info.cooldown;
  const at = (ts) => new Date(ts * 1000).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  return `<div class="sub" style="margin-top:8px">☁ Облачная эскалация (ждут памяти дольше ${hours} ч):
    ${waiting ? `ждут памяти ${waiting}${Number.isFinite(oldest) ? `, дольше всех — ${ago(oldest)}` : ""}` : "никто не ждёт памяти"}${
    due ? ` · <b>готовы к облаку: ${due}</b>` : ""}${done ? ` · переведено в облако: ${done}` : ""}${
    cd ? `<br><span class="warn-txt">облако на паузе до ${at(cd.until)} — ${esc_kind(cd.kind)}</span>
      <span class="faint">${esc(String(cd.why || "").slice(0, 220))}</span>` : ""}</div>`;
}
function esc_kind(kind) {
  return ({ quota: "квота/токены кончились: сброс + 2 мин", overload: "провайдер перегружен: повтор через 5 мин",
            down: "сеть/провайдер недоступен: повтор через 5 мин", ok: "сбой был разовым",
            no_key: "нет ключа/доступа", config: "ошибка конфигурации", disabled: "облако выключено" })[kind] || kind;
}

function bindQueueCtl(scope, rerender) {
  const root = document.querySelector(scope);
  const call = async (path, body, msg) => {
    try { const r = await post(path, body); toast(msg(r)); rerender(); refresh(); }
    catch (e) { toast(e.message, true); }
  };
  const pauseBtn = root.querySelector("#q-pause");
  if (pauseBtn) pauseBtn.onclick = () => call("/api/queue/pause", {}, () => "очередь на паузе — текущий прогон доделается");
  const resumeBtn = root.querySelector("#q-resume");
  if (resumeBtn) resumeBtn.onclick = () => call("/api/queue/resume", {},
    (r) => `продолжено: в очереди ${r.queued}` + (r.resumed ? `, серий с паузы ${r.resumed}` : ""));
  const restoreBtn = root.querySelector("#q-restore");
  if (restoreBtn) restoreBtn.onclick = () => call("/api/queue/resume",
    { include_cancelled: true, include_expired: true },
    (r) => `возвращено ${r.restored}` + (r.skipped_duplicates ? `, пропущено дублей ${r.skipped_duplicates}` : ""));
  root.querySelectorAll("[data-qpause]").forEach((b) => {
    b.onclick = () => call("/api/queue/pause", { batch_id: b.dataset.qpause }, (r) => `серия на паузе: ${r.paused}`);
  });
  root.querySelectorAll("[data-qresume]").forEach((b) => {
    b.onclick = () => call("/api/queue/resume", { batch_id: b.dataset.qresume }, (r) => `серия продолжена: ${r.resumed}`);
  });
  root.querySelectorAll("[data-qrestore]").forEach((b) => {
    b.onclick = () => call("/api/queue/resume", { batch_id: b.dataset.qrestore, include_cancelled: true, include_expired: true },
      (r) => `возвращено ${r.restored}` + (r.skipped_duplicates ? `, дублей пропущено ${r.skipped_duplicates}` : ""));
  });
}

/* ── «с чего начать»: чек-лист готовности ─────────────────────────────── */
// Подсистема из пяти демонов, двух ключей, борда, индекса и графа не объясняет себя
// интерфейсом сама. Этот блок отвечает на «что уже работает / что сломано / куда жать»
// в одном месте — без него порядок действий приходится держать в голове.
const SETUP_STATE_KEY = "ai-council-setup-open";
// Обзор перерисовывается каждые 5 с, а проверка готовности дёргает Ollama, облако и
// четыре запроса к базе — на таком интервале это трата ради цифры, которая так часто
// не меняется. Держим ответ минуту и перерисовываем из него.
const setupCache = { at: 0, data: null };
async function renderSetup(force = false) {
  const box = $("#setup-card");
  if (!box) return;
  let d = setupCache.data;
  if (force || !d || Date.now() - setupCache.at > 60000) {
    try {
      d = await api("/api/setup");
      setupCache.data = d; setupCache.at = Date.now();
    } catch (e) {
      box.innerHTML = `<h3>С чего начать</h3><div class="sub">${esc(e.message)}</div>`;
      return;
    }
  }

  const problems = d.steps.filter((s) => !s.ok || s.level === "warn");
  let open;
  try { open = localStorage.getItem(SETUP_STATE_KEY); } catch (e) { open = null; }
  // Раскрыт сам — только если не готов обязательный шаг. «Частично» (ждут вердикта) —
  // рабочее состояние, а не поломка: из-за него список занимал весь первый экран «Обзора».
  const hard = d.steps.filter((s) => s.level !== "ok" && s.level !== "warn");
  const expanded = open === null ? hard.length > 0 : open === "1";
  const pending = problems.filter((s) => s.level !== "ok");

  const row = (s) => `
    <div class="row" style="justify-content:space-between; gap:10px; padding:5px 0;
         border-top:1px solid var(--line)">
      <div>
        <span class="tag ${s.level === "ok" ? "done" : s.level === "warn" ? "queued" : "failed"}">${
          s.level === "ok" ? "готово" : s.level === "warn" ? "частично" : "нет"}</span>
        <b style="margin-left:6px">${esc(s.title)}</b>
        <div class="sub">${esc(s.detail)}${s.level === "ok" ? "" : " — " + esc(s.fix)}</div>
      </div>
      <div class="row" style="gap:6px">${
        // Кнопка действия — только у незакрытых пунктов: «Выполнить» рядом с зелёной
        // галкой читается как «а надо ещё что-то сделать?».
        s.op && s.level !== "ok"
          ? `<button class="act" data-setup-op="${esc(s.op)}">Выполнить</button>` : ""}${
        s.tab ? `<button class="act" data-setup-tab="${esc(s.tab)}">Открыть</button>` : ""}</div>
    </div>`;

  box.innerHTML = `
    <div class="row" style="justify-content:space-between; align-items:center">
      <h3 style="margin:0">С чего начать — готово ${d.ready} из ${d.total}</h3>
      <div class="row" style="gap:6px">
        <button class="act" id="setup-guide">Как это работает</button>
        <button class="act" id="setup-toggle">${expanded ? "свернуть" : "развернуть"}</button>
      </div>
    </div>
    <div class="sub" id="setup-summary" ${expanded ? "hidden" : ""} style="margin-top:4px">${
      pending.length
        ? "Осталось: " + pending.map((s) => `${esc(s.title)} <span class="faint">(${
            s.level === "warn" ? "частично" : "нет"})</span>`).join(" · ")
        : "Всё готово."}</div>
    <div id="setup-list" ${expanded ? "" : "hidden"} style="margin-top:8px">
      <div class="sub" style="margin-bottom:6px">Порядок работы: борд синхронизируется сам →
        прогон карточки (вкладка «Карточки») → ревью результата и вердикт («лента» справа
        в шапке — это единственный сигнал обучения) → план на день собирается автоматически →
        выгрузка в Notion — только явной операцией на вкладке «Обзор».
        Подробно, с ценой каждого шага и словарём — кнопка «Как это работает».</div>
      ${d.steps.map(row).join("")}</div>`;

  $("#setup-guide").onclick = openGuide;
  $("#setup-toggle").onclick = () => {
    const list = $("#setup-list");
    list.hidden = !list.hidden;
    $("#setup-summary").hidden = !list.hidden;
    try { localStorage.setItem(SETUP_STATE_KEY, list.hidden ? "0" : "1"); } catch (e) { /* private */ }
    $("#setup-toggle").textContent = list.hidden ? "развернуть" : "свернуть";
  };
  box.querySelectorAll("[data-setup-op]").forEach((btn) => {
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        const r = await post("/api/ops", { name: btn.dataset.setupOp });
        toast(r.title ? `${r.title}: запущено — ход виден на вкладке «Обзор»`
                      : "запущено");
        setTimeout(() => renderSetup(true), 20000);
      } catch (e) { toast(e.message, true); btn.disabled = false; }
    };
  });
  box.querySelectorAll("[data-setup-tab]").forEach((btn) => {
    btn.onclick = () => selectTab(btn.dataset.setupTab);
  });
}

const QUALITY_RUNNING_CAP = 15;
const QUALITY_RUBRIC_CAP = 6;
let qualityAllRunning = false;
let qualityAllRubric = false;
// Выборка моделей в «Надёжности» и «Кому какая роль» — один переключатель на обе карточки.
let learnScope = "all";
const SCOPE_LABELS = { all: "все модели", local: "локальные", cloud: "облачные" };
const inScope = (cloud) => learnScope === "all" || (learnScope === "cloud") === !!cloud;
const whereTag = (cloud) => `<span class="tag ${cloud ? "cloud" : ""}">${cloud ? "облако" : "локально"}</span>`;
// Окно таблицы «Модели»: по умолчанию неделя — история целиком прячет текущее состояние за старыми сбоями.
let qualityDays = 7;
let qualityGen = 0;   // рисуем только ответ последнего запроса: быстрая смена окна иначе покажет чужой период
const REFUSAL_LABELS = { quota: "квота подписки", budget: "наш лимит вызовов", network: "сеть/таймаут",
  provider: "перегрузка провайдера", unparsed: "ответ не разобран", other: "прочее" };
async function renderQuality() {
  // Обе половины грузим параллельно; обучение — с деградацией: если его эндпоинт
  // недоступен, вкладка качества остаётся рабочей, а вместо секций обучения —
  // карточка с причиной.
  const gen = ++qualityGen;
  const [d, ld] = await Promise.all([
    api("/api/quality?days=" + qualityDays),
    api("/api/learning?module=" + encodeURIComponent(learnModule))
      .catch((e) => ({ error: e.message })),
  ]);
  if (gen !== qualityGen) return;
  const r = d.runs, cov = d.coverage;
  const rate = Math.round((r.done_rate || 0) * 100);

  const reasons = (d.abstain_reasons || []).map((x) => {
    const total = (d.abstain_reasons || []).reduce((a, b) => a + b.n, 0) || 1;
    return `<div style="margin:7px 0">
      <div class="row" style="justify-content:space-between">
        <span>${esc(x.reason)}</span><span class="mono">${x.n}</span></div>
      <div class="bar warn"><span style="width:${Math.round(100 * x.n / total)}%"></span></div>
    </div>`;
  }).join("") || '<div class="faint">воздержаний не было</div>';

  const profiles = (d.by_profile || []).map((p) => `<tr>
    <td><span class="tag ${["hybrid", "cloud"].includes(p.profile) ? "cloud" : ""}">${esc(p.profile)}</span></td>
    <td class="mono">${p.n}</td>
    <td class="mono">${p.done}</td>
    <td class="mono">${p.n ? Math.round(100 * p.done / p.n) + "%" : "—"}</td>
    <td class="mono">${num(p.readiness)}</td>
    <td class="mono">${num(p.confidence)}</td>
    <td class="sub">${dur(p.wall_ms)}</td>
  </tr>`).join("");

  // Очередь бывает в сотни прогонов — показываем начало, остальное по кнопке
  // (страница «Качества» была 24 000 px высотой из-за этой одной таблицы).
  const runningAll = d.running || [];
  const runningShown = qualityAllRunning ? runningAll : runningAll.slice(0, QUALITY_RUNNING_CAP);
  const running = runningShown.map((x) => `<tr class="clickable" data-run="${esc(x.id)}">
    <td class="wrap">${esc(x.title || x.card_id)}</td>
    <td><span class="tag ${["hybrid", "cloud"].includes(x.profile) ? "cloud" : ""}">${esc(x.profile)}</span></td>
    <td><span class="tag">${esc(x.track || "")}</span></td>
    <td class="sub">${x.started_at ? ago(x.started_at) + " идёт" : "в очереди"}</td>
  </tr>`).join("");

  const runningMore = runningAll.length > QUALITY_RUNNING_CAP
    ? `<tr><td colspan="4"><button class="act" id="q-run-more">${qualityAllRunning
        ? "свернуть" : `показать все ${runningAll.length}`}</button></td></tr>` : "";
  const recent = (d.recent || []).map((x) => `<tr class="clickable" data-run="${esc(x.id)}">
    <td class="wrap">${esc(x.title || "—")}</td>
    <td><span class="tag ${esc(x.status)}">${esc(x.status)}</span></td>
    <td><span class="tag ${["hybrid", "cloud"].includes(x.profile) ? "cloud" : ""}">${esc(x.profile)}</span></td>
    <td class="mono">${num(x.readiness)}</td>
    <td class="mono">${num(x.confidence)}</td>
    <td class="sub">${dur(x.wall_ms)} · ${ago(x.finished_at)} назад</td>
  </tr>`).join("");

  // Отказы до генерации (квота, наш лимит) — не качество модели: показываем их отдельно от «успеха».
  const refusalText = (r) => Object.entries(r || {}).filter(([, n]) => n)
    .map(([k, n]) => `${REFUSAL_LABELS[k] || k} ${n}`).join(", ");
  const models = (d.models || []).map((m) => {
    // Попытки, дошедшие до модели, считает сервер (зажато между «успешных» и «всех»); старый gateway — всех.
    const attempted = m.reached ?? m.n;
    const cls = attempted <= 0 ? "faint" : m.ok === attempted ? "ok-txt" : m.ok === 0 ? "bad-txt" : "warn-txt";
    return `<tr>
    <td class="mono">${esc(m.model)}</td>
    <td>${esc(m.role)}</td>
    <td class="mono">${m.n}</td>
    <td class="mono ${cls}">${m.ok}/${Math.max(attempted, 0)}</td>
    <td class="mono">${m.no_answer || 0}</td>
    <td class="mono">${m.unparsed || 0}</td>
    <td class="sub">${m.ms_ok ? dur(Math.round(m.ms_ok)) : "—"}</td>
    <td class="mono">${m.tokens_ok ? Math.round(m.tokens_ok) : "—"}</td>
    <td class="sub wrap">${esc(refusalText(m.cloud_refusals)) || "—"}</td>
  </tr>`;
  }).join("");
  const mw = d.models_window || {};
  const refusalInTable = refusalText(mw.cloud_refusals);
  const refusalTotals = refusalInTable + (mw.cloud_refusals_outside
    ? `${refusalInTable ? "; " : ""}ещё ${mw.cloud_refusals_outside} — у ролей вне таблицы (ревью, извлечение терминов)` : "");
  const daysOptions = [[1, "сутки"], [7, "7 дней"], [30, "30 дней"], [0, "вся история"]]
    .map(([v, label]) => `<option value="${v}" ${v === qualityDays ? "selected" : ""}>${label}</option>`).join("");

  const v = d.verdicts || {};

  /* ── секции обучения (бывшая вкладка «Обучение», §9) ── */
  let learnBar = "", learnCards = "", learnTables = "";
  if (ld.error) {
    learnTables = `<div class="card" style="margin-top:12px; border-color:var(--warn-bd)">
      <h3>Обучение</h3><div class="sub">недоступно: ${esc(ld.error)}</div></div>`;
  } else {
    const s = ld.signals, cfg = ld.settings;

    const modOpts = (ld.modules && ld.modules.length ? ld.modules : ["*"]).map((m) =>
      `<option value="${esc(m)}"${m === learnModule ? " selected" : ""}>${
        m === "*" ? "все модули (агрегат)" : esc(m)}</option>`).join("");

    // Старый шлюз без отметки облака: выборка не работает — показываем все, селектор выключен.
    const scopeReady = !!ld.role_board;
    if (!scopeReady) learnScope = "all";
    const relRows = (ld.reliability || []).filter((x) => inScope(x.cloud));
    // «В общей массе»: один апостериор по выборке — наблюдения складываются, приор 1/1 берётся один раз.
    const relSum = relRows.reduce((acc, x) => ({ a: acc.a + (x.alpha - 1), b: acc.b + (x.beta - 1) }), { a: 0, b: 0 });
    const relTotal = relRows.length ? (relSum.a + 1) / (relSum.a + relSum.b + 2) : null;
    const relCounts = { local: 0, cloud: 0 };
    for (const x of ld.reliability || []) relCounts[x.cloud ? "cloud" : "local"]++;
    const scopeOpts = Object.entries(SCOPE_LABELS).map(([v, label]) =>
      `<option value="${v}"${v === learnScope ? " selected" : ""}>${label}${
        v === "all" ? "" : ` (${relCounts[v]})`}</option>`).join("");
    const rel = relRows.map((x) => `<tr${x.prior ? ' class="faint" title="наблюдений нет — приор 1/1"' : ""}>
      <td class="mono">${esc(x.model)}</td>
      <td>${whereTag(x.cloud)}</td>
      <td>${esc(x.role)}</td>
      <td class="mono">${num(x.reliability, 2)}</td>
      <td>${reliabilityBar(x.reliability)}</td>
      <td class="mono">${num(x.alpha, 1)} / ${num(x.beta, 1)}</td>
      <td class="mono ${x.observations >= cfg.min_observations ? "" : "faint"}">${
        num(x.observations, 0)}</td>
    </tr>`).join("");

    const reviews = (ld.reviews || []).map((x) => `<tr>
      <td class="mono">${esc(x.model)}</td>
      <td>${esc(x.role)}</td>
      <td class="mono">${x.n}</td>
      <td class="mono ${Math.abs((x.w || 1) - 1) < 0.005 ? "faint" : ""}">${num(x.w, 2)}</td>
    </tr>`).join("");

    const clouds = new Set(((ld.role_board || {}).cloud) || []);
    const rb = ld.role_board || { roles: {}, rosters: {} };
    const scopeWord = { all: "", local: " из локальных", cloud: " из облачных" }[learnScope];
    // Ростеры — одной компактной таблицей «профиль → роли»; в блоках ролей — только кандидаты и статус.
    const boardRoles = Object.keys(rb.roles || {});
    const rosterRows = Object.entries(rb.rosters || {}).map(([profile, roster]) => `<tr>
      <td><span class="tag">${esc(profile)}</span></td>${boardRoles.map((role) => {
        const m = roster[role];
        return `<td class="mono ${m && inScope(clouds.has(m)) ? "" : "faint"}" style="font-size:11px">${
          m ? esc(m) : "—"}</td>`;
      }).join("")}</tr>`).join("");
    const rosterTable = rosterRows ? `<div class="tablewrap" style="margin:6px 0 8px"><table>
      <thead><tr><th>Профиль</th>${boardRoles.map((r) => `<th>${esc(r.replace("proposer.", ""))}</th>`).join("")}</tr></thead>
      <tbody>${rosterRows}</tbody></table></div>` : "";
    const roleBoard = Object.entries(rb.roles || {}).map(([role, rows]) => {
      const cands = rows.filter((x) => inScope(x.cloud));
      const best = cands[0];
      // «В деле» — по ростерам той же выборки, что и строка кандидатов.
      const bestIn = best ? (best.in || []).filter((profile) => inScope(clouds.has(((rb.rosters || {})[profile] || {})[role]))) : [];
      const badge = !cands.length ? `<span class="tag">в выборке никого</span>`
        : best.basis === "prior" ? `<span class="tag">данных мало</span>`
        : bestIn.length ? `<span class="tag done">лучший${scopeWord} уже в деле</span>`
        : `<span class="tag warn">лучший${scopeWord} не назначен</span>`;
      const top = cands.slice(0, 3).map((x) => `<div class="sub" style="margin:2px 0">
        <span class="mono">${esc(x.model)}</span> ${whereTag(x.cloud)}
        <span class="mono">${num(x.score, 2)}</span>
        <span class="faint">(${esc(BASIS_NOTE[x.basis] || x.basis)}${x.in && x.in.length
          ? `; сейчас: ${esc(x.in.join(", "))}` : ""})</span></div>`).join("");
      return `<div style="margin:10px 0; padding-top:8px; border-top:1px solid var(--line, #eee)">
        <div class="row" style="justify-content:space-between"><b>${esc(role)}</b>${badge}</div>
        ${top || '<div class="sub faint">кандидатов в выборке нет</div>'}
      </div>`;
    }).join("");
    const glmSwap = rb.glm_swap ? [rb.glm_swap] : [];
    // Профиль попадает в выборку, если в его ростере есть модель этой выборки (hybrid — в обеих).
    const recInScope = (x) => learnScope === "all"
      || Object.values(x.current || {}).some((m) => inScope(clouds.has(m)));
    const recs = [...(ld.recommendations || []), ...glmSwap].filter(recInScope).map((x) => {
      if (!x.available) {
        return `<div style="margin:9px 0">
          <div class="row" style="justify-content:space-between">
            <b>${esc(x.profile)}</b><span class="tag">нет данных</span></div>
          <div class="sub">${esc(x.reason || "")}</div></div>`;
      }
      const changes = Object.entries(x.changes || {});
      if (!changes.length) {
        return `<div style="margin:9px 0">
          <div class="row" style="justify-content:space-between">
            <b>${esc(x.profile)}</b><span class="tag done">уже лучшее</span></div>
          <div class="sub">перестановка ролей ничего не улучшает</div></div>`;
      }
      const rows = changes.map(([role, ch]) => {
        const basis = (x.basis || {})[role + ":" + ch.to] || {};
        return `<div class="sub" style="margin:3px 0">${esc(role)}:
          <span class="mono">${esc(ch.from)}</span> → <span class="mono">${esc(ch.to)}</span>
          <span class="faint">(${esc(BASIS_NOTE[basis.from] || "—")})</span></div>`;
      }).join("");
      return `<div style="margin:9px 0">
        <div class="row" style="justify-content:space-between">
          <b>${esc(x.profile)}</b>
          <span class="tag ${x.applied ? "running" : "warn"}">${
            x.applied ? "применяется" : "предложение"}</span></div>
        ${rows}
        <div class="sub faint">сумма надёжности ${num(x.current_score, 2)} →
          ${num(x.recommended_score, 2)}</div></div>`;
    }).join("");

    // Новые (ждут решения) — сверху, внутри — по числу повторов; список длиной в сотни
    // карточек растягивал «Качество» на 18 000 px — показываем начало, остальное по кнопке.
    const rubricAll = [...(ld.rubric || [])].sort((a, b) =>
      ((a.status === "new" ? 0 : 1) - (b.status === "new" ? 0 : 1)) || ((b.hits || 0) - (a.hits || 0)));
    const rubricShown = qualityAllRubric ? rubricAll : rubricAll.slice(0, QUALITY_RUBRIC_CAP);
    const rubricNew = rubricAll.filter((x) => x.status === "new").length;
    const rubricMore = rubricAll.length > QUALITY_RUBRIC_CAP
      ? `<button class="act" id="q-rubric-more">${qualityAllRubric ? "свернуть"
          : `показать все ${rubricAll.length}`}</button>` : "";
    const rubric = rubricShown.map((x) => `<div class="card" style="margin-bottom:8px">
      <div class="row" style="justify-content:space-between">
        <b>${esc(x.pattern)}</b>
        <span class="chip-row">
          <span class="tag long">${esc(x.target)}</span>
          <span class="tag ${x.status === "applied" ? "done" : x.status === "dismissed"
            ? "failed" : "running"}">${
            x.status === "applied" ? "внесено" : x.status === "dismissed"
              ? "отклонено" : "новое"}</span>
          <span class="tag">повторов: ${x.hits}</span></span></div>
      <div style="margin:6px 0">${esc(x.suggestion)}</div>
      <details><summary class="sub">улики — ${(x.evidence || []).length} причин</summary>
        ${(x.evidence || []).map((e) => `<div class="sub" style="margin:4px 0">
          <span class="tag ${e.decision === "reject" ? "failed" : "running"}">${
            esc(e.decision)}</span> ${esc(e.comment)}</div>`).join("")}
      </details>
      ${x.status === "new" ? `<div class="chip-row" style="margin-top:8px">
        <button class="act" data-rubric="${x.id}" data-decide="applied">Внёс в промпт</button>
        <button class="act" data-rubric="${x.id}" data-decide="dismissed">Не нужно</button>
      </div>` : ""}
    </div>`).join("") || `<div class="empty">предложений нет — либо причин отклонений меньше
      ${cfg.rubric_drift_suggest_after}, либо повторяющегося дефекта среди них не нашлось</div>`;

    learnBar = `
    <div class="toolbar">
      <select id="f-learn-module">${modOpts}</select>
      <button class="act" id="learn-run">Учесть вердикты сейчас</button>
      <span class="sub">${ld.enabled ? "обучение включено" : "обучение выключено в конфиге"}
        · проход каждые ${cfg.rebuild_minutes} мин</span>
    </div>`;

    learnCards = `
      <div class="card">
        <h3>Ждут вашего вердикта</h3>
        <div class="big ${s.awaiting_verdict ? "warn-txt" : "ok-txt"}">${s.awaiting_verdict}</div>
        <div class="sub">без вердикта прогон ничему не учит — это единственный сигнал §9</div>
      </div>
      <div class="card">
        <h3>Вердиктов учтено</h3>
        <div class="big">${s.verdicts_counted}</div>
        <div class="chip-row" style="margin-top:6px">
          <span class="tag done">принято: ${(s.verdicts || {}).accept || 0}</span>
          <span class="tag running">с правками: ${(s.verdicts || {}).edit || 0}</span>
          <span class="tag failed">отклонено: ${(s.verdicts || {}).reject || 0}</span>
        </div>
      </div>
      <div class="card">
        <h3>Галлюцинаций начислено</h3>
        <div class="big ${s.hallucinations_counted ? "warn-txt" : ""}">${
          s.hallucinations_counted}</div>
        <div class="sub">от верификатора, независимо от вердикта</div>
      </div>
      <div class="card">
        <h3>Образцов в корпусе</h3>
        <div class="big ${s.exemplars ? "ok-txt" : "faint"}">${s.exemplars}</div>
        <div class="sub">принятые результаты подмешиваются в улики следующих прогонов</div>
      </div>`;

    learnTables = `
    <div class="split wide-first" style="margin-top:12px">
      <div class="card" style="padding:0">
        <div class="row" style="padding:14px 14px 0; justify-content:space-between; gap:8px; flex-wrap:wrap">
          <h3 style="margin:0">Надёжность моделей — Beta(α, β)</h3>
          <label class="sub" ${scopeReady ? "" : 'title="обновите шлюз консилиума — нет отметки облака"'}>выборка
            <select id="learn-scope" ${scopeReady ? "" : "disabled"}>${scopeOpts}</select></label>
        </div>
        <div class="sub" style="padding:0 14px">Доля удачного из учтённого: вердикты
          владельца плюс находки верификатора. Приор 1/1 даёт 0.50 без данных —
          новая модель не наказана и не поощрена. Показаны все пары «модель × роль», из которых
          выбирает совет; бледные строки — пары без наблюдений.</div>
        ${!s.verdicts_counted && s.hallucinations_counted ? `<div class="sub warn-txt"
          style="padding:6px 14px 0">Вердиктов пока ноль: всё, что ниже, набрано
          выдуманными ссылками, которые поймал верификатор. Это не оценка полезности
          модели — это только её аккуратность. Поставьте вердикты, чтобы числа начали
          значить то, что написано в заголовке.</div>` : ""}
        <div class="tablewrap"><table>
          <thead><tr><th>Модель</th><th>Где</th><th>Роль</th><th>Надёжность</th><th></th>
            <th>α / β</th><th>Наблюдений</th></tr></thead>
          <tbody>${rel || emptyRow(7, (ld.reliability || []).length
            ? `в выборке «${SCOPE_LABELS[learnScope]}» строк нет`
            : "вердиктов ещё не было — статистике неоткуда взяться")}</tbody>
          ${relTotal !== null ? `<tfoot><tr>
            <td colspan="3"><b>В общей массе</b> <span class="sub">— ${esc(SCOPE_LABELS[learnScope])},
              строк ${relRows.length}; взвешено числом наблюдений, роли не разделены</span></td>
            <td class="mono"><b>${num(relTotal, 2)}</b></td><td>${reliabilityBar(relTotal)}</td>
            <td class="mono">${num(relSum.a + 1, 1)} / ${num(relSum.b + 1, 1)}</td>
            <td class="mono">${num(relSum.a + relSum.b, 0)}</td></tr></tfoot>` : ""}
        </table></div>
      </div>
      <div class="card">
        <h3>Кому какая роль <span class="faint">— ${esc(SCOPE_LABELS[learnScope])}</span></h3>
        <div class="sub">Кто играет роль сейчас (таблица) и три лучших кандидата по данным в выборке слева.
          Оценка — та же, что у перестановки: по роли, иначе по репутации модели; без данных — в конце.</div>
        ${rosterTable}${roleBoard || '<div class="empty">ростеров нет</div>'}
        <h4 style="margin:14px 0 4px">Перестановка внутри ростера</h4>
        <div class="sub">Состав моделей и число свопов не меняются. Автоприменение
          ${cfg.role_selection ? "<b>включено</b>" : "выключено"}
          (learning.role_selection); у GLM 5.x роли — из [models.glm_all.models].</div>
        ${recs || `<div class="empty">профилей в выборке «${esc(SCOPE_LABELS[learnScope])}» нет</div>`}
      </div>
    </div>

    <div class="split" style="margin-top:12px; align-items:start">
      <div class="card" style="padding:0">
        <h3 style="padding:14px 14px 0">Вес рецензентов</h3>
        <div class="sub" style="padding:0 14px">Взвешивание
          ${cfg.review_weighting ? "включено" : "<b>выключено</b>"}; вес 1.00 означает
          «данных меньше ${cfg.min_observations} наблюдений, оценка не искажается».</div>
        <div class="tablewrap"><table>
          <thead><tr><th>Модель</th><th>Роль</th><th>Рецензий</th><th>Средний вес</th></tr></thead>
          <tbody>${reviews || emptyRow(4, "рецензий не было")}</tbody>
        </table></div>
      </div>
      <div class="card">

function bindRunRows(scope) {
  document.querySelectorAll(`${scope} tr[data-run]`).forEach((tr) => {
    tr.onclick = () => openRun(tr.dataset.run);
