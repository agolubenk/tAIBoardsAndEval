# AI Council — конфигурация. Канон: docs/specs/ai-council.md §11.
#
# Формат TOML (не YAML, как в первой редакции спеки): парсится stdlib-модулем `tomllib`
# (Python 3.11+), поэтому у подсистемы ноль внешних зависимостей — как у .claude/scripts/*.
#
# Это файл владельца: правится руками, консилиум его не переписывает. Всё, что меняется
# от прогона к прогону (окно планирования, список карточек), передаётся аргументами CLI.

# ─────────────────────────────────────────────────────────────────────────────
# Что откуда брать
# ─────────────────────────────────────────────────────────────────────────────
[sources.notion]
enabled = true
# Заморожен (R-084, 30.10): канон открытого — t-boards. Клиент отклоняет любую запись до сети,
# включая переходы ревью и статус из UI, которые белый список writeback не покрывает.
read_only = true
api_version = "2022-06-28"
key_file = ".claude/council/.notion-key"   # fallback: env NOTION_API_KEY
poll_interval_min = 15
rate_limit_rps = 3
# Half-baked карточки: elaborate_only — прорабатываем, но НЕ планируем в рабочее окно (§7а).
# Значения: elaborate_only | skip | full
half_baked = "elaborate_only"

[sources.notion.databases.bugs]
id = "714f2a2f-5274-485e-84ca-ee701ed5df19"
weight = 2.0                                # «Ошибки» обгоняют «Задачи» (rules/17 §2)
statuses = ["открыто", "в работе"]

[sources.notion.databases.tasks]
id = "256853cd-b4ae-4394-a768-a2a2ebd3c5fe"
weight = 1.0
statuses = ["задача от пользователя", "прожаренные явные задачи", "в работе"]

[sources.notion.exclude]
modules = []
backlog_ids = []

[sources.rag]
db = ".claude/rag/index.db"
# `done_entry` (записи docs/plans/done/) сюда НЕ добавлен — замер 2026-10-09, 33 карточки, FTS без
# Ollama: в конце списка проходит бюджет RAG-ведра в 3 капсулах из 33 (на 3 контрольных — ни в
# одной, +3–5 к отброшенным) и при этом вытесняет 10 улик по коду; первым в списке — есть всегда,
# но вытесняет 44 улики spec/rule_chunk/api_route и 8 улик корпуса. Это дубль: 62 % записей
# совпадают по заголовку с `done_md` корпуса, а у опыта (card/done_md) свой бюджет в капсуле.
types = ["api_route", "prisma_model", "proto_rpc", "rule_chunk", "spec"]
hits_per_type = 4

[sources.done_md]
# Канон закрытого: оглавление docs/plans/DONE.md + записи по модулям в docs/plans/done/*.md (с 2026-10-08).
path = "docs/plans/done"
use_for = ["prior_art", "effort_calibration"]

# ─────────────────────────────────────────────────────────────────────────────
# Собственная база знаний консилиума (корпус FTS5 + эмбеддинги в council.db).
#
# RAG-индекс DAMS отвечает на «что в коде есть»; эти источники — на «как здесь принято
# и что запрещено». Без них модель предлагает технически возможное и локально
# запрещённое (`body: unknown`, raw fetch вместо HttpClientService, статический импорт
# exceljs), а верификатор такое не ловит: файлы существуют, ссылки настоящие. Это тот
# класс ошибок, который всплывает на ревью — то есть после записи результата в карточку.
#
# Индексируется посекционно (заголовки #/##/###), не файлами целиком: правило на 400
# строк вернулось бы по любому запросу и вытеснило из капсулы всё остальное.
# ─────────────────────────────────────────────────────────────────────────────
[[sources.knowledge.paths]]
kind = "rule"                  # запреты и конвенции проекта — высший приоритет
path = ".claude/rules"
glob = "*.md"

[[sources.knowledge.paths]]
kind = "agent"                 # описания саб-агентов: кто за что отвечает
path = ".claude/agents"
glob = "*.md"

[[sources.knowledge.paths]]
kind = "skill"                 # процедуры: как делается миграция, релиз, ревью
path = ".claude/skills"
glob = "*.md"

[[sources.knowledge.paths]]
kind = "chunk"                 # доменные срезы DAMS (arch/*, domain/*)
path = ".claude/memory/chunks"
glob = "*.md"

# ── Единые знания ИИ-сервисов (2026-10-09, §6) ───────────────────────────────
# То, чем живут остальные ИИ-клиенты проекта (Claude Code, Continue, Copilot/Codex/Roo/Kimi
# через MCP-хаб), а консилиум не видел. Обратное направление уже есть: council_knowledge_search
# отдаётся всем клиентам через хаб (infra/mcp-hub/mcp.json) — с этими видами они ищут и по ним.
#
# Ключи источника (все необязательные, кроме kind/path): glob — строка или список шаблонов
# ИМЕНИ файла; exclude — шаблоны имени каталога/файла или относительного пути (node_modules,
# worktrees, .git, prototipes, artifacts, dist/build и прочий вывод сборки отрезаются всегда);
# path — от корня репозитория, абсолютный или с `~`; `{claude_project_id}` — id проекта
# Claude Code, выводится из пути репозитория (имя пользователя в конфиг не зашивается);
# max_docs (секций, по умолчанию 1500) / max_files (2000) / max_file_bytes (256 КБ) — потолки;
# enabled = false — источник выключен И его документы вычищаются из корпуса при следующем
# проходе; scrub — чистка секретов/PII (вне репозитория включена всегда, выключить нельзя).
# Документы исчезнувших файлов вычищаются по виду (не больше 200 за проход).

[[sources.knowledge.paths]]
kind = "role"                  # карточки ролей: «кто ты в этом месте репозитория» — зона, логика, гейт
path = "."                     # 36 CLAUDE.md по дереву + AGENTS.md (Codex); обход 0.09–0.14 с с отсечками
glob = ["CLAUDE.md", "AGENTS.md"]
# Сверх встроенных отсечек: зеркала скиллов и клиентов (.claude, .agents, .windsurf) и
# неотслеживаемые каталоги в корне основного чекаута (claude-plugins-official, Users, tmp):
# CLAUDE.md оттуда коммит-ревью не проходил, а scrub внутри репозитория не включается.
# Замер 2026-10-09: найденное обходом совпадает с `git ls-files` (37 = 37).
exclude = [".claude", ".agents", ".windsurf", "claude-plugins-official", "Users", "tmp"]
title_from = "dir"             # 37 файлов «CLAUDE» неразличимы — заголовок по каталогу роли
max_docs = 400

[[sources.knowledge.paths]]
kind = "client_rule"           # правила Continue: облачный бюджет, ротация моделей, адверс. проверка
path = ".continue/rules"
glob = "*.md"
max_docs = 200

[[sources.knowledge.paths]]
kind = "memory"                # авто-память Claude Code: решения и уроки прошлых сессий владельца
# ВНЕ репозитория, коммит-ревью не проходила → всегда scrub (ключи, токены, JWT, почта, телефоны,
# публичные IP, пароли в URL и в присваиваниях, домашний каталог → `~`). `type: user` (профиль
# владельца, личные предпочтения) не берётся:
# это не знание о проекте, а персональные данные, которым нечего делать в облачной капсуле.
path = "~/.claude/projects/{claude_project_id}/memory"
glob = "*.md"
exclude = ["MEMORY.md"]        # оглавление — дубль описаний остальных файлов
frontmatter = true             # шапку срезаем, её description — заголовок документа
title_from = "frontmatter"
skip_types = ["user"]
max_docs = 300

[sources.knowledge.claude_mem]
# Межсессионная память claude-mem (SQLite, читается строго `mode=ro`, таймаут 2 с; нет файла —
# источник молча выключен). В БД есть чувствительное (security_alert/security_note/sensitive,
# инцидент с PII в дампе БД) — поэтому берутся ТОЛЬКО решения ЭТОГО проекта за окно: типы с
# основой security/sensitive/secret/credential/privacy/pii не индексируются никогда (запрет в
# коде, конфиг его не снимает, валидатор ругается), записи о PII/дампах/паролях/ключах/утечках
# отбрасываются целиком (21 %: 29 из 136 решений за 45 дней, замер 2026-10-09), остальное — scrub.
# `discovery` не берётся: 6.7 тыс. записей за 90 дней — шум разведки, а не решения.
enabled = true
kind = "mem_obs"
path = "~/.claude-mem/claude-mem.db"
project = ""                   # пусто = имя основного чекаута (HR_Helper-v2), как у claude-mem
types = ["decision"]
window_days = 45
max_docs = 120
timeout_seconds = 2

[sources.graph]
enabled = true
path = "graphify-out/graph.json"
max_hops = 2
max_neighbors = 12
# Сколько узлов графа попадает в корпус знаний. Весь граф заливать нельзя: на этом
# репозитории это 68k узлов против 463 документов знаний и 146 карточек — BM25 начнёт
# выдавать безымянные узлы по любому запросу, а шаг эмбеддингов уйдёт в бесконечный
# догоняющий цикл. Берутся самые связанные (god-узлы и их окружение) — хвост из узлов
# с одной связью не отвечает ни на один вопрос.
corpus_nodes = 400

[sources.mcp]
serena = "on_demand"     # дорогой прогрев LSP — только для символов, которых нет в индексе
headroom = true          # сжатие длинных тредов обсуждения
claude_mem = true        # «обсуждали ли это раньше»
timeout_seconds = 30
council = true                    # P4 (Ф2): mcp_server.py — консилиум как источник для внешних агентов
compress_threshold_chars = 4000   # ответ инструмента длиннее — попытка сжатия через Headroom (§P4)

# ─────────────────────────────────────────────────────────────────────────────
# Модели. Потолок машины — 24 GB, поэтому max_resident_large жёстко = 1 (§4, C1)
# ─────────────────────────────────────────────────────────────────────────────
[models]
ollama_url = "http://127.0.0.1:11434"
max_resident_large = 1
profile = "adaptive"        # adaptive | fast | deep   (решение D4)
batch_by_role = true        # свопы O(ролей), а не O(карточки × роли)
keep_alive_active = "10m"
request_timeout_seconds = 300
# B-72 (2026-08-30): без явного num_ctx Ollama грузит модели с дефолтным потолком 4096
# независимо от n_ctx_train — обрывало ~24% локальных прогонов на середине JSON-ответа.
# 8192 проверено эмпирически (VRAM-разница от 4096 незначительна, ~15 MB). Единое значение
# на все роли — per-call пересчёт заставлял бы Ollama пересоздавать runner (эффективно
# reload) для L-моделей на каждый вызов вместо одного свопа на батч (см. ollama.py).
num_ctx = 8192
# Memory-guard (2026-10-04): L-модель не грузится, если ей некуда встать без своп-трэша
# (ollama.memory_snapshot: free/inactive/давление памяти macOS). Замер: при занятом свопе
# загрузка 17 GB шла дольше 5-минутного таймаута Ollama — серия из 95 карточек ушла в
# пустые воздержания, а машина гоняла своп. Прогон в таком случае не воздерживается, а
# откладывается на memory_backoff_seconds. margin — KV-кэш и рабочая память runner'а.
memory_guard = true
memory_margin_gb = 1.5
memory_backoff_seconds = 600
# Тяжелее порога — L-тир (лок «одна резидентно» + guard), даже без записи в [models.large]:
# модель, выбранная в UI (ревью, привязки ролей), иначе грузилась бы рядом с 30B.
large_threshold_gb = 9.0

# Тир L — резидентно не более одной за раз. Размеры для контроля бюджета.
# С 2026-10-23 пусто после d-mac-models = drop-4 (владелец удалил qwen3-coder:30b, qwen3.6:27b
# и mistral-small3.2); 2026-10-28 вернулся один Tiel-Coder — решение владельца в диалоге.
# Любая модель тяжелее large_threshold_gb всё равно идёт по L-правилам.
[models.large]
# Tiel-Coder 35B-A3B (Ornith-1.5, qwen3.5-moe), unsloth-dynamic IQ3_S + MTP + mmproj.
# Ставится npm run ollama:tiel-coder (GGUF 14.07 ГБ в infra/local/ollama/gguf/, gitignored).
"tiel-coder:35b-a3b-iq3s" = 13.1

# Триажный проход. Роль skeptic здесь НЕ задана намеренно: после вывода DeepSeek
# третьей независимой S-модели на машине не осталось (установлены только qwen2.5:7b
# и glm4), а два прогона одной и той же модели под разными промптами независимым
# мнением не являются — это иллюзия консилиума. Скептик включается в `deep`.
# Хочешь полную тройку и в триаже — поставь ЛЮБУЮ третью S-модель (~5 GB) и впиши сюда.
[models.roles.fast]
"proposer.code" = "qwen2.5:7b"
"proposer.arch" = "glm4:latest"
arbiter = "glm4:latest"
extractor = "qwen2.5:7b"
embed = "nomic-embed-text:latest"

# Тяжёлый проход. С 2026-10-28 код-предложения даёт локальный Tiel-Coder 35B-A3B (L-модель
# из [models.large]: одна резидентно, батчи ролей строго последовательно — deep стал медленнее
# на свопах модели, но экономит один облачный вызов на карточку). Архитектура и арбитр — облако,
# как в `cloud`; скептик — локальный glm4 (другая линейка: другой корпус, другие систематические
# ошибки). Арбитр — третья модель: он не оценивает своё предложение (Tiel-Coder ≠ glm-4.7 ≠ glm-5.2,
# независимость предложений сохранена). Без облака (квота, ключ) прогон ждёт сброса квоты
# (CloudQuotaWait), а не падает. В deep поднимаются только critical/P0.
[models.roles.deep]
"proposer.code" = "tiel-coder:35b-a3b-iq3s"
"proposer.arch" = "free"
"proposer.skeptic" = "glm4:latest"
arbiter = "free"
extractor = "free"
embed = "nomic-embed-text:latest"

# ─────────────────────────────────────────────────────────────────────────────
# Профили с облачными участниками. Здесь GLM не «разрешает тупик» (это §4а,
# models.cloud.escalate_when), а сидит в самом консилиуме наравне с локальными.
#
# Различать модели по имени НЕЛЬЗЯ: `glm4:latest` — локальный тег Ollama,
# `glm-4.6` — облачная модель Z.AI. Маршрутизация идёт по ростеру провайдеров
# (models.cloud.providers.*.models), см. Council.is_cloud_model.
#
# Оба профиля требуют включённого облака (AI_COUNCIL_CLOUD=1 либо enabled=true) —
# иначе воркер откажется стартовать, а не отработает вхолостую.
#
# ЦЕНА В ВЫЗОВАХ ПОДПИСКИ (главный лимит — окно, по умолчанию 30 вызовов за 5 ч):
#
#   hybrid — 1 вызов на карточку: предложения и рецензии остаются локальными
#            (бесплатны и безлимитны), в облако уходит только арбитраж — то самое
#            место, где локальный контур слабее всего. ≈30 карточек за окно.
#            Это профиль для прохода по борду.
#
#   cloud  — 5 вызовов на карточку: 2 предложения (разные модели = разные
#            систематические ошибки) + 2 перекрёстные рецензии + 1 арбитраж.
#            ≈6 карточек за окно. Это профиль для отдельных тяжёлых карточек,
#            а не для прогона по всему борду.
#
# Скептик в `cloud` намеренно не задан: третья ступень лестницы — тот же корпус
# и тот же провайдер, что и первые две, независимым мнением она не является.
# Роль скептика лучше держит локальный glm4 (см. комментарий к models.roles.deep).
#
# hybrid с 2026-10-28 — локальные предлагающие из `fast`, арбитр на бесплатной авторотации
# OpenRouter (пул auto провайдера local_gateway; решение владельца hybrid_primary): 0 вызовов
# подписки GLM на карточку, окно остаётся для deep. Скептика нет: glm4 уже proposer.arch,
# а две роли на одной модели независимыми мнениями не являются.
[models.roles.hybrid]
"proposer.code" = "tiel-coder:35b-a3b-iq3s"
"proposer.arch" = "glm4:latest"
arbiter = "free"              # local_gateway: бесплатный OpenRouter, ротация на каждый запрос
extractor = "free"
embed = "nomic-embed-text:latest"

[models.roles.cloud]
"proposer.code" = "free"
"proposer.arch" = "free"
arbiter = "free"
extractor = "tiel-coder:35b-a3b-iq3s"      # служебные роли остаются локальными: они дёргаются часто
embed = "nomic-embed-text:latest"

# Кто из триажа поднимается в тяжёлый проход
# Решение владельца d-council-run = narrow (2026-10-17): deep — только critical и P0. Прежние правила
# (high, >3 модулей, воздержание fast, confidence < 0.5, half-baked) отправляли в deep большую часть борда:
# на 16.10 в очереди стояло 390 deep-прогонов при 37,5 мин на прогон и 16,7 ГБ на модель — около 10 суток
# на свободном Mac 24 ГБ. Вернуть прежнее — те же ключи; снятые прогоны — queue_control.py resume --cancelled.
[models.escalate_to_deep_when]
severity_in = ["critical"]
priority_in = ["P0"]
fast_abstained = false
in_planning_window = false          # код этот ключ не читает (council_worker.should_escalate) — оставлен выключенным
half_baked = false

# ─────────────────────────────────────────────────────────────────────────────
# Облачный ярус (§4а) — только для того, что локальный контур не вытянул.
#
# Правило простое: облако не «улучшает» результат, оно разрешает конфликт. Поэтому
# вход туда — не «модель звучит неуверенно», а факт: локальный консилиум воздержался
# либо выдал результат с низкой подтверждённостью по критичной карточке.
#
# Выключено по умолчанию. Включение: `enabled = true` либо AI_COUNCIL_CLOUD=1 на прогон.
# Права: только чтение и текстовый вердикт. Записи в Notion/файлы у облака нет нигде.
# ─────────────────────────────────────────────────────────────────────────────
[models.cloud]
enabled = true
# 420: glm-5 отвечает ревьюеру ~160–200 с на ~13k входа / 10k выхода; при 180 первый же таймаут
# ставил кэш-маркер сбоя и обрывал остаток прогона (2026-10-10, rv_22e8d7777cae).
request_timeout_seconds = 420

# Headroom (127.0.0.1:8787) — прокси оптимизации контекста: сжимает промпт, кэширует
# префиксы, ведёт учёт экономии в своём дашборде (/dashboard). Пропуская облачные вызовы
# через него, консилиум виден в общей с остальным проектом картине расхода; напрямую
# трафик GLM в дашборде не появляется вовсе.
#
# Прокси не обязателен: если он потушен, `/health` не отвечает и вызовы идут напрямую
# (проверка кэшируется на 30 с, чтобы не платить таймаутом на каждой карточке).
# Gemini сюда не входит — у него свой протокол, этот маршрут его не понимает.
[models.cloud.headroom]
enabled = true
# `/p/ai-council` — метка в учёте Headroom (/stats → savings.per_project): расход консилиума
# виден отдельно от Continue и Claude Code. `/health` под префиксом прокси тоже отдаёт.
url = "http://127.0.0.1:8787/p/ai-council"
providers = ["zai"]

[models.cloud.providers.zai]
# Coding Plan (подписка GLM Coding Lite), НЕ General API (/api/paas/v4).
# Проверено живыми запросами 2026-08-13: на General API ключ отвечает
# 429 «Insufficient balance or no resource package» для ВСЕХ моделей, на coding — 200.
# Это два разных биллинговых контура на одном ключе, смешивать нельзя.
base_url = "https://api.z.ai/api/coding/paas/v4"
# glm-5.1 и glm-5.3 добавлены 2026-10-09 под режим «всё на GLM 5.x» (models.glm_all): их
# отдаёт GET /models этого endpoint'а (там же glm-5-turbo, glm-5.3-flash/flashx), но живым
# чат-вызовом на подписке они ещё не проверены — список моделей ≠ «входит в план»
# (так glm-4.7-flash оказался стабильным 429). Поэтому в режиме они только на ролях, где
# отказ деградирует раунд, а не прогон (proposer.arch / proposer.skeptic); арбитр и судья —
# на проверенной glm-5.2. Прайс в fallback.pricing — как у glm-5/5.2 (оценочный, завышенный):
# вне режима они уходят на платный контур только в его же потолках (10 вызовов и $1 в сутки);
# в режиме платный контур закрыт кодом (cloud.Budget.glm_mode) — только подписка.
models = ["glm-4.6", "glm-4.7", "glm-5", "glm-5.1", "glm-5.2", "glm-5.3"]
timeout_seconds = 420

# Второй контур того же провайдера: General API (pay-as-you-go, ОТДЕЛЬНЫЙ ключ и
# отдельный кошелёк). Модели те же — это не «ещё один провайдер», а второй платёжный
# маршрут. Включается ровно на двух классах отказа основного контура:
#   quota      — кончилось окно подписки;
#   no_balance — ключ подписки на этот маршрут не годится.
# Перегрузка, сеть и 5xx вторым кошельком не лечатся и сюда не входят.
# max_calls_per_day = 0 означает «второй контур не использовать»: платный маршрут не
# включается молчанием конфига, только явным числом. То же и про деньги:
# max_usd_per_day = 0 — запрет, а не «безлимит».
[models.cloud.providers.zai.fallback]
enabled = true
label = "General API (платный)"
base_url = "https://api.z.ai/api/paas/v4"
key_env = "ZAI_GENERAL_API_KEY"
key_file = ".claude/council/.zai-general-key"
when = ["quota", "no_balance"]
max_calls_per_day = 10
# Два независимых потолка. Только вызовов мало: подписка тарифицируется обращениями, а
# здесь платят за токены — десять вызовов с раздутой капсулой стоят непредсказуемо дороже
# десяти обычных. Упирается в любой из двух — маршрут закрыт до следующих суток.
max_usd_per_day = 1.0

# Прайс ЭТОГО контура за 1M токенов — не общий models.cloud.pricing: там те же модели
# стоят 0, потому что покрыты подпиской. Без собственного прайса платный вызов записался
# бы в журнал как бесплатный, и денежный потолок не срабатывал бы никогда.
# Значения оценочные и намеренно завышены (точные — в кабинете Z.AI): при завышении
# потолок срабатывает раньше, чем потрачены деньги, а не позже. Модель без прайса на
# платный маршрут не уходит вообще — цена вызова неизвестна, ограничивать нечем.
[models.cloud.providers.zai.fallback.pricing."glm-4.6"]
in_per_mtok = 0.8
out_per_mtok = 3.0

[models.cloud.providers.zai.fallback.pricing."glm-4.7"]
in_per_mtok = 0.8
out_per_mtok = 3.0

[models.cloud.providers.zai.fallback.pricing."glm-5"]
in_per_mtok = 1.5
out_per_mtok = 6.0

[models.cloud.providers.zai.fallback.pricing."glm-5.1"]
in_per_mtok = 1.5
out_per_mtok = 6.0

[models.cloud.providers.zai.fallback.pricing."glm-5.2"]
in_per_mtok = 1.5
out_per_mtok = 6.0

[models.cloud.providers.zai.fallback.pricing."glm-5.3"]
in_per_mtok = 1.5
out_per_mtok = 6.0

[models.cloud.providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta"
models = ["gemini-3.6-flash"]
timeout_seconds = 180

# ИИ-шлюз продукта — запасной путь, когда GLM недоступен (решение владельца d-council-openrouter = fallback-free,
# 23.10). Модели — логические профили маршрутов внутренней компании: executive.fast|standard|deep → OpenRouter :free.
# Денег не тратит: бюджет шлюза $0 пропускает только бесплатные цели (PR #348), лимит кредита в OpenRouter — 0.
# Ключ hrhx_… — env HRH_GATEWAY_KEY или файл .claude/council/.gateway-key (chmod 600, в .gitignore).
[models.cloud.providers.gateway]
base_url = "https://app.hrhelper.space/api/v1/ai-gateway/v1"
models = ["executive.fast", "executive.standard", "executive.deep"]
timeout_seconds = 200

# Локальный llm-gateway (127.0.0.1:8789, infra/llm-gateway) — авторотация бесплатных моделей
# OpenRouter на ЛИЧНОМ ключе владельца (OPENROUTER_KEY_1; решение hybrid_primary, 2026-10-28).
# «Модели» — пулы шлюза, не конкретные модели: auto — топ бесплатных с tools, free — все :free;
# конкретную модель на каждый запрос выбирает и ротирует шлюз. Прайс 0 — расход держат
# rate_limits.local_gateway (free-тир без кредитов ≈ 20 RPM / 50 вызовов в сутки). Ключ шлюза —
# клиентский токен (env LLM_GATEWAY_TOKEN / infra/llm-gateway/.state/token), не OpenRouter.
# Требует живого демона шлюза: потушен → провайдер «недоступен», hybrid-арбитраж ждёт/fallback.
[models.cloud.providers.local_gateway]
base_url = "http://127.0.0.1:8789/v1"
models = ["free", "auto"]
timeout_seconds = 420

# Лестница внутри подписки. Порядок в `ladder` = порядок обхода: берём первую ступень,
# следующую — только если предыдущая не дала валидного ответа. «Сразу самую сильную»
# не делаем: на подписке это тратит ту же квоту, но лишает дешёвого шага.
# glm-4.7-flash в план НЕ входит (стабильный 429) — как бесплатный ярус не годится.
[models.cloud.roles]
ladder = ["glm-4.6", "glm-4.7", "glm-5", "glm-5.2"]
judge = "glm-5.2"               # ступень по умолчанию для арбитража тупика
long_context = "gemini-3.6-flash"

# Бюджет. Единица расхода подписки — ВЫЗОВ за скользящее окно, не токен: обращение на
# 20k токенов стоит столько же, сколько на 200. Поэтому главный стоп — по вызовам.
# Ноль = запрет, а не «безлимит».
[models.cloud.budget]
max_calls_per_run = 2         # одна карточка не может утащить больше двух облачных ответов

# Потолок на карточку для профилей, где облако ВЕДЁТ консилиум, а не спасает его
# (models.roles.hybrid / models.roles.cloud). Двух вызовов там не хватает даже на
# раунд предложений. Окно и суточные лимиты этим НЕ переопределяются — они общие,
# иначе профиль превращается в дыру в бюджете подписки.
# Окно плана. Точное число промптов смотреть в кабинете Z.AI — оно зависит от тарифа.
# Здесь намеренно занижено: упереться в собственный консервативный потолок безопаснее,
# чем в потолок провайдера посреди прогона по борду.
window_hours = 10
max_calls_per_window = 100
max_calls_per_day = 120
# Токены на подписке не тарифицируются, но лимит оставлен как предохранитель от
# аномалии (капсула распухла — значит, что-то сломалось в отборе улик).
# Поднят вместе с max_tokens_out: 60 вызовов по 16k — это 960k, старый потолок 800k
# срабатывал бы раньше окна и маскировался под «облако молчит».
max_tokens_per_day = 2000000
# GLM-4.x/5.x — reasoning-модели: «мысли» идут в счёт output и съедают лимит ДО ответа.
# При 2000 арбитраж по схеме возвращает пустой content. 4000 тоже оказалось мало —
# замер на живой карточке 2026-08-13 (профиль cloud, run_6f453e83b703):
#   • proposer.code упёрся ровно в 4000 и отдал предложение, обрезанное на полуслове —
#     это заметил рецензент, отдельным блокирующим возражением;
#   • critic(proposer.code) израсходовал все 4000 на reasoning и не ответил вовсе,
#     из-за чего предложение коллеги осталось без единой рецензии.
# На подписке тарифицируется ВЫЗОВ, а не токен, поэтому щедрый потолок ничего не стоит,
# а тесный превращает оплаченный вызов в пустой. 16000 — с запасом на reasoning + ответ.
max_tokens_out = 32000
# Денежный потолок применим только к pay-as-you-go провайдерам (Gemini). Для моделей,
# покрытых подпиской, прайс = 0 и этот стоп по ним не срабатывает — их держит окно.
max_usd_per_day = 0.0

# Потолок на карточку для профилей, где облако ВЕДЁТ консилиум, а не спасает его
# (models.roles.hybrid / models.roles.cloud). Двух вызовов там не хватает даже на раунд
# предложений. Окно и суточные лимиты этим НЕ переопределяются — они общие, иначе
# профиль превращается в дыру в бюджете подписки.
#
# Подтаблица стоит ПОСЛЕДНЕЙ в [models.cloud.budget] намеренно: в TOML заголовок
# подтаблицы закрывает родительскую, и всякий скалярный ключ после него уезжает внутрь
# подтаблицы. Ставить её выше — значит тихо потерять window_hours и остальные лимиты.
[models.cloud.budget.max_calls_per_run_by_profile]
hybrid = 2                    # арбитраж + одна ступень лестницы, если первая промолчала
cloud = 8                     # 2 предложения + 2 рецензии + арбитраж, с запасом на повтор
# Облачная эскалация (models.cloud_escalation): прогон, ждавший памяти, начинается, только
# если в окне свободно не меньше этого потолка — иначе оборвался бы на середине и сжёг вызовы.
escalation = 12

# Внешние лимиты частоты — не деньги, а RPM/RPD провайдера. Считаются локально:
# Gemini остаток в заголовках не отдаёт.
# OpenRouter :free — около 50 запросов в сутки без купленных кредитов (точное число — в кабинете), его делят
# консилиум и ИИ-совет продукта. Консилиуму — не больше 40 запросов за скользящие 24 ч (удачных и нет) и не больше 20
# за 30 мин, чтобы день не уходил за час; суточный потолок всего шлюза — «вызовов в сутки» в админке.
[models.cloud.rate_limits.gateway]
max_calls_per_2min = 10
max_calls_per_30min = 20
max_requests_per_24h = 40

# Личный ключ free-тира OpenRouter (≈20 RPM, ≈50 вызовов/сутки без кредитов на балансе):
# потолки консервативные, отдельные от квоты продуктового шлюза выше.
[models.cloud.rate_limits.local_gateway]
max_calls_per_2min = 8
max_calls_per_30min = 20
max_requests_per_24h = 40

[models.cloud.rate_limits.gemini]
max_calls_per_2min = 4
max_calls_per_30min = 10

# Прайс за 1M токенов. Модели Coding Plan покрыты подпиской — 0, деньги за них не
# считаются (расход держит окно квоты). Для Gemini значения оценочные и намеренно
# завышены: при завышении потолок срабатывает раньше, чем потрачены деньги.
[models.cloud.pricing."glm-4.6"]
in_per_mtok = 0.0
out_per_mtok = 0.0

[models.cloud.pricing."glm-4.7"]
in_per_mtok = 0.0
out_per_mtok = 0.0

[models.cloud.pricing."glm-5"]
in_per_mtok = 0.0
out_per_mtok = 0.0

[models.cloud.pricing."glm-5.2"]
in_per_mtok = 0.0
out_per_mtok = 0.0

# Шлюз на бесплатных моделях — 0: платную цель бюджет $0 не пропустит.
[models.cloud.pricing."executive.fast"]
in_per_mtok = 0.0
out_per_mtok = 0.0

[models.cloud.pricing."executive.standard"]
in_per_mtok = 0.0
out_per_mtok = 0.0

[models.cloud.pricing."executive.deep"]
in_per_mtok = 0.0
out_per_mtok = 0.0

[models.cloud.pricing."gemini-3.6-flash"]
in_per_mtok = 0.3
out_per_mtok = 2.5

# Пулы локального шлюза — бесплатный OpenRouter, 0: расход держит rate_limits.local_gateway.
[models.cloud.pricing."free"]
in_per_mtok = 0.0
out_per_mtok = 0.0

[models.cloud.pricing."auto"]
in_per_mtok = 0.0
out_per_mtok = 0.0

# Условия эскалации. Обязательные: профиль deep и трек не half_baked (сырую постановку
# облако не чинит — её чинит владелец, §7а). Достаточное — любое из остальных.
# ─────────────────────────────────────────────────────────────────────────────
# Облачная эскалация (§17.4, cloud_escalation.py) — решение владельца 2026-10-08.
# Задача ждёт памяти дольше after_seconds → её тяжёлые (L) роли уходят в облако; профиль,
# трек, промпты ролей, капсула, указания владельца (у ревью — состав, метод, фокус агентов,
# temperature, бюджет досье, политика вердикта) остаются от исходного агента, S-роли — локально.
# Облачный сервис недоступен → следующий провайдер; недоступны все → живой пинг API и
# повтор по ответу: квота кончилась — время сброса + quota_margin_seconds; перегружен или
# сеть — через overload_retry_seconds; ответил — через available_retry_seconds; ключа нет
# или конфиг — через quota_unknown_retry_seconds (ожиданием не лечится).
# ─────────────────────────────────────────────────────────────────────────────
[models.cloud_escalation]
enabled = true
after_seconds = 7200
providers = ["zai", "gateway", "local_gateway", "gemini"]  # порядок обхода; второй контур zai (General API) — внутри zai, по его when;
                                          # gateway — бесплатный OpenRouter через шлюз продукта, только после GLM;
                                          # local_gateway — бесплатный OpenRouter на личном ключе (:8789), последний бесплатный рубеж перед Gemini
quota_margin_seconds = 120          # «токенов не хватило» → время сброса + 2 мин
overload_retry_seconds = 300        # «сервис перегружен» (и сеть) → через 5 мин
available_retry_seconds = 60        # пинг ответил — сбой был разовым
quota_unknown_retry_seconds = 3600  # время сброса не сообщено / нет ключа / конфиг
# Прерванный прогон начинается заново, потраченные вызовы пропадают: после max_deferrals
# откладываний подряд задача ждёт облако giveup_seconds (замер: 33 вызова на одно ревью).
max_deferrals = 3
giveup_seconds = 21600

# Роль → облачная модель на каждого провайдера; default — любая другая роль/агент ревью,
# judge — судья ревью. proposer.code и proposer.arch — разные модели: два голоса одной
# модели независимых мнений не дают (тот же инвариант, что у профилей).
[models.cloud_escalation.models.zai]
"proposer.code" = "glm-4.6"
"proposer.arch" = "glm-4.7"
"proposer.skeptic" = "glm-4.6"
arbiter = "glm-5.2"
judge = "glm-5"
default = "glm-4.6"

# Через шлюз: разные профили — разные маршруты и модели, поэтому proposer.code и proposer.arch не один голос.
# Профилей три на четыре роли — совпадение неизбежно; арбитр делит модель со скептиком, а не с автором предложения
# (ревью «Контроля» #349): оценивать предложение той же модели арбитру нельзя.
[models.cloud_escalation.models.gateway]
"proposer.code" = "executive.standard"
"proposer.arch" = "executive.deep"
"proposer.skeptic" = "executive.fast"
arbiter = "executive.fast"
judge = "executive.deep"
default = "executive.standard"

[models.cloud_escalation.models.gemini]
default = "gemini-3.6-flash"

# Локальный шлюз: только два псевдо-имени (пулы auto/free), конкретную модель ротирует шлюз.
# Ротация на каждый запрос ⇒ пул ≠ «одна и та же модель»: арбитр (free) делит пул с arch,
# но не с автором код-предложения (auto) — инвариант ревью #349 соблюдён по авторству code.
[models.cloud_escalation.models.local_gateway]
"proposer.code" = "auto"
"proposer.arch" = "free"
"proposer.skeptic" = "auto"
arbiter = "free"
judge = "auto"
default = "auto"

# ─────────────────────────────────────────────────────────────────────────────
# Режим «всё на GLM 5.x» (§17.6, glm_mode.py) — решение владельца 2026-10-09.
# Каждая модельная роль прогона (включая extractor — расширение терминов поиска капсулы/досье)
# — в подписку Coding Plan (providers.zai; платный General API в режиме закрыт кодом) на
# модели 5-го поколения; локально остаётся только embed (у Coding API нет эмбеддингов, а
# вектор другой модели несовместим с корпусом). Включается тумблером в шапке UI (флаг в
# council_state, без рестарта — действует на прогоны, взятые после переключения) или
# отметкой «GLM 5.x» на отдельной задаче (runs.cloud_mode = 'glm5', у ревью — в запросе).
# Прогон начинается, только если окно и сутки вмещают его потолок (max_calls_per_run), иначе
# ждёт на своём месте в очереди — не воздерживается на пустых раундах.
#
# Лимиты ниже действуют, пока режим включён (шапка) или идёт прогон, отмеченный режимом;
# выключен — снова [models.cloud.budget]. Там окно занижено (100/10 ч) под фоновое облако
# (арбитраж тупиков, эскалация), а здесь облако — это весь консилиум. 500 за 10 ч — заявленная
# владельцем ёмкость подписки; правится в Настройках → «Облако», воркер подхватывает после
# рестарта (сам тумблер рестарта не требует).
# ─────────────────────────────────────────────────────────────────────────────
[models.glm_all]
# Тумблер шапки «всё на GLM 5.x» — для ревью. Проработки карточек — локально (строго по одной), если не true:
# квоты Coding Plan (~46 вызовов glm-5 за 5 ч) на них не хватает — решение владельца 2026-10-15.
runs_on_glm = false
window_hours = 10
max_calls_per_window = 500
# Не меньше окна (валидатор): иначе окно никогда не сработает и настройка вводит в заблуждение.
max_calls_per_day = 1200
# Потолок на один прогон: 8-агентное ревью + оспаривание + судья + перекрёстные проверки, или
# deep-проработка (3 предложения + 6 рецензий + арбитр + спираль 2×2 + облачный судья тупика)
# — ~20–30 вызовов. 40 — с запасом на повторы; больше одной карточке не дать съесть окно.
max_calls_per_run = 40
# Предохранитель от аномалии (капсула распухла), а не тариф: подписка считает вызовы.
# Общий 2M/сутки при 1200 вызовах сработал бы на ~150-м и маскировался бы под «окно».
max_tokens_per_day = 20000000

# Роль → модель 5.x. Ключи в кавычках все (не только proposer.*), чтобы их не путали с
# одноимёнными ключами [models.cloud.roles]. default — любая другая роль, в т. ч. агенты ревью.
# Три proposer.* — РАЗНЫЕ модели: одна модель на двух ролях независимых мнений не даёт
# (тот же инвариант, что у профилей). Арбитр и судья — glm-5.2, проверенная на подписке и не
# пишущая ни одного предложения: арбитр не оценивает собственное (как и в models.roles.deep).
[models.glm_all.models]
"proposer.code" = "glm-5"
"proposer.arch" = "glm-5.1"
"proposer.skeptic" = "glm-5.3"
"arbiter" = "glm-5.2"
"extractor" = "glm-5"
"judge" = "glm-5.2"
"default" = "glm-5"

[models.cloud.escalate_when]
require_profile = "deep"
never_for_tracks = ["half_baked"]
local_abstained = true
confidence_lt = 0.45
# Потолок «и так хорошо»: при уверенности выше него облако не зовётся вообще, какая бы
# ни была severity. Без этого каждая critical-карточка = облачный вызов, а critical на
# борде десятки — это и есть сценарий «сжечь бюджет, ничего не улучшив».
skip_if_confidence_gte = 0.75
severity_in = ["critical"]
modules_gt = 4

# ─────────────────────────────────────────────────────────────────────────────
# Протокол консилиума (§5)
# ─────────────────────────────────────────────────────────────────────────────
[council]
# M2/M3 (2026-10-15): один дополнительный раунд вместо немедленного воздержания — сверка при расхождении
# файлов/цели, дожим при лучшей оценке от push_min_score до порога. Только если в запасе не меньше потраченного.
extra_round = true
push_min_score = 7
# Резерв на арбитра после доп. раунда (замер 15.10: арбитр glm4 — в среднем 33 с, максимум 64 с за 14 дней).
extra_round_reserve_seconds = 120
# M6: ответ на чужом языке — один повтор компактным промптом (textutil.has_foreign_script).
language_gate = true
# Измерено 2026-08-13 на этой машине: раунд арбитража glm4 по пакету ~12k символов
# идёт 7+ минут, то есть 420 с не хватало даже на профиль fast — карточка вылетала
# по таймауту вместо вердикта. 900 с — с запасом; арбитр получает остаток бюджета
# как request timeout (council.py arbitrate), поэтому лимит теперь реальный, а не декларация.
max_wall_seconds_per_card = 900
max_rounds = 5
rebuttal_rounds = 1
abstain_threshold = 9         # из 15 по рубрике
max_hallucinations = 2
scope_agreement_min = 0.25    # Jaccard по touched.files между предложениями
# Второй, более фундаментальный признак сырой постановки: расхождение не в РЕШЕНИИ
# (файлы могут формально совпасть), а в понимании ЦЕЛИ — каждый proposer по-своему
# прочёл, что вообще нужно сделать. Порог ниже, чем у scope_agreement_min: Jaccard по
# стеммированным словам прозы (goal — переформулированное предложение) естественно даёт
# меньшее перекрытие, чем Jaccard по точным путям файлов, даже когда цель понята
# одинаково — это стартовое значение, не откалиброванное на реальных прогонах
# (в отличие от scope_agreement_min, который уже прошёл через живые измерения).
goal_agreement_min = 0.15
temperature_proposer = 0.3
temperature_critic = 0.1
temperature_arbiter = 0.2

[council.self_consistency]
"proposer.skeptic" = 3        # reasoning-модель: 3 сэмпла, мажоритарный ответ
# Единственная роль, которая реально придумывает решение (в отличие от proposer.code,
# привязанного к конкретным кодовым уликам) — ей же и нужнее всего честное расхождение
# кандидатов, а не одна консервативная попытка. Тот же механизм, что у скептика: N
# сэмплов при temperature=0.6 (см. propose() — при samples>1 конфигурная temperature_
# proposer игнорируется в пользу этого фиксированного значения), мажоритарный ответ по
# touched.files. Дороже одного прохода на 1 лишний вызов proposer.arch на карточку.
"proposer.arch" = 2

# R5 — адверсариальная спираль (§5а): после слияния арбитра отдельная модель АТАКУЕТ
# решение (дивергентная фаза), арбитр устраняет блокирующие возражения (конвергентная
# фаза), и так по кругу до сходимости. Стоп-критерии считаются кодом: возражений нет /
# возражения перестали меняться / лимит раундов / бюджет времени.
[council.adversarial]
enabled = true
max_rounds = 2                # раунд = одна атака + одна ревизия
role = "proposer.skeptic"     # нет такой роли в профиле (fast) → arbiter
temperature = 0.4             # выше обычного: дивергенция должна быть шире
temperature_revise = 0.2
max_blocking = 3              # больше — не конкретика, а шум
repeat_jaccard = 0.6          # совпадение возражений с прошлым раундом = цикл, стоп

[council.context]
# M1 (2026-10-15): 600 токенов обрезали постановку до ~940 символов у 126 из 150 карточек с вердиктами — «файл
# назван в постановке», а модели его не видели. 1600 — медиана карточки целиком; промпт ~4.1k из num_ctx 8192.
pinned_tokens = 1600
evidence_tokens = 1800
per_source_tokens = 600

[council.session_context]
# P4 (Ф2): рабочая сессия владельца (план владельца B) — итоговый контекст
# принадлежит сессии, не карточке. enabled=false → поведение как до P4:
# сессии не открываются лениво, pinned-блок прошлой сессии не добавляется.
enabled = true
idle_close_hours = 12
max_summary_tokens = 300
session_tokens = 200          # бюджет pinned-блока «контекст прошлой сессии» в retrieval.build

# ─────────────────────────────────────────────────────────────────────────────
# Планировщик (§8)
# ─────────────────────────────────────────────────────────────────────────────
[planner.window]
date = "today+1"
from = "09:30"
to = "18:00"
focus_ratio = 0.7             # доля реально продуктивного времени

[[planner.window.breaks]]
from = "13:00"
to = "14:00"

[planner.effort_minutes]
S = 30
M = 90
L = 240
XL = 480

[planner.weights]
severity = 3.0
priority = 2.5
readiness = 2.0
unblocks = 1.5
coupling = 1.0
staleness = 0.5

[planner]
# Режим сервиса (`planner_service.py --watch`, так его поднимает супервизор): как часто
# пересобирать план. План уезжает в таблицу `plans`, её читает вкладка «План» в UI.
rebuild_minutes = 30
# Писать ли при этом в docs/plans/BACKLOG.md и plan-latest.json. По умолчанию нет:
# рабочий документ владельца фоном не правится, для записи есть операция
# «Собрать план и записать» (она же `npm run ai-council:plan-apply`).
watch_apply = false
hard_rules =["bugs_before_tasks", "no_half_baked_in_window", "respect_blocked_by", "pin_in_progress"]
llm_adjacent_swaps = 3

# ─────────────────────────────────────────────────────────────────────────────
# Куда выводить (§10, §12). Решение D3 — BACKLOG.md, в делимитированный блок.
# ─────────────────────────────────────────────────────────────────────────────
[outputs]
plan_file = "docs/plans/BACKLOG.md"
plan_marker = "ai-council:plan"
plan_json = ".claude/council/plan-latest.json"

# Белый список записи в Notion (решение D2, §10). false = операция физически не выполняется.
# Заморожено решением R-084 / d-tb-canon-3010 (30.10): канон открытого — t-boards, все операции false.
# Включить любую — только новым решением владельца; транспорт всё равно отклонит запись при sources.notion.read_only.
[outputs.notion_writeback]
elaboration_block = false
comments = false
priority = false               # Priority (Задачи) / Severity (Ошибки)
module_augment = false         # только из 16 канонических опций, новых не создаём
task_type = false
backlog_id_if_empty = false
tags = false                   # требует свойства Tags — шаг S1
council_readiness = false      # поле консилиума (S1); после заморозки не пишется никем
relations = false              # требует Related / Related bugs — шаг S1
child_pages = false
status_changes = false        # C4 — потолок агента «на ревью», решает человек
unset_half_baked = false      # §7а — снимает владелец
archive = false               # API умеет, консилиуму не выдаётся

[outputs.limits]
max_new_tags_per_run = 5
max_children_per_card = 8
max_new_pages_per_run = 20
require_apply_flag_for_page_creation = true   # dry-run по умолчанию

# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
# Обучение без дообучения (§9). Читается learning.py.
[learning]
enabled = true
exemplars_per_prompt = 2
rubric_drift_suggest_after = 3
rebuild_minutes = 30          # период фонового прохода (`learning.py --watch`)

# Взвешивание рецензий по надёжности рецензента. На пустой статистике все веса ровно
# 1.0, поэтому включение ничего не меняет, пока вердиктов нет.
review_weighting = true

# Сколько сигналов должно накопиться, чтобы тройка (модель, роль, модуль) считалась
# измеренной. Ниже порога вес рецензента 1.0, а рекомендация по ролям откатывается
# на репутацию модели целиком — один вердикт не должен решать, кто чего стоит.
min_observations = 3

# Автоматическая перестановка ролей между моделями ростера по статистике.
# ВЫКЛЮЧЕНО намеренно: состав ролей — то, что владелец задал руками и по причинам,
# записанным в комментариях к [models.roles.*]. Рекомендация считается и видна в UI
# всегда, применяется — только с этим флагом.
role_selection = false

# Модель для кластеризации причин отклонений (§9, механизм 4). Пусто → роль
# `extractor` из профиля fast.
cluster_model = ""

# Облачная кластеризация дрейфа (M10, docs/ai/COUNCIL-DRIFT-DESIGN.md §2): локальные 7–9B не держат правило
# «кластер — дефект, а не тема», glm-5 держит. Не чаще раза в cluster_cloud_every_hours и только при доступной квоте
# подписки (платный второй контур не используется) — при 12 ч это ≤ 2 вызовов GLM в сутки; иначе — cluster_model.
# Пусто — только локальная. Почему проход ушёл в локальную модель — поле cloud_skipped в его сводке.
# cluster_cloud_every_hours = 0 — облако выключено; неверное значение (не число, ≤ 0) — тоже выключено, не 12.
cluster_cloud_model = "glm-5"
cluster_cloud_every_hours = 12

# Порог Жаккара по токенам, при котором новый кластер считается переформулировкой
# известного предложения той же мишени (§9, механизм 4). Без него таблица предложений
# растёт переформулировками одного дефекта — замер 2026-09-02: 65 строк, из которых
# большинство — вариации четырёх тем («коммуникация моделей» в 12 формулировках).
dedup_jaccard = 0.55

[gateway]
host = "127.0.0.1"
port = 8790

[supervisor]
services = ["gateway", "notion-sync", "context", "council", "council-cloud-1", "planner", "learning"]
# Одна облачная полоса `council-cloud-1` (2026-10-15): GLM-работу (ревью по тумблеру, отмеченные задачи) берёт
# она, а основной воркер в это время ведёт локальные модели строго по одной — консилиум не простаивает ни
# в ожидании квоты, ни пока GLM 20 минут делает ревью. Локального инференса в полосе нет, кроме эмбеддингов
# под общим локом (ollama.local_inference_slot). Больше одной полосы не ставить: узкое место — 5-часовая
# квота Coding Plan (46 вызовов glm-5 за 2 ч 45 мин одним воркером, 14.10), вторая полоса съест окно вдвое
# быстрее без прироста.
council_workers = 1
restart_backoff_seconds = 5
max_restarts_per_hour = 10
stale_run_ttl_seconds = 900

# ─────────────────────────────────────────────────────────────────────────────
# PLANNED — НЕ АКТИВНО. Routing policy (L0–L5), serena graph-first пороги,
# headroom-пороги сжатия и persistent graph store. Эти секции НИЧЕМ не читаются:
# config.py/supervisor.py их не знают (см. grep routing infra/ai-council/*.py).
# Раскомментировать только вместе с реализацией потребителя — иначе это мёртвый
# конфиг, выдающий себя за рабочую политику. Канон поведения сейчас: спека
# docs/specs/ai-council.md + роли моделей [models.roles.*] выше.
#
# [routing.simple]
# executor = "zai_glm"; reviewers = ["local_glm"]; max_rounds = 2; max_changed_files = 3
# [routing.medium]
# executor = "claude"; reviewers = ["local_glm", "qwen_code", "free_glm_api"]; max_rounds = 5
# [routing.complex]
# executor = "claude"; max_rounds = 6; require_graph_impact = true; require_test_plan = true
# [routing.risky]
# executor = "claude"; max_rounds = 8; require_adr = true; require_rollback_plan = true
#   риски-триггеры: schema migration / RBAC / PII / public contract → всегда risky
# [routing.hard_veto]
# categories = ["tenant_isolation", "rbac", "pii_or_secret", "data_loss",
#   "irreversible_migration", "breaking_contract", "critical_test_failure", "security_bypass"]
#   hard veto не снимается большинством голосов
# [serena]
# required = true; min_coverage_threshold = 0.7 — ниже порога risky-задача → plan-only
# [headroom]
# compress_threshold_bytes = 8192; skip = migration/security/final_diff/PII
# [graph]
# store = "sqlite"; revision_source = "git"; auto_refresh = true
